name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate card data
        run: npm run validate
      - name: Broken sample card must fail validation
        run: "! npx tsx scripts/validate.ts tests/fixtures/broken"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7
