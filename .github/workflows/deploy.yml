# Deploys dist/ to the VPS (served via Cloudflare Tunnel) on push to main.
# Off until set up — see DEPLOY.md "Deploy on push":
#   secrets DEPLOY_SSH_KEY (private key of a key allowed only to rsync into the site dir),
#           DEPLOY_HOST (deploy@<server>), DEPLOY_KNOWN_HOSTS (ssh-keyscan output)
#   variable DEPLOY_ENABLED = true
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          # "/" when the key is restricted with rrsync to the site directory
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/quartermaster/site/' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete --delay-updates --exclude='*.map' -e "ssh -i ~/.ssh/id_deploy -o BatchMode=yes" dist/ "$DEPLOY_HOST:$DEPLOY_PATH"
