note: "ZK344 (s/n BS105) falls in the RAF Tranche 2 serial block, so #17 and #18 are marked as the exact variant. ZJ914 (#12-15) is a Tranche 1 airframe. ZR515 (#7) is a Qatari Tranche 3 aircraft. The tranche of 30+68 (#11) is unconfirmed, so it is marked same_family. #3, #9, #10 and #19 do not identify a tranche, and #4, #6 and #20 are not the aircraft."
