note: "I picked three real photos that show the TB2 airframe itself. I skipped the user maps (#3, #4, #6, #7, #8), the information board (#5) and the cafe (#12), and the other Baykar types: Akıncı (#11, #15) and Kızılelma (#14, #16). I also left out #13 because it centres on a Kemankeş munition rather than the aircraft. #1, a runway photo, is a possible alternative; it has a wide crop and minimal description."
