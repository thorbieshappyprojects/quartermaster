note: "Candidates #4–#8 are all explicitly titled ZTZ-99A and show the same tank on display at the Military Museum of the Chinese People's Revolution in 2017. It is a real vehicle, not a mock-up. #5 is named as a front-right view, so it was picked first, followed by #7 and #6. #8 was skipped because it is a frontal view. The 2015 parade images do not name the variant, so they were not used."
