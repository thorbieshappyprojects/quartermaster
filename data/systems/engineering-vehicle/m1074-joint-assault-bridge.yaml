id: m1074-joint-assault-bridge
category: engineering-vehicle
name: "M1074 JAB"
variant_note: "Full-rate production configuration launching the MLC 115 Heavy Assault Scissor Bridge"
family: "M1 Abrams"
aliases: ["Joint Assault Bridge", "JAB", "Joint Assault Bridge System", "JABS"]
manufacturer: { name: "Leonardo DRS (DRS Sustainment Systems Inc.)" }
production_sites:
  - { place: "West Plains", country: US, source: s10 }
  - { place: "Anniston", country: US, source: s7 }
origin: US
role: "Armoured vehicle-launched bridge on an M1A1 Abrams hull that launches and recovers a scissor bridge so armoured brigades can cross wet or dry gaps."
memorable_fact: { text: "The JAB puts a hydraulic bridge launcher on an M1A1 Abrams tank hull with heavier M1A2 suspension. It replaces the M104 Wolverine and the older M48/M60-based AVLB.", source: s2 }
status: in_production
in_service_since:
  value: 2016
  source: s11
  confidence: low
  note: "Year of first service of the M1074 base system as given by Wikipedia (no primary source found). Low-rate production at Anniston Army Depot started in FY2016 with 10 vehicles (s7). Full-rate production was approved in FY2021 (DOT&E FY2022 report, s9). DOT&E judged the JAB operationally effective and suitable (s8)."
units_built:
  value: 100
  source: s3
  confidence: high
  note: "Lower bound: Leonardo DRS reported delivering the 100th JAB to the US Army (reported as February 2024). Army budget data reported by Army Recognition list 116 vehicles procured before FY2024, 26 in FY2024 and 28 in FY2025 (s5). In 2025 the Army cut the procurement objective from 297 to 213 systems (s6)."
specs:
  bridge_span:
    value: 18.3
    source: s2
    confidence: high
    note: "Manufacturer's figure for the length of the scissor bridge (60 ft). Army Recognition cites an Army modernization paper saying the JAB spans an 11 m gap in about three minutes (s5)."
  lift_capacity: { value: null, source: null, confidence: null }
  load_class:
    value: 115
    source: s2
    confidence: high
    range: { min: 85, max: 115 }
    note: "Leonardo DRS spec sheet: Heavy Assault Scissor Bridge MLC 115 (MLC 120 with caution). An Army sources-sought notice (s6) and the Leonardo DRS 100th-unit release (s3) also give MLC 115. The Leonardo DRS product page still says MLC 85 AVLB (s1), and Wikipedia says MLC 95. The manufacturer's spec-sheet figure is displayed."
  deployment_time:
    value: 3
    source: s2
    confidence: high
    range: { min: 3, max: 5 }
    note: "Manufacturer gives 3-5 min for launch in primary mode (retrieval 6-10 min). The lower bound is displayed because an Army paper cited by Army Recognition (s5) also gives about three minutes."
  combat_weight:
    value: null
    source: null
    confidence: null
    note: "No manufacturer or government figure found. A Wikipedia-derived wiki gives 62.3 t (68.7 short tons), which was not used."
  crew: { value: null, source: null, confidence: null }
operators:
  - { country: US, force: "Army", state: in_service, quantity: null, source: s5 }
  - { country: RO, force: "Land Forces", state: ordered, quantity: null, source: s4 }
cost:
  value: 2249000
  currency: USD
  price_year: 2026
  basis: contract_per_unit
  source: s5
  confidence: medium
  note: "Contract modification announced 31 March 2026 to DRS Sustainment Systems: USD 44.98 million for 20 JAB systems including spares, completion March 2027 (44.98M / 20). Army Recognition says the FY2026 budget lists a unit contractor cost of about USD 2.2 million and a gross weapon-system cost of USD 124.95 million for the 20-vehicle buy."
contracts:
  - { customer: "US Army", year: 2026, quantity: 20, value: 44980000, currency: USD, note: "Contract modification for production and spares through March 2027, in line with the FY2026 procurement plan.", source: s5 }
