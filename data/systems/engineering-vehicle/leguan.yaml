id: leguan
category: engineering-vehicle
name: "Leguan Leopard 2"
variant_note: "Leguan laying system on Leopard 2 tank chassis with one 26 m or two 14 m MLC 80 bridges"
family: "Leguan"
aliases: ["Panzerschnellbrücke Leguan", "Gefechtsfeldbrücke (GFB)", "Brückenlegepanzer Leguan", "Leopard 2L (Finland)", "Leopard 2A8 Leguan (Lithuania)"]
manufacturer: { name: "KNDS Deutschland" }
origin: DE
role: "Tracked armoured bridge layer that carries, lays and recovers one 26 m or two 14 m MLC 80 bridges so heavy forces can cross gaps such as rivers and ditches."
memorable_fact: { text: "Leguan pushes its bridge out horizontally instead of unfolding it upward like a scissor bridge, so the crossing is harder for an enemy to spot and fire on.", source: s2 }
status: in_production
in_service_since:
  value: 2004
  source: s6
  confidence: medium
  range: { min: 2004, max: 2005 }
  note: "Year the Leopard 2 version first entered service, in Finland as the Leopard 2L. The Finnish Defence Forces say these vehicles have been acquired since 2004 (s6). Trade press gives first-batch deliveries as 2005-08 (s7). The Bundeswehr says Leguan has reached its units since 2019 (s2). German Wikipedia says the first battalion was equipped in December 2018 (s13). Earlier Leguan versions on other chassis are not counted here."
units_built:
  value: 250
  source: s5
  confidence: low
  note: "Whole family, all tracked chassis types (including Leopard 1, M60, PT-91 and M1-based versions). Trade press quotes KNDS as saying it has supplied 'almost 250' tracked plus 45 wheeled Leguan systems to about 22 users (s5). 250 is the rounded figure as stated, not an exact count. No public total exists for the Leopard 2 version alone."
specs:
  bridge_span:
    value: 26
    source: s1
    confidence: high
    note: "Length of the long bridge. The vehicle can carry two 14 m bridges instead. The 26 m bridge crosses gaps of about 24-25 m (25 m per s4 and s6; 24 m per s13). Overlapping a 26 m and a 14 m bridge crosses up to 35 m (s2)."
  lift_capacity: { value: null, source: null, confidence: null }
  load_class:
    value: 80
    source: s1
    confidence: high
    note: "Load class of the bridges. Trade press gives MLC 80 as about 72 t (s5). The Bundeswehr says the bridges carry more than 70 t, and up to 90 t in exceptional cases (s2). KNDS lists the vehicle's own weight class as MLC 70 (s1)."
  deployment_time:
    value: 5
    source: s2
    confidence: medium
    range: { min: 5, max: 6 }
    note: "The Bundeswehr gives 5 min to lay a crossing and 7 min to recover it (s2). Lithuania's MoD gives under six minutes for the 25 m span (s4). An older KMW-sourced article gives 6 min for the 26 m bridge (s14). The government figure is shown."
  combat_weight:
    value: 64.5
    source: s2
    confidence: high
    range: { min: 63.5, max: 64.5 }
    note: "64.5 t is the Bundeswehr figure for its Leguan. The Finnish Leopard 2L (Leopard 2A4 chassis) weighs 63.5 t with bridge (s6)."
  crew:
    value: 2
    source: s2
    confidence: high
    note: "Bundeswehr: operated by two people. Laying can be controlled electronically by one person (s14)."
operators:
  - { country: DE, force: Army, state: in_service, quantity: 31, source: s9 }
