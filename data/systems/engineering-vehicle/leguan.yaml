  - { country: SE, force: Army, state: in_service, quantity: 6, source: s13 }
  - { country: NO, force: Army, state: in_service, quantity: 6, source: s12 }
  - { country: DK, force: Army, state: in_service, quantity: 7, source: s11 }
  - { country: FI, force: Army, state: in_service, quantity: 10, source: s13 }
  - { country: FI, force: Army, state: ordered, quantity: 6, source: s7 }
  - { country: SG, force: Army, state: in_service, quantity: 10, source: s13 }
  - { country: LT, force: Army, state: ordered, quantity: 12, source: s3 }
cost:
  value: 17500000
  currency: EUR
  price_year: 2026
  basis: contract_per_unit
  source: s3
  confidence: medium
  note: "Lithuania, January 2026: about EUR 210 million for 12 Leguan Leopard 2 vehicles = EUR 17.5 million each. The price covers two 14 m and one 26 m bridge per vehicle, plus training, special tools and spare parts. Lithuania's MoD states the chassis is the Leopard 2A8 (s4). No unit price has been published."
contracts:
  - { customer: "Germany / Bundeswehr", year: 2016, quantity: 7, value: 88000000, currency: EUR, note: "First batch, signed October 2016 by BAAINBw and KMW. Each system has a converted Leopard 2, one 26 m and two 14 m bridges, and a semitrailer; bought jointly with the Netherlands.", source: s8 }
  - { customer: "Germany / Bundeswehr", year: 2020, quantity: 24, value: 330000000, currency: EUR, note: "Second batch, deliveries 2023-2028 (s15), to replace Biber completely. EUR 330 million is the Defence Ministry figure (s9). KMW gave about EUR 280 million (s10).", source: s9 }
  - { customer: "Lithuania / Armed Forces", year: 2026, quantity: 12, value: 210000000, currency: EUR, note: "Leopard 2 chassis (2A8 per Lithuanian MoD); includes bridges and support package (training, tools, spares).", source: s3 }
peers: [m1074-joint-assault-bridge, k1-avlb]
