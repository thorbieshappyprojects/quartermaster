id: m1150-abv
category: engineering-vehicle
name: M1150 ABV
variant_note: M1150 production standard on overhauled M1A1 Abrams hull (US Army / export)
family: M1 Abrams
aliases: [ABV, Assault Breacher Vehicle]
manufacturer: { name: Anniston Army Depot (U.S. Army) }
production_sites:
  - { place: Anniston, country: US, source: s4 }
origin: US
role: Tracked combat engineer vehicle on an M1A1 Abrams hull that breaches minefields and obstacles using line charges and an interchangeable mine plow or dozer blade.
memorable_fact: { text: "It carries two line-charge systems, takes either a full-width mine plow or a combat dozer blade, and automatically marks the cleared lane behind it.", source: s3 }
status: in_service
in_service_since: { value: 2008, source: s1, confidence: high, note: "Base M1150 system; the U.S. Army article of July 2008 reports the first ABV shipped to the Marines and fielding beginning that month. Wikipedia gives 2009/2010; first combat use was December 2009 (s2)." }
units_built: { value: 239, source: s5, confidence: low, range: { min: 232, max: 239 }, note: "Whole M1150 family. Army Recognition states 239 produced, but its own breakdown (45 USMC + 187 Army) sums to 232. USMC ordered 52 (s2); U.S. Army Acquisition Objective is 201 and Army Procurement Objective 192 (s3). Export builds (e.g. Poland, delivery 2029) are not confirmed as included." }
combat_use: { text: "First used in combat by U.S. Marines in Afghanistan in December 2009 (Operation Cobra's Anger) and later in Operation Moshtarak in 2010; Ukrainian vehicles have been used against Russian forces, with at least two lost in 2024.", source: s5 }
specs:
  bridge_span: { value: null, source: null, confidence: null, note: "Not applicable (not a bridge layer)." }
  lift_capacity: { value: null, source: null, confidence: null, note: "No crane; no public lift figure found." }
  load_class: { value: null, source: null, confidence: null }
  deployment_time: { value: null, source: null, confidence: null, note: "Not applicable (not a bridge layer)." }
  combat_weight: { value: 72, source: s5, confidence: low, note: "Source states '72-ton' without specifying metric tonnes or US short tons (72 short tons would be about 65.3 t); value shown as published. No manufacturer or government figure found." }
  crew: { value: 2, source: s5, confidence: medium, note: "Commander and driver." }
operators:
  - { country: US, force: Army, state: in_service, quantity: 149, source: s6 }
