cost: { value: 4600000, currency: USD, price_year: 2025, basis: contract_per_unit, source: s5, confidence: medium, note: "Poland's July 2025 annex to its January 2023 Letter of Offer and Acceptance (LOA): about USD 115 million net for 25 M1150 including logistics support, training and spares (115M / 25). Wikipedia lists a unit cost of USD 14 million (FY2009) from a secondary database; not used because the underlying source was not verified." }
contracts:
