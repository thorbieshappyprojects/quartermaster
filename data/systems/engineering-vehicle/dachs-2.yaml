role: Tracked armoured engineer vehicle on a Leopard 1 chassis used for earthmoving, excavation, obstacle construction and removal, lifting and vehicle recovery.
memorable_fact: { text: "When prepared for it, the Dachs can drive under water at depths of up to 4 m.", source: s1 }
status: in_service
in_service_since: { value: 1989, source: s3, confidence: medium, note: "Year of this variant. The first series vehicle was handed over on 13 April 1989." }
units_built: { value: 140, source: s3, confidence: medium, note: "German Army vehicles, converted from 104 Bergepanzer 2 and 36 Pionierpanzer 1 rather than built new; s4 gives the same figure. Not included: 9 Badger built for Canada (s5)." }
combat_use: { text: "Germany began handing Dachs vehicles to Ukraine in March 2023 (first three reported) during the Russian invasion. No specific combat actions are publicly documented in the sources found.", source: s10 }
