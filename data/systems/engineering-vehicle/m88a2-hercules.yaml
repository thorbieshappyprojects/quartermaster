id: m88a2-hercules
category: engineering-vehicle
name: "M88A2 HERCULES"
variant_note: "Current US Army model; the planned M88A3 successor was cancelled in July 2025"
family: "M88"
aliases: ["HERCULES", "Heavy Equipment Recovery Combat Utility Lift and Evacuation System", "M88A1E1 Improved Recovery Vehicle"]
manufacturer: { name: "BAE Systems (Land & Armaments)" }
production_sites:
  - { place: "York, Pennsylvania", country: US, source: s4 }
  - { place: "Anniston, Alabama", country: US, source: s4 }
  - { place: "Aiken, South Carolina", country: US, source: s4 }
origin: US
role: "Tracked armoured recovery vehicle that tows, winches and lifts disabled or mired heavy combat vehicles, chiefly Abrams-class tanks, on the battlefield."
memorable_fact: { text: "The M88A1 needed two vehicles to tow an Abrams safely; in August 1998 the M88A2 was approved to tow an Abrams or another 70-ton combat vehicle on its own.", source: s3 }
status: in_service
in_service_since: { value: 1997, source: s3, confidence: medium, note: "Year this variant entered service. First M88A2s went to 1st Cavalry Division, Fort Hood, on 11 Jul 1997. The base M88 entered service in 1961." }
units_built: { value: 914, source: s4, confidence: medium, note: "Total US Army procured quantity of M88A2 after the October 2019 contract (most were M88A1 hulls rebuilt to A2 standard). Excludes later US contracts and foreign sales. ESD (s7) reported about 900 in the US Army inventory in 2023." }
combat_use: { text: "Eight M88A2s sent to Ukraine in 2023 were used to evacuate armoured vehicles; trade press reports two destroyed and one captured and used by Russian forces.", source: s10 }
specs:
  bridge_span: { value: null, source: null, confidence: null, note: "Not applicable (recovery vehicle)." }
  lift_capacity: { value: 31.8, source: s3, confidence: medium, note: "Boom rated at 35 tons (assumed US short tons, about 31.75 t). The same 35-ton figure appears in s6 (with spade down) and s7." }
  load_class: { value: null, source: null, confidence: null }
  deployment_time: { value: null, source: null, confidence: null, note: "Not applicable (recovery vehicle)." }
  combat_weight: { value: 63.5, source: s5, confidence: medium, note: "s5 gives 63,500 kg. FAS (s3) gives a fully loaded weight of 70 tons, which is about 63.5 t if read as US short tons." }
  crew: { value: 3, source: s3, confidence: medium, note: "Reduced from the M88A1's crew of four; s12 also gives three (commander, operator, mechanic)." }
operators:
  - { country: US, force: Army, state: in_service, quantity: null, source: s7 }
  - { country: PL, force: Land Forces, state: in_service, quantity: 38, source: s11 }
  - { country: UA, force: Armed Forces, state: in_service, quantity: 8, source: s10 }
  - { country: IQ, force: Army, state: in_service, quantity: null, source: s8 }
  - { country: KW, force: Land Force, state: in_service, quantity: null, source: s14 }
  - { country: TW, force: Army, state: ordered, quantity: 14, source: s15 }
  - { country: AU, force: Army, state: ordered, quantity: 6, source: s13 }
  - { country: MA, force: Royal Armed Forces, state: ordered, quantity: 25, source: s16 }
  - { country: EG, force: Army, state: ordered, quantity: null, source: s12 }
cost: { value: 3449000, currency: USD, price_year: 2019, basis: contract_per_unit, source: s4, confidence: medium, note: "US Army October 2019 contract: USD 148.3 million to rebuild 43 M88A1 hulls as M88A2 (148.3 / 43, rounded). The July 2015 contract (USD 110.4 million for 36, s9) works out to about USD 3.07 million each." }
contracts:
  - { customer: "US Army", year: 2019, quantity: 43, value: 148300000, currency: USD, note: "M88A1-to-M88A2 conversions; brought total procured to 914; deliveries from February 2021.", source: s4 }
  - { customer: "US Army", year: 2015, quantity: 36, value: 110400000, currency: USD, note: "M88A2 production contract announced July 2015.", source: s9 }
  - { customer: "US Army", year: 2023, quantity: null, value: 74600000, currency: USD, note: "Undefinitised production contract announced September 2023; completion estimated June 2025.", source: s7 }
  - { customer: "Iraq / Army", year: 2012, quantity: 8, value: 31800000, currency: USD, note: "Foreign military sale contract; Iraq had already received 16 M88A2s.", source: s8 }
peers: [bergepanzer-3-buffel, kodiak]
