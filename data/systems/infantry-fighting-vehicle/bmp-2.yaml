id: bmp-2
category: infantry-fighting-vehicle
name: BMP-2
variant_note: Baseline BMP-2 (Soviet/Russian production standard, incl. licence-built BVP-2 and Sarath)
family: BMP
aliases: [Sarath, BMP-II, BVP-2, BWP-2, BMP-M-1981]
manufacturer: { name: Kurganmashzavod }
production_sites:
  - { place: Kurgan, country: RU, source: s2 }
  - { place: Medak, country: IN, source: s3 }
  - { place: Dubnica nad Vahom, country: SK, source: s2 }
origin: SU
role: Amphibious tracked infantry fighting vehicle with a two-man turret, a 30 mm cannon and an anti-tank missile launcher; carries a squad of seven infantry.
memorable_fact: { text: "Its 30 mm 2A42 cannon can elevate to +74 degrees, high enough to engage helicopters.", source: s2 }
status: in_service
in_service_since:
  value: 1980
  range: { min: 1977, max: 1980 }
  source: s1
  confidence: medium
  note: "Year the base BMP-2 entered Soviet/Russian service according to Army Recognition, which also notes its deployment in Afghanistan. Forecast International (2007) says production deliveries began and the vehicle entered service in early 1977. The displayed value is 1980."
units_built:
  value: 33939
  source: s2
  confidence: low
  note: "Forecast International estimate for the whole BMP-2 family through 2006: Kurganmashzavod 32,009, India (OFB) 1,476 and ZTS Dubnica 454. In 2020, TASS, via Army Recognition, put Indian licence production at about 2,500, so the true total is likely higher."
combat_use: { text: "Used by both Russian and Ukrainian forces in the war in Ukraine since 2022. According to Oryx data cited by Forbes, documented Russian losses of BMP-series vehicles exceeded 700 by August 2022.", source: s5 }
specs:
  combat_weight: { value: 14.3, range: { min: 14.29, max: 14.49 }, source: s1, confidence: medium, note: "Army Recognition gives 14,300 kg. Forecast International gives 14.29 t for the basic vehicle and 14.49 t for the Improved BMP-2." }
  main_armament_calibre: { value: 30, source: s1, confidence: medium, note: "30 mm 2A42 stabilised automatic cannon; Forecast International gives the same figure." }
  dismounts: { value: 7, source: s1, confidence: medium, note: "Crew of 3 plus 7 infantry; Forecast International also gives 7." }
  engine_power: { value: 300, range: { min: 285, max: 300 }, source: s2, confidence: medium, note: "UTD-20 diesel: 300 hp (223.8 kW) per Forecast International. Army Recognition gives 285/300 hp. The Indian MoD gives 285 hp for Indian-built BMP-2/2K, but 300 hp is shown because it is the rating for the base Soviet/Russian vehicle." }
  top_speed: { value: 65, source: s3, confidence: high, note: "Indian MoD figure for BMP-2/2K. Army Recognition and Forecast International also give 65 km/h on road." }
  range: { value: 600, range: { min: 550, max: 600 }, source: s1, confidence: low, note: "Army Recognition gives 550 to 600 km; Forecast International gives 577 km on paved road. No manufacturer figure was found, so the upper Army Recognition value is shown." }
