  note: "Indian MoD indent of 2 June 2020 on the Ordnance Factory Board for 156 upgraded BMP-2/2K made at Ordnance Factory Medak, about Rs 1,094 crore in total (about Rs 7.01 crore per vehicle). Forecast International (s2) gave a 2007 unit price of US$404,000 for new Russian-production BMP-2 and US$398,000 for the Indian Sarath."
