id: cv90-mkiv
category: infantry-fighting-vehicle
name: CV90 MkIV (production versions CV9030 MkIV for Czechia and CV9035 MkIV for Slovakia)
family: CV90
aliases: [CV90 Mk IV, CV9030 MkIV, CV9035 MkIV, BVP CV90 MkIV, Stridsfordon 90 MkIV]
manufacturer: { name: BAE Systems Hägglunds }
production_sites:
  - { place: Örnsköldsvik, country: SE, source: s7 }
origin: SE
role: Tracked infantry fighting vehicle. It carries an infantry section and supports it with a turret-mounted automatic cannon and optional anti-tank guided missiles.
memorable_fact: { text: "Of the 246 CV90 MkIVs the Czech Republic ordered, 39 are being built in Sweden and 207 in the Czech Republic with Czech industry partners.", source: s4 }
status: in_production
in_service_since:
  value: 1993
  source: s12
  confidence: medium
  note: "This year is for the base CV90 system, not the MkIV. Army Technology gives 1993 for entry into service; other references give 1994. The MkIV was unveiled in 2017 (s3). The first MkIV vehicles are due in the Czech Republic in 2026, with main deliveries in 2027-2030 (s10). Delivery to a unit was not confirmed in the sources found. The search tool limit was reached, so no events after mid-2026 could be checked."
units_built:
  value: 1300
  source: s12
  confidence: medium
  note: "This is the whole CV90 family, not the MkIV: 'more than 1,300 vehicles in 15 variants' delivered by January 2021, according to Army Technology. No public figure for completed MkIV vehicles was found. Only first-of-type and early-production vehicles had been rolled out by 2026 (s4, s7)."
combat_use:
  text: "No confirmed combat use of the CV90 MkIV as of 2026. Earlier CV90 variants supplied to Ukraine have been used in combat by a Ukrainian brigade in the Bakhmut and Kupiansk sectors."
  source: s13
specs:
  combat_weight:
    value: 38
    range: { min: 37, max: 38 }
    source: s1
    confidence: medium
    note: "This is BAE's gross vehicle weight rating (GVWR), not a measured combat weight. BAE's current US product page gives a GVWR raised from 35 t to 38 t. An older BAE regional page (s2) gives 37 t. The newer manufacturer figure is shown."
  main_armament_calibre:
    value: 30
    range: { min: 30, max: 35 }
    source: s4
    confidence: medium
    note: "30 mm is for the Czech CV9030 MkIV, the first production MkIV rolled out. Slovakia's CV9035 MkIV carries a 35 mm cannon (s7). The D-series turret can take 30/40 mm and 35/50 mm cannons, up to a 120 mm gun (s3)."
  dismounts:
    value: 8
    source: s3
    confidence: low
    note: "Army Recognition gives crew 3 + 8 for the generic MkIV. This comes from a single secondary source. Numbers for the Czech and Slovak configurations were not confirmed."
  engine_power:
    value: 1000
    source: s1
    confidence: high
    note: "The manufacturer says 'up to 1,000 horsepower'. Army Technology names the engine as a Scania (s12)."
  top_speed:
    value: 70
    source: s3
    confidence: low
    note: "Single secondary source (Army Recognition data sheet). No manufacturer figure for the MkIV was found."
  range:
    value: 350
    source: s3
    confidence: low
    note: "Single secondary source (Army Recognition data sheet). No manufacturer figure for the MkIV was found."
operators:
  - { country: CZ, force: Army of the Czech Republic, state: ordered, quantity: 246, source: s5 }
  - { country: SK, force: Armed Forces of the Slovak Republic, state: ordered, quantity: 152, source: s6 }
