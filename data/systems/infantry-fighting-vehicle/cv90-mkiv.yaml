  - { country: FI, force: Finnish Defence Forces, state: evaluating, quantity: null, source: s11 }
  - { country: NO, force: Norwegian Armed Forces, state: evaluating, quantity: null, source: s11 }
cost:
  value: 242700000
  currency: CZK
  price_year: 2023
  basis: contract_per_unit
  source: s5
  confidence: medium
  note: "Czech contract of May 2023: CZK 59.7 bn (about EUR 2.49 bn) for 246 CV90 MkIVs in seven variants. 59.7 bn / 246 = about CZK 242.7 m, or about EUR 10.1 m per vehicle. The total covers several variants and more than the vehicles themselves, so this is not a flyaway price. For comparison, Slovakia's EUR 1.3 bn for 152 vehicles (s6) works out to about EUR 8.6 m per vehicle."
contracts:
  - { customer: Czech Republic / Army, year: 2023, quantity: 246, value: 59700000000, currency: CZK, note: "Seven variants (CV9030 MkIV IFV and derivatives). 39 built in Sweden and 207 in the Czech Republic (s4). Deliveries planned 2026-2030 (s10).", source: s5 }
  - { customer: Slovakia / Armed Forces, year: 2022, quantity: 152, value: 1300000000, currency: EUR, note: "Government-to-government agreement with Sweden for CV9035 MkIV vehicles in several configurations. First vehicle rolled out on 20 February 2026 (s7).", source: s6 }
  - { customer: Lithuania (Nordic CV90 MkIV programme), year: 2026, quantity: 100, value: null, currency: null, note: "Lithuania signed an implementation agreement with partner nations in June 2026. BAE submitted its best and final offer for the multinational programme on 16 June 2026 (s8). Signature of the main contract was not confirmed in the sources found.", source: s9 }
