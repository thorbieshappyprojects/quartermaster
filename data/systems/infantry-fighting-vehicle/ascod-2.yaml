    confidence: low
    range: { min: 820, max: 1100 }
    note: "Originally given as 820 hp (600 kW), MTU 8V 199 TE21 diesel, in one trade-press report on the Hunter. Army Recognition (s4) says the Hunter's MTU 8V199-series engine produces 'up to 1,100 hp', which matches the family maximum GDELS gives (up to 1100 hp / 810 kW, s1). The installed-rating figure is displayed; inconsistent reporting."
