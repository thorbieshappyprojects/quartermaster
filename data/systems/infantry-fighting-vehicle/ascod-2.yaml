  note: "Year this variant entered service: Latvia's National Armed Forces received the first Hunter on 7 October 2026. The base ASCOD family (Pizarro) entered series production in 1996, according to GDELS (s1)."
units_built:
  value: 1100
  source: s2
  confidence: low
  note: "Family-level figure, not this variant. In January 2025 GDELS said there were 'more than 1100 vehicles in different variants in the market' across the whole ASCOD family (Pizarro, Ulan, Ajax-derived, Sabrah and others). This appears to count vehicles ordered or fielded and is a lower bound. No public total exists for Hunter vehicles built; deliveries began with the first vehicle in October 2026."
