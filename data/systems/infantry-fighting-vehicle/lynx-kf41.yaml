  value: null
  source: null
  confidence: null
  note: "No public total production figure found for the KF41 family. Trade press reported 45 vehicles delivered to Hungary by early 2025, but this is a partial delivery count, not a total built."
combat_use: { text: "No confirmed combat use as of 2026. Ukraine signed a contract in December 2025 for five vehicles to be delivered from early 2026, and trade press described them as set for their first combat use.", source: s11 }
