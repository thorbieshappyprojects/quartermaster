    value: 30
    source: s2
    confidence: high
    note: "30 mm main gun in the Lance turret (the Hungarian order specifies a manned 30mm Lance turret). A 35 mm Wotan 35 cannon was shown with the Lance 2.0 turret in 2018 as an option."
