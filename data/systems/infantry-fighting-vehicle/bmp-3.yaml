id: bmp-3
category: infantry-fighting-vehicle
name: "BMP-3"
variant_note: "Current Russian production standard with add-on protection kits"
family: BMP-3
manufacturer: { name: "Kurganmashzavod (High-Precision Systems holding, Rostec)" }
production_sites:
  - { place: Kurgan, country: RU, source: s10 }
origin: RU
role: Tracked, amphibious infantry fighting vehicle that carries an infantry squad and is armed with a 100 mm gun/missile launcher and a coaxial 30 mm automatic cannon.
memorable_fact: { text: "The BMP-3's main 100 mm gun can also launch anti-tank guided missiles, and it is paired with a 30 mm automatic cannon in the same turret.", source: s1 }
status: in_production
in_service_since:
  value: 1987
  source: s1
  confidence: medium
  note: "Year the base BMP-3 entered Russian (Soviet) Army service. Production has continued since then. Vehicles delivered since about 2024 have a revised standard configuration with add-on protection (s5), and Russian deliveries continued in batches through 2025 (s4). No separate service-entry year is published for this standard."
units_built:
  value: 2000
  source: s12
  confidence: low
  note: "Whole BMP-3 family, all variants. Wikipedia gives 'No. built: 2,000+' as a lower bound, and no primary source for it was found. Jamestown, citing RUSI, reports 463 vehicles supplied in 2023 including overhauled vehicles, and estimates no more than about 200 of them were newly built (s6)."
combat_use: { text: "Used by Russian forces in the war against Ukraine since 2022. Rostec states that current-standard vehicles were modified based on that combat experience, with added underbody blast protection and add-on armour kits.", source: s5 }
specs:
  combat_weight:
    value: 18.7
    source: s1
    confidence: medium
    note: "Base BMP-3 figure. The Defense Post, reporting on Rostec deliveries, gives 18,700 kg (s2). Current production vehicles are delivered with add-on armour, slat armour, upper-hemisphere protection and the Nakidka signature-reduction kit (s3, s4). No public combat weight for this configuration was found."
  main_armament_calibre:
    value: 100
    source: s1
    confidence: medium
    note: "100 mm 2A70 rifled gun/missile launcher, with a coaxial 30 mm 2A72 automatic cannon."
  dismounts:
    value: 7
    source: s1
    confidence: medium
    note: "Seven troops, with two additional seats (s1). Rosoboronexport material reported by Army Recognition also states seven infantry (s11)."
  engine_power:
    value: 500
    source: s1
    confidence: medium
    note: "UTD-29 diesel, 500 hp. Wikipedia lists the UTD-29M at 500 hp (375 kW) (s12). The BMP-3M export upgrade uses the 660 hp UTD-32 (s1)."
  top_speed:
    value: 70
    source: s1
    confidence: medium
    range: { min: 70, max: 72 }
    note: "70 km/h on paved road (s1). Wikipedia gives 72 km/h (s12). The trade-press figure is displayed. Water speed is 10 km/h."
  range:
    value: 600
    source: s1
    confidence: medium
    note: "Road range."
