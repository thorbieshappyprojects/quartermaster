cost:
  value: 3080000
  currency: USD
  price_year: 2012
  basis: contract_per_unit
  source: s7
  confidence: medium
  note: "Indonesian 2012 contract with Rosoboronexport for 37 BMP-3F (the marine variant): USD 114 million including ammunition, spare parts and shipment, divided by 37 = about USD 3.08 million per vehicle (s7, s8). The 2019 Indonesian contract (22 BMP-3F for USD 108 million) gives about USD 4.91 million per vehicle (s9). No public unit price for current Russian production vehicles was found."
contracts:
  - { customer: Indonesia / Navy (Marine Corps), year: 2012, quantity: 37, value: 114000000, currency: USD, note: "BMP-3F, signed with Rosoboronexport. Value includes ammunition, spares and shipment. Handed over in January 2014.", source: s8 }
  - { customer: Indonesia / Navy (Marine Corps), year: 2019, quantity: 22, value: 108000000, currency: USD, note: "BMP-3F, signed 22 April 2019. A separate USD 67.2 million contract covers 21 BT-3F armoured personnel carriers.", source: s9 }
  - { customer: United Arab Emirates / Land Forces, year: 2011, quantity: 135, value: 74000000, currency: USD, note: "Upgrade of existing BMP-3 vehicles to BMP-3M standard, contracted with Rosoboronexport. Not new-build vehicles.", source: s1 }
  - { customer: Russia / Ministry of Defence, year: 2015, quantity: null, value: null, currency: null, note: "Order for 'hundreds' of BMP-3s as an interim fleet. Deliveries ran from 2018 to 2023.", source: s2 }
