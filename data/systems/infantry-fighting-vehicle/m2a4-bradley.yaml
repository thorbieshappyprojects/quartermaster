id: m2a4-bradley
category: infantry-fighting-vehicle
name: M2A4E1 Bradley
family: Bradley Fighting Vehicle
aliases: [M2A4 Bradley, Bradley A4, M2A4 Bradley Fighting Vehicle]
manufacturer: { name: BAE Systems }
production_sites:
  - { place: York, country: US, source: s1 }
  - { place: Texarkana, country: US, source: s9 }
origin: US
role: Tracked infantry fighting vehicle of US Army Armored Brigade Combat Teams, carrying a crew of three plus seven infantry and armed with a 25 mm cannon and TOW missiles.
memorable_fact: { text: "The M2A4E1, fielded in October 2026, is the first US Army infantry fighting vehicle to carry a hard-kill active protection system (Elbit's Iron Fist).", source: s3 }
status: in_production
in_service_since: { value: 2026, source: s2, confidence: medium, note: "Year of first fielding of the M2A4E1 variant (3rd ABCT, 1st Cavalry Division, October 2026). The M2A4 baseline has been fielded since April 2022 (s7), and the Bradley family entered service in 1981." }
units_built: { value: 6700, source: s11, confidence: low, note: "Bradley family, all variants, since 1981 (reported as 'more than 6,700'). The source also says about 700 M2A4s are planned through 2029. The number of M2A4 or M2A4E1 vehicles delivered has not been published." }
combat_use: { text: "No confirmed combat use of the M2A4 or M2A4E1 as of 2026. Earlier Bradley variants supplied to Ukraine have been used extensively in combat by Ukrainian forces.", source: s10 }
specs:
  combat_weight: { value: 36.3, source: s5, confidence: medium, range: { min: 36.287, max: 36.827 }, note: "Bradley A4 combat weight of 80,000 lb (36,287 kg), as listed by BAE Systems according to s5. One trade-press report (s6) also gives 36,827 kg. The Iron Fist LD kit on the M2A4E1 is reported at 329 kg (s2); no separate M2A4E1 combat weight has been published." }
  main_armament_calibre: { value: 25, source: s2, confidence: medium, note: "M242 Bushmaster 25x137 mm cannon, retained on the M2A4E1. Secondary armament is an M240C 7.62 mm coaxial machine gun and a twin TOW launcher." }
  dismounts: { value: 7, source: s5, confidence: medium, note: "Up to 7 squad members in the M2A4 configuration, plus a crew of 3." }
  engine_power: { value: 675, source: s6, confidence: medium, note: "M2A4 diesel engine. The M2A3 engine produced 600 hp (s2)." }
  top_speed: { value: 66, source: s5, confidence: medium, note: "Original figure 41 mph (Bradley A4)." }
  range: { value: 402, source: s5, confidence: medium, note: "Original figure 250 miles cruising range (Bradley A4)." }
operators:
  - { country: US, force: Army, state: in_service, quantity: null, source: s2 }
cost: { value: null, currency: null, price_year: null, basis: null, source: null, confidence: null, note: "A reported average of USD 4.35 million per M2A4 (Army plan for more than 700 vehicles through 2029) appears in trade press, but no price year is given, so it is not used. The published contracts do not give exact vehicle quantities, so no contract-per-unit figure can be calculated." }
contracts:
  - { customer: US Army, year: 2023, quantity: null, value: 288000000, currency: USD, note: "Change-order modification to convert legacy vehicles to M2A4. It followed a USD 274 million award (Aug 2023), a USD 128 million modification (Sep 2023) and a separate USD 190 million production contract (Aug 2023).", source: s9 }
  - { customer: US Army, year: 2024, quantity: null, value: 440000000, currency: USD, note: "More than 200 additional M2A4s, including several M7A4 BFIST. Part of the effort to replenish stocks after M2A2-ODS-SA vehicles were sent to Ukraine. The exact quantity was not stated.", source: s8 }
  - { customer: US Army, year: 2024, quantity: null, value: 656000000, currency: USD, note: "Order for additional M2A4 and M7A4 vehicles, announced by BAE Systems on 19 December 2024. The quantity was not stated.", source: s7 }
  - { customer: US Army, year: 2026, quantity: null, value: 228000000, currency: USD, note: "Contract to Elbit Systems for Iron Fist APS kits for Bradley upgrades (M2A4E1), under a program led by General Dynamics. It followed a USD 37 million order in 2024. The number of vehicles was not disclosed.", source: s4 }
peers: [puma-s1, cv90-mkiv, lynx-kf41]
