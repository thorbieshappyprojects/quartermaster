id: rosomak
category: wheeled-armoured-vehicle
name: "KTO Rosomak"
variant_note: "With ZSSW-30 unmanned turret; standard hull (lengthened Rosomak-L entering production)"
family: Patria AMV
aliases: [KTO Rosomak, Kołowy Transporter Opancerzony Rosomak, Rosomak-L, Rosomak ZSSW-30, Wolverine]
manufacturer: { name: "Rosomak S.A. (Polska Grupa Zbrojeniowa); ZSSW-30 IFV contracts led by Huta Stalowa Wola S.A. in consortium with Rosomak S.A." }
production_sites:
  - { place: Siemianowice Śląskie, country: PL, source: s4 }
  - { place: Stalowa Wola, country: PL, source: s5 }
origin: PL
role: Amphibious 8x8 wheeled armoured vehicle used by Poland as an infantry fighting vehicle and as a base for command, medical, reconnaissance and other variants.
memorable_fact: { text: "Poland's contribution to the ISAF mission in Afghanistan included over 130 Rosomak vehicles, all supplied by the Siemianowice plant.", source: s16 }
status: in_production
in_service_since: { value: 2004, source: s4, confidence: medium, note: "Base system. The first licence agreement with Patria (30 June 2003) covered 690 vehicles with deliveries scheduled for 2004-2013. The ZSSW-30 turret version was delivered to units from the 2022 contract onward (s6); Rosomak-L deliveries are scheduled for 2027-2028 (s7)." }
units_built: { value: 1000, source: s13, confidence: low, note: "Approximate, whole Rosomak family (all variants). Trade press (May 2026) reported that the 1,000th serial example was due for delivery in 2026; the Polish defence minister said in December 2024 that the Land Forces had about a thousand Rosomaks (s14). Earlier licences covered 690 (2003) and 307 (2013) vehicles (s4). In 2025 Rosomak S.A. delivered 82 Rosomak vehicles, including 36 chassis for ZSSW-30 turrets, which are integrated with the turrets at Huta Stalowa Wola (s5)." }
combat_use: { text: "Polish Rosomaks deployed with ISAF in Afghanistan were up-armoured and fitted with RPG net armour; trade press reports they faced RPG and IED attacks there. Vehicles were also supplied to Ukraine from 2023.", source: s15 }
specs:
  combat_weight: { value: 26, source: s2, confidence: medium, range: { min: 22.5, max: 26 }, note: "Manufacturer gives vehicle mass of 16,000-26,000 kg for the base version; displayed value is the upper figure. Polish MoD gives 22.5 t for the HITFIST-30P IFV (s3). Army Recognition gives a 26,000 kg permissible gross weight for the ZSSW-30 version (s10). Rosomak-L reported with maximum permissible mass of 25.5 t (s19)." }
  payload: { value: null, source: null, confidence: null }
  seats: { value: 9, source: s11, confidence: medium, range: { min: 9, max: 11 }, note: "ZSSW-30 version: crew of 3 plus 6 dismounts per Times of Defence; Army Recognition states up to 9 soldiers (s10). The manufacturer lists driver, commander, gunner and 8 infantry (11) for the HITFIST-30P version (s1)." }
  engine_power: { value: 490, source: s12, confidence: low, range: { min: 394, max: 490 }, note: "Original figure ~490 KM (metric hp) for the Scania diesel of the classic version. Army Recognition gives 294 kW (~394 hp) for a Scania DI 12 49A 03P in the ZSSW-30 vehicle (s10). Rosomak-L is planned to use the more powerful Scania DC13 079A (s13); no public power figure found for it." }
  top_speed: { value: 100, source: s1, confidence: high, range: { min: 80, max: 100 }, note: "Manufacturer and Polish MoD (s3) state 100 km/h; Army Recognition cites 80 km/h for the ZSSW-30 version (s10)." }
  range: { value: 500, source: s3, confidence: high, range: { min: 500, max: 700 }, note: "Polish MoD states 500 km; manufacturer gives an operational range of 500-700 km (s1)." }
operators:
  - { country: PL, force: Land Forces, state: in_service, quantity: null, source: s14, note: "About a thousand Rosomaks of all variants per the defence minister (Dec 2024); 341 ZSSW-30 vehicles planned under a framework agreement (s6)." }
  - { country: UA, force: Armed Forces of Ukraine, state: in_service, quantity: null, source: s17, note: "Ukraine's president announced in April 2023 that Poland would supply 200 Rosomaks, half of them promptly; no confirmed public delivered total found." }
cost: { value: 44830000, currency: PLN, price_year: 2024, basis: contract_per_unit, source: s9, confidence: medium, note: "Executive contract No. 2 of 8 July 2024 (Armament Agency with HSW, WB Electronics, Rosomak S.A., PGZ): about PLN 2.6 bn for 58 Rosomak with ZSSW-30 and Spike ATGM launchers, including spares; 2.6 bn / 58. For comparison, the 17 Dec 2024 Rosomak-L contract (PLN 4.3 bn gross for 80, incl. logistics and training packages) works out to about PLN 53.75 M per vehicle (s8)." }
contracts:
  - { customer: Poland (Ministry of National Defence), year: 2003, quantity: 690, value: null, currency: null, note: "First Patria licence agreement (30 June 2003), 690 vehicles for delivery 2004-2013.", source: s4 }
  - { customer: Poland (Armament Agency), year: 2022, quantity: 70, value: null, currency: null, note: "First executive contract (5 July 2022) for 70 ZSSW-30 turrets integrated with existing Rosomak chassis, under a framework agreement for 341 vehicles.", source: s6 }
  - { customer: Poland (Armament Agency), year: 2024, quantity: 58, value: 2600000000, currency: PLN, note: "8 July 2024, new-build Rosomak with ZSSW-30 and Spike; annexed in May 2026 for SAFE financing (s18, s20).", source: s9 }
  - { customer: Poland (Armament Agency), year: 2024, quantity: 80, value: 4300000000, currency: PLN, note: "17 Dec 2024, Rosomak-L with ZSSW-30, deliveries 2027-2028, with option to increase; value gross, also reported by s8; refinanced via SAFE annex in 2026 (s18).", source: s7 }
peers: [patria-amv-xp, piranha-v, boxer, stryker]
