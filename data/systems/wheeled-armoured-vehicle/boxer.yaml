  - { country: GB, force: Army, state: in_service, quantity: 623, source: s7 }
  - { country: AU, force: Army, state: in_service, quantity: 211, source: s9 }
  - { country: UA, force: Army, state: in_service, quantity: 54, source: s14 }
cost:
  value: 20300000
  currency: AUD
  price_year: 2018
  basis: contract_per_unit
  source: s11
  confidence: medium
  note: "Australian LAND 400 Phase 2 contract of 9 August 2018, valued at AUD 4.28 bn per ANAO, divided by 211 vehicles (≈ AUD 20.3 m each). ANAO states the value includes items beyond the vehicles. The fleet mixes turreted Combat Reconnaissance Vehicles and other variants, so this is not a bare APC unit price."
contracts:
  - { customer: "Australia / Australian Army (LAND 400 Phase 2)", year: 2018, quantity: 211, value: 4280000000, currency: AUD, note: "Contract value as reported by ANAO. 131 of the 211 vehicles are the CRV variant (s9).", source: s11 }
  - { customer: "Germany / Bundeswehr (Heavy Weapon Carrier for the Infantry)", year: 2024, quantity: 123, value: 2900000000, currency: USD, note: "Reported as USD 2.9 bn for up to 123 Lance-turreted vehicles, some built in Australia and shipped to Germany.", source: s13 }
  - { customer: "Germany and Netherlands via OCCAR (Schakal IFV)", year: 2025, quantity: 222, value: 4700000000, currency: EUR, note: "Total order value EUR 4.7 bn (Rheinmetall share almost EUR 3.4 bn). 150 for Germany, 72 for the Netherlands. Boxer chassis with Puma turret.", source: s12 }
  - { customer: "United Kingdom / British Army via OCCAR (RCH 155)", year: 2026, quantity: 72, value: null, currency: null, note: "MoD gave the value as 'nearly £1 billion' including initial training and in-service support. No exact figure was published, so value is left null. First deliveries are expected in 2028.", source: s7 }
