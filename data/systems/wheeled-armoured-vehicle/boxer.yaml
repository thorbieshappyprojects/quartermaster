id: boxer
category: wheeled-armoured-vehicle
name: "Boxer"
variant_note: "A3-standard 8×8 drive module, armoured personnel carrier configuration"
family: "Boxer"
aliases: ["GTK Boxer", "MRAV (Multi-Role Armoured Vehicle)", "PWV (Pantserwielvoertuig, Netherlands)", "Vilkas (Lithuania)", "Boxer MIV (United Kingdom)"]
manufacturer: { name: "ARTEC GmbH (joint venture of KNDS Deutschland and Rheinmetall)" }
production_sites:
  - { place: "Munich", country: DE, source: s5 }
  - { place: "Kassel", country: DE, source: s15 }
  - { place: "Telford", country: GB, source: s4 }
  - { place: "Stockport", country: GB, source: s4 }
  - { place: "Ipswich", country: AU, source: s10 }
origin: DE
role: "Modular 8×8 armoured vehicle that pairs a common drive module with interchangeable mission modules for troop transport, command, medical, fire-support and other roles."
memorable_fact: { text: "Boxer is built from two parts: a common 8×8 drive module and a mission module that can be swapped, so one chassis can serve as a troop carrier, ambulance or howitzer.", source: s3 }
status: in_production
in_service_since:
  value: 2009
  source: s5
  confidence: high
  note: "Year of the base system. The first series-production Boxer was handed over at the KMW plant in Munich in September 2009 (Germany/Netherlands). The Netherlands received its first vehicle in March 2010. The UK, the first full A3-standard customer, received its first two vehicles in December 2023 (s7)."
units_built:
  value: 760
  source: s6
  confidence: medium
  note: "Family-wide. OCCAR's 2026 Business Plan says 'over 760' Boxer vehicles have been delivered under the OCCAR programme (Germany, Netherlands, Lithuania, UK). This excludes Australia's nationally procured LAND 400 Phase 2 vehicles and Ukrainian deliveries, so it is a lower bound. ARTEC's March 2025 brochure, as cited in s7, gave more than 1,700 vehicles ordered."
combat_use: { text: "German Army Boxers were deployed to Afghanistan with ISAF from 2011.", source: s8 }
specs:
  combat_weight: { value: 38.5, source: s1, confidence: high, note: "ARTEC APC data sheet: max. gross vehicle weight 'up to 38.5 t'." }
  payload: { value: 8, source: s2, confidence: high, note: "ARTEC: 8 tonnes payload." }
  seats: { value: 11, source: s1, confidence: high, note: "Driver, commander and gunner (3) plus up to 8 dismounts (APC configuration)." }
  engine_power:
    value: 816
    range: { min: 711, max: 816 }
    source: s1
    confidence: high
    note: "ARTEC: MTU 8V199 TE20/21, up to 600 kW (816 hp) with the TE21. The earlier TE20 produces 530 kW (about 711 hp; s7 gives 710 bhp). Displayed value is the manufacturer maximum. British Army vehicles use the TE21 (s7)."
  top_speed:
    value: 100
    range: { min: 100, max: 103 }
    source: s1
    confidence: high
    note: "ARTEC states '> 100 km/h'. A figure of 103 km/h was published earlier (s7). The manufacturer lower bound is shown."
  range:
    value: 1000
    range: { min: 1000, max: 1050 }
    source: s1
    confidence: high
    note: "ARTEC states '> 1,000 km'. A figure of 1,050 km was published earlier (s7). The manufacturer lower bound is shown."
operators:
  - { country: DE, force: Army, state: in_service, quantity: null, source: s3 }
  - { country: NL, force: Army, state: in_service, quantity: null, source: s3 }
