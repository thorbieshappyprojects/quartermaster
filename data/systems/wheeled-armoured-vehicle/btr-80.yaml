  - { country: KZ, force: Army, state: in_service, quantity: null, source: s3 }
  - { country: BY, force: Army, state: in_service, quantity: null, source: s3 }
  - { country: TM, force: Army, state: in_service, quantity: null, source: s12 }
  - { country: MK, force: Army, state: in_service, quantity: null, source: s3 }
cost: { value: null, currency: null, price_year: null, basis: null, source: null, confidence: null, note: "No reliable public per-unit price for the base BTR-80 was found. Forum figures and prices for other variants (BTR-80A, BTR-80-UM) were not used." }
contracts:
  - { customer: "Hungary / Hungarian Defence Forces", year: 1996, quantity: 555, value: null, currency: null, note: "Delivered 1996–1999 as compensation for Russian state debt; no cash value given.", source: s8 }
  - { customer: "Turkey / Gendarmerie", year: 1993, quantity: 174, value: null, currency: null, note: "SIPRI register lists 174 ex-Russian Army BTR-80s for the Gendarmerie, delivered 1993–95. A related USD 75m deal also covered 20 Mi-17 helicopters and 52 BTR-80s, so no per-unit price can be derived.", source: s9 }
  - { customer: "Iraq / Ministry of Defence", year: 2005, quantity: 98, value: null, currency: null, note: "Contract with Bumar (Poland) for 98 reconditioned ex-Hungarian Army BTR-80s; first vehicles delivered September 2006.", source: s2 }
  - { customer: "Russia / Army", year: 2006, quantity: 100, value: null, currency: null, note: "Russian Army order for 100 vehicles in 2006, as reported by Army Technology.", source: s2 }
peers: [btr-82a, stryker, pandur-ii]
