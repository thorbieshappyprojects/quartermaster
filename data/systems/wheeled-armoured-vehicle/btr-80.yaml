id: btr-80
category: wheeled-armoured-vehicle
name: BTR-80
variant_note: "Base 8x8 APC (GAZ-5903) with BPU-1 turret (14.5 mm KPVT + 7.62 mm PKT); excludes BTR-80A/80S and BTR-82 derivatives"
family: BTR-80
aliases: [GAZ-5903]
manufacturer: { name: "Arzamas Machine-Building Plant (AMZ), Military Industrial Company (VPK)" }
production_sites:
  - { place: Arzamas, country: RU, source: s6 }
origin: RU
role: "Amphibious 8x8 wheeled armoured personnel carrier that carries a motor rifle squad and gives it fire support with a turret-mounted heavy machine gun."
memorable_fact: { text: "After experience in Afghanistan, the BTR-80's turret gun was given +60° elevation, compared with +30° on the BTR-60PB and BTR-70, so it could engage targets on mountainsides and high buildings.", source: s4 }
status: in_service
in_service_since: { value: 1984, source: s3, confidence: low, range: { min: 1984, max: 1986 }, note: "Year the base system entered service. Army Recognition says it entered Russian service in 1984, and FAS gives 1984 as the date of introduction. Lenta.ru (s6) dates the start of series production to 1984. WarHistory (s11) gives 1986 for introduction into Soviet service. 1984 is shown because two sources give it." }
units_built: { value: 5192, source: s5, confidence: medium, note: "Base BTR-80 only, per Forecast International. The same report lists 1,166 BTR-80A and 1,739 BTR-82/82A built separately. Forecast International also reports that production of the original BTR-80 ended in 2007." }
combat_use: { text: "First used in the Soviet–Afghan War. Later used in the Chechen wars, the 2008 South Ossetia war, the Iraqi insurgency and the war in Donbas, among other conflicts.", source: s11 }
specs:
  combat_weight: { value: 13.6, source: s1, confidence: high, note: "Army Technology (s2) gives 13,600 kg +3%." }
  payload: { value: null, source: null, confidence: null }
  seats: { value: 10, source: s2, confidence: medium, note: "3 crew (commander, driver, gunner) + 7 troops. The FAS specification table (s4) also totals 10, but splits it as 2 crew + 8 troops." }
  engine_power: { value: 260, source: s2, confidence: medium, range: { min: 240, max: 260 }, note: "KamAZ-7403 V8 diesel, 260 hp. Army Recognition (s3) says some vehicles use the YaMZ-238M2 diesel, which develops 240 hp. 260 hp is shown because it is the original engine." }
  top_speed: { value: 80, source: s2, confidence: medium, range: { min: 80, max: 90 }, note: "Most sources give 80 km/h on paved road (s2, s4 text, s3 text, s6). The FAS specification table gives 85 km/h and the Army Recognition data table gives 90 km/h. 80 km/h is shown because it is the most consistently reported figure." }
  range: { value: 600, source: s2, confidence: medium, note: "Road range. Army Technology gives 200–500 km on unpaved roads, and Army Recognition (s3) gives 480 km cross-country." }
operators:
