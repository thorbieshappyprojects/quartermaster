status: in_production
in_service_since:
  value: 2003
  range: { min: 2002, max: 2003 }
  source: s4
  confidence: medium
  note: "Year for the base Stryker system, not the A1 variant. Infantry carrier deliveries began in April 2002, and the Stryker entered operational service in November 2003, when the first Stryker brigade deployed to Iraq. The year 2003 is shown because it is the explicit service-entry date. No source in this research gave a first-fielding year for the DVH A1."
units_built:
  value: 4900
  source: s10
  confidence: medium
  note: "Whole Stryker family, all variants. Trade press says 'more than 4,900', so this is a lower bound; other trade sources give the same figure. No public total for DVH A1 production alone was found."
combat_use:
  text: "US Army Stryker brigades deployed to Iraq from November 2003 and later to Afghanistan."
  source: s4
specs:
  combat_weight:
    value: 27.2
    range: { min: 27.2, max: 28.6 }
    source: s1
    confidence: medium
    note: "Gross vehicle weight. GDLS states 60,000 lb (27.2 t) for the Stryker A1; s15 gives the same figure. The DOT&E FY2017 report (s2) states a 63,000 lb (28.6 t) gross vehicle weight rating for the DVH A1 upgrade. The manufacturer figure is displayed."
  payload: { value: null, source: null, confidence: null }
  seats:
    value: 11
    source: s11
    confidence: medium
    note: "Infantry carrier configuration: 2 crew plus a 9-soldier squad; s4 gives the same figure. Seating varies by variant."
  engine_power:
    value: 450
    source: s1
    confidence: high
    note: "Caterpillar C9 engine, which replaces the 350 hp Caterpillar C7 of earlier Strykers (s2)."
  top_speed:
    value: 97
    range: { min: 97, max: 100 }
    source: s11
    confidence: low
    note: "Original source figure: 60 mph (97 km/h); s4 gives 100 km/h. Both figures are for the original flat-bottom infantry carrier. No published top speed for the heavier DVH A1 was found."
  range:
    value: 483
    range: { min: 483, max: 502 }
    source: s11
    confidence: low
    note: "Original source figure: more than 300 miles (483 km); s4 gives 502 km. Both figures are for the original flat-bottom infantry carrier. No published range for the DVH A1 was found."
operators:
  - { country: US, force: "Army (incl. Army National Guard)", state: in_service, quantity: null, source: s13, note: "Trade press reports that the Army operates more than 4,400 Stryker vehicles of all variants (2025) and continues upgrading them to DVH A1." }
  - { country: UA, force: "Ground Forces", state: in_service, quantity: null, source: s13, note: "Reported figures differ: 189 vehicles (s8, 2023) and more than 400 received since March 2023 (s13, 2025). These are earlier variants supplied from US stocks. s8 reports them in combat use with Ukraine." }
  - { country: TH, force: "Royal Thai Army", state: in_service, quantity: 130, source: s7, note: "All delivered; s8 gives the same figure." }
  - { country: MK, force: "Army", state: in_service, quantity: 42, source: s7, note: "Initially 54 vehicles, reduced to 42 in 2024." }
  - { country: BG, force: "Land Forces", state: in_service, quantity: 183, source: s6, note: "183 new-production Strykers on order, including 90 M1296 Dragoon. Final assembly and acceptance take place at the TEREM-Ivaylo plant in Veliko Tarnovo. The first five were accepted on 3 November 2026, and final deliveries are scheduled by the end of 2028 (s5). Eight Excess Defense Articles (EDA) Strykers were also delivered in February 2026 (s5)." }
  - { country: AR, force: "Army", state: ordered, quantity: 8, source: s7, note: "8 ordered out of 207 planned; the source reports that deliveries have begun." }
