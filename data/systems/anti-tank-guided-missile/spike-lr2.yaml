id: spike-lr2
category: anti-tank-guided-missile
name: Spike LR2
variant_note: Ground-launched round with tandem HEAT warhead; multipurpose warhead option exists
family: Spike
aliases: [Spike LR II, Gil-2, MELLS (German designation, shared with Spike LR)]
manufacturer: { name: Rafael Advanced Defense Systems }
origin: IL
role: Fifth-generation electro-optically guided missile with a fibre-optic link, used against armour, structures and vessels from infantry, vehicles, ships and helicopters.
memorable_fact: { text: "At the request of the Israel Defense Forces, the LR2 was made lighter than the Spike LR (12.8 kg versus 13.7 kg), and its ground range still grew from 4 km to 5.5 km.", source: s3 }
status: in_production
in_service_since:
  value: 2018
  source: s5
  confidence: medium
  note: "First service of the LR2 variant (the base Spike system is older). In 2018 trade press said the LR2 was 'now entering service' with the IDF. EDR (s3, 2017) expected first deliveries in Q4 2018. ODIN (s6) says the IDF first ordered it in October 2017."
units_built:
  value: null
  source: null
  confidence: null
  note: "No public production figure for the LR2. Trade press gives about 50,000 missiles purchased for the whole Spike family (s12). That is a family purchase figure, not LR2 units built, so it is not used here."
combat_use: { text: "Israeli forces have reportedly used the Spike missile family in Gaza. No public source reviewed confirms combat use of the LR2 variant specifically.", source: s16 }
specs:
  max_range:
    value: 5.5
    source: s1
    confidence: high
    note: "Ground launch, fibre-optic link. EuroSpike (s2) gives 10 km for launch from a helicopter."
  min_range:
    value: null
    source: null
    confidence: null
    note: "Secondary sources give 200 m or 400 m, but neither figure could be traced to a manufacturer or government source."
  penetration:
    value: null
    source: null
    confidence: null
    note: "No public figure in mm RHA. The manufacturer and trade press say only that the tandem HEAT warhead penetrates about 30% more than the original Spike LR warhead (s3, s4)."
  missile_weight:
    value: 13.4
    source: s2
    confidence: medium
    range: { min: 12.7, max: 13.4 }
    note: "EuroSpike (Rafael/Diehl/Rheinmetall JV) gives a 'round weight' of 'ca. 13.4 kg', taken as in-tube weight and displayed here. Other figures: 12.8 kg (s3), about 13 kg (s4), 12.7 kg (s6)."
  flight_time_max:
    value: null
    source: null
    confidence: null
    note: "Not published. EuroSpike gives a missile speed of about 130-180 m/s (s2); a time is not derived from this because that would be an estimate."
