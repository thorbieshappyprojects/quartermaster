id: kornet
category: anti-tank-guided-missile
name: "9M133 Kornet (Kornet-E)"
variant_note: "Baseline 9M133 / export 9M133-1 tandem-HEAT missile with portable 9P163-1 launcher (Kornet-E system), not Kornet-EM"
family: "Kornet (9K135)"
aliases: ["AT-14 Spriggan", "Kornet-E", "9K135 Kornet", "9M133-1"]
manufacturer: { name: "KBP Instrument Design Bureau" }
production_sites:
  - { place: "Kovrov", country: RU, source: s3 }
origin: RU
role: "Man-portable or vehicle-mounted laser beam-riding heavy anti-tank guided missile system for use against armoured vehicles, fortifications and hovering helicopters."
memorable_fact: { text: "In 2008, NATO member Turkey chose the Russian Kornet-E over Rafael's Spike, Raytheon's TOW and Denel's Ingwe in an anti-tank missile competition.", source: s7 }
status: in_production
in_service_since: { value: 1998, source: s3, confidence: medium, note: "Year the base 9M133 Kornet system entered Russian service; the s6 trade article gives the same year." }
units_built: { value: 35000, source: s3, confidence: low, note: "Kornet missiles produced by 2009 across the whole family (domestic and export); no newer public figure found." }
combat_use: { text: "First used in combat during the 2003 invasion of Iraq; later used in the 2006 Lebanon War, the Syrian Civil War and the Russo-Ukrainian War.", source: s6 }
specs:
  max_range: { value: 5.5, source: s1, confidence: high, note: "Rosoboronexport gives 100-5,500 m by day and 100-4,500 m at night; KBP gives up to 5,500 m day and night." }
  min_range: { value: 100, source: s1, confidence: high, note: "Lower limit of the stated 100-5,500 m firing range." }
  penetration: { value: 1200, source: s2, confidence: high, range: { min: 1000, max: 1200 }, note: "KBP and Rosoboronexport give 1,000-1,200 mm behind ERA for the HEAT warhead; upper value shown. Army Recognition's 1,100-1,300 mm (s5) includes Kornet-EM missiles." }
  missile_weight: { value: 29.5, source: s1, confidence: high, note: "Rosoboronexport: missile in launch tube 29.5 ± 0.5 kg; several secondary sources round this to 29 kg." }
  flight_time_max: { value: 30, source: s3, confidence: low, note: "Source says only that the subsonic missile takes 'about half a minute' to reach maximum range; no manufacturer figure found." }
operators:
  - { country: RU, force: "Ground Forces", state: in_service, quantity: null, source: s4 }
  - { country: TR, force: "Land Forces", state: in_service, quantity: null, source: s8 }
  - { country: GR, force: "Army", state: in_service, quantity: null, source: s5 }
  - { country: IN, force: "Army", state: in_service, quantity: null, source: s5 }
