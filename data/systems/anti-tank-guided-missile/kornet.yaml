  - { country: AE, force: "Armed Forces", state: in_service, quantity: null, source: s9 }
  - { country: BH, force: "Armed Forces", state: in_service, quantity: null, source: s10 }
  - { country: RS, force: "Army (72nd Special Operations Brigade)", state: in_service, quantity: null, source: s11 }
cost: { value: 26000, currency: USD, price_year: 2019, basis: unit_price, source: s13, confidence: low, note: "Per-missile price quoted by Zaman al-Wasl (2019), a single secondary source with no manufacturer confirmation. For comparison, Turkey's 2008 contract (USD 70 million for 80 launchers and 800 missiles, s8) works out to about USD 87,500 per missile including launchers; that figure is not shown because it mixes in launcher costs." }
contracts:
  - { customer: "Turkey / Land Forces", year: 2008, quantity: 800, value: 70000000, currency: USD, note: "80 Kornet-E launchers and 800 missiles.", source: s8 }
  - { customer: "United Arab Emirates / Armed Forces", year: 2019, quantity: null, value: 40000000, currency: USD, note: "Kornet-E systems bought from KBP at IDEX 2019; reported as AED 146.92 million (about USD 40 million); quantity not disclosed.", source: s9 }
  - { customer: "Bahrain", year: 2016, quantity: null, value: null, currency: null, note: "A batch of Kornet-E systems delivered by Rosoboronexport in 2016.", source: s10 }
  - { customer: "Jordan / Jadara Equipment and Defence Systems", year: 2021, quantity: null, value: null, currency: null, note: "Licensed assembly agreement for 9M133-1 and 9M133F-1 missiles, announced at IDEX 2021; no transfer of production technology.", source: s12 }
peers: [tow-2b, spike-lr2, mmp]
