  - { customer: "US Army", year: 2024, quantity: null, value: 1300000000, currency: USD, note: "FY2024 follow-on order, the largest single-year Javelin order to that date. It includes about 4,000 Javelins to replace stocks sent to Ukraine; the total quantity was not stated.", source: s4 }
