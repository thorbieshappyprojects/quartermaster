id: javelin
category: anti-tank-guided-missile
name: "FGM-148F Javelin"
variant_note: "F-model all-up round (tandem multipurpose warhead) as on the current manufacturer spec card; units_built and operators cover all Javelin models"
family: "Javelin"
aliases: ["Javelin", "AAWS-M (Advanced Anti-Tank Weapon System-Medium)"]
manufacturer: { name: "Javelin Joint Venture (Raytheon / Lockheed Martin)" }
production_sites:
  - { place: "Troy, Alabama", country: US, source: s8 }
  - { place: "Tucson, Arizona", country: US, source: s3 }
  - { place: "Orlando, Florida", country: US, source: s3 }
origin: US
role: "Fire-and-forget anti-tank guided missile with an imaging infrared seeker and top-attack or direct-attack modes. It can be carried by one soldier or mounted on vehicles."
memorable_fact: { text: "One senior assembler at the Troy, Alabama plant had handled every one of the 50,000 Javelin missiles built there when President Biden visited in 2022.", source: s8 }
status: in_production
in_service_since:
  value: 1996
  source: s5
  confidence: high
  note: "Year of the base system: first unit equipped on 27 June 1996 (3rd Battalion, 75th Ranger Regiment, Fort Benning). The F-model entered initial full-rate production with a January 2019 contract (s6)."
units_built:
  value: 55000
  source: s3
  confidence: high
  note: "Manufacturer says 'more than 55,000' missiles of all models were produced as of September 2025, plus more than 12,000 Command Launch Units. No F-model-only total was found."
combat_use: { text: "The manufacturer stated in 2021 that Javelin had been fired more than 5,000 times in combat operations; Ukraine has used it extensively against Russian armour since 2022 (s4).", source: s2 }
specs:
  max_range:
    value: 4
    source: s1
    confidence: high
    range: { min: 2.5, max: 4 }
    note: "Manufacturer gives 65 m to 4 km 'in most operational conditions'. CSIS (s9) reports a qualified maximum range of 2,500 m with demonstrated performance to 4,000 m. The manufacturer figure is displayed."
  min_range:
    value: 65
    source: s1
    confidence: high
  penetration:
    value: null
    source: null
    confidence: null
    note: "No manufacturer or government RHA figure found; the manufacturer only says it is effective against all known armour."
  missile_weight:
    value: 15.5
    source: s1
    confidence: high
    note: "All-up round 34 lb (15.5 kg) including launch tube; missile alone 25 lb (11.8 kg); CLU 15.4 lb (7.0 kg)."
  flight_time_max:
    value: null
    source: null
    confidence: null
    note: "No public figure found for flight time to the 4 km maximum range."
