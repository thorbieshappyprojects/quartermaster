  - { customer: "South Korea / DAPA", year: 2023, quantity: null, value: null, currency: null, note: "K9A2 development contract awarded late 2023; development due to complete 2027. The overall K9A2 programme was approved in 2022 at about USD 1.73 billion (s14).", source: s2 }
