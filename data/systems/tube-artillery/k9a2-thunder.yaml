  currency: EUR
  price_year: 2026
  basis: contract_per_unit
  source: s5
  confidence: medium
  note: "Finland follow-on contract (April 2026): about EUR 546 million for 112 K9 with associated spare parts, deliveries from 2028; 546,000,000 / 112. The build standard of these units is not stated."
