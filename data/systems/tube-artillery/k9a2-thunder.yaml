id: k9a2-thunder
category: tube-artillery
name: "K9A1 Thunder"
variant_note: "K9A1 standard (current production/service); K9A2 still in development, RoK Army fielding planned 2027"
family: "K9 Thunder"
aliases: ["K9 Thunder", "K9A1EGY", "K9 Vajra-T", "AS9 Huntsman", "T-155 Firtina"]
manufacturer: { name: "Hanwha Aerospace" }
production_sites:
  - { place: "Changwon", country: KR, source: s7 }
  - { place: "Geelong", country: AU, source: s4 }
origin: KR
role: "Tracked 155 mm/52-calibre self-propelled howitzer that provides long-range indirect fire support to armoured and mechanised formations."
memorable_fact: { text: "Hanwha says the K9 is the most widely operated self-propelled howitzer in its class, with units delivered to ten countries on four continents.", source: s5 }
status: in_production
in_service_since:
  value: 2018
  source: s3
  confidence: medium
  note: "Year the K9A1 variant entered RoK Army service; the base K9 entered service in 1999 (same source). The K9A2 is not yet in service: development is due to finish in 2027, with serial-production contracts to follow (s2)."
units_built:
  value: 1800
  source: s12
  confidence: low
  note: "Whole K9 family including licence/derivative versions, reported as '1,800+ delivered'. Army Recognition (s4) gives 'over 1,800 systems contracted'. No separate public figure for the K9A1, which in Korea is largely a conversion of existing K9s."
combat_use:
  text: "The base K9 returned fire during the North Korean bombardment of Yeonpyeong Island in November 2010; no confirmed combat use of the K9A1 as of 2026."
  source: s13
specs:
  calibre: { value: 155, source: s1, confidence: high }
  barrel_length: { value: 52, source: s1, confidence: high }
  max_range_standard:
    value: 30
    range: { min: 30, max: 40 }
    source: s4
    confidence: medium
    note: "Army Recognition: 30 km with standard HE projectile. Hanwha (s1, s5) states '40 km+' / 'more than 40 kilometers' without specifying the projectile; 30 km shown for standard round."
  max_range_extended:
    value: 40
    source: s4
    confidence: medium
    note: "With rocket-assisted projectile per Army Recognition; consistent with Hanwha's '40 km+' (s1). Higher figures for special base-bleed/RAP rounds are not confirmed by manufacturer sources."
  rate_of_fire:
    value: 8
    range: { min: 6, max: 8 }
    source: s1
    confidence: high
    note: "Hanwha: maximum 6-8 rds/min for 3 minutes; burst 3 rounds in <15 s; sustained 2-3 rds/min for 1 hour. K9A2 (in development) is stated at 9-10 rds/min."
  into_action_time:
    value: 30
    range: { min: 30, max: 60 }
    source: s4
    confidence: medium
    note: "First round within 30 s at emplacement and within 60 s from movement after receiving a fire command."
  combat_weight:
    value: 47
    range: { min: 46.3, max: 47 }
    source: s10
    confidence: medium
    note: "47 t quoted for the K9A1; 46.3 t quoted for the original K9 by army-technology.com (s15)."
  crew:
    value: 5
    source: s11
    confidence: medium
    note: "Commander, driver, gunner, loader and communications specialist. K9A2 (in development) reduces crew to 3 (s1)."
