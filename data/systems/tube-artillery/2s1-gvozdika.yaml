id: 2s1-gvozdika
category: tube-artillery
name: 2S1 Gvozdika
variant_note: Baseline Soviet-production 2S1 with 122 mm 2A31 howitzer
family: 2S1 Gvozdika
aliases: [M1974, SAU-122, SP-74, PSH 74]
manufacturer: { name: Kharkiv Tractor Plant (KhTZ) }
production_sites:
  - { place: Kharkiv, country: UA, source: s5 }
  - { place: Stalowa Wola, country: PL, source: s5 }
origin: SU  # Soviet Union (ISO 3166-1 transitionally reserved code); developed in Kharkiv, then Ukrainian SSR
role: Amphibious tracked 122 mm self-propelled howitzer providing indirect and direct fire support to motorised rifle and tank units.
memorable_fact: { text: "The 2S1 was the first serially produced amphibious tracked self-propelled howitzer; in water it is propelled by its tracks.", source: s3 }
status: in_service
in_service_since:
  value: 1971
  source: s3
  confidence: medium
  range: { min: 1971, max: 1974 }
  note: "Year of first service of the base system. Army Recognition and the Ukrainian defence university page (s4) give 1971; US threat data (s1) gives 1974 as date of introduction, the year it was first seen in public. Production ended in 1991."
units_built:
  value: 10000
  source: s3
  confidence: low
  note: "Whole 2S1 family, including licence production in Poland and Bulgaria. Sources say 'over 10,000', so this is a lower bound (also stated by s5)."
combat_use:
  text: "Used extensively by Russian forces in the Russo-Ukrainian War; Ukrainian forces have reported destroying Russian 2S1s with drone-directed strikes as recently as October 2026."
  source: s12
specs:
  calibre: { value: 122, source: s1, confidence: medium }
  barrel_length: { value: 36, source: s1, confidence: medium, note: "2A31 howitzer, derived from the towed D-30; same figure in s2." }
  max_range_standard:
    value: 15.3
    source: s1
    confidence: medium
    range: { min: 15.2, max: 15.3 }
    note: "Original figure 15,300 m with Frag-HE (s1, s2, s5). Army Recognition (s3) and Ukrainian defence university page (s4) give 15.2 km; US-government-derived threat data figure displayed."
  max_range_extended: { value: 21.9, source: s1, confidence: medium, note: "Original figure 21,900 m with 122 mm rocket-assisted Frag-HE (3OF-56); same in s3 and s5." }
  rate_of_fire: { value: 5, source: s1, confidence: medium, note: "Burst rate; normal 4 rpm, sustained 1-2 rpm (s1). Analysis citing the technical manual gives 4-5 rpm maximum aimed direct fire (s6)." }
  into_action_time: { value: 120, source: s1, confidence: medium, note: "Original figure: emplacement time 2 min; displacement time 1 min (s1, s2)." }
  combat_weight:
    value: 15.7
    source: s1
    confidence: medium
    range: { min: 15.7, max: 16 }
    note: "15.7 t in s1, s2, s4 and s5; 16 t cited in some secondary references (s10)."
  crew: { value: 4, source: s1, confidence: medium, note: "Vehicle crew of 4; full section of 6 includes 2 in the ammunition carrier (s1)." }
