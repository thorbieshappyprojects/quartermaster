  - { country: UA, force: "Armed Forces (captured vehicles)", state: in_service, quantity: null, source: s8, note: "Captured Russian vehicles; one used by the 95th Air Assault Brigade (July 2024). Open sources count 15 captured; not an official inventory figure." }
