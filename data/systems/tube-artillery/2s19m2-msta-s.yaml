id: 2s19m2-msta-s
category: tube-artillery
name: "2S19M2 Msta-S"
variant_note: "New-build 2S19M2 with 2A64M2 gun and ASUNO-M fire control"
family: "2S19 Msta"
aliases: ["Msta-SM2", "Msta-SM", "2S19M2"]
manufacturer: { name: "Uraltransmash (Uralvagonzavod, Rostec)" }
production_sites:
  - { place: Yekaterinburg, country: RU, source: s4 }
origin: RU
role: "Tracked 152 mm self-propelled howitzer for indirect fire against personnel, weapons and materiel at division level."
memorable_fact: { text: "The 2S19M2 has a burst mode: it fires five rounds at one target in quick succession, then leaves its firing position.", source: s5 }
status: in_production
in_service_since:
  value: 2013
  source: s2
  confidence: medium
  note: "Year of first service of the 2S19M2 variant (first vehicles to a Southern Military District brigade, June 2013; s1 also states 2013). Base 2S19 entered Soviet service in 1989. Shephard (s6) states series production since 2012. Status in_production is based on 2023 deliveries of new 2S19M2s (s10) and later press reports of new 2S19M2s at the front (s9). No source seen confirms production in 2026."
units_built:
  value: 180
  source: s6
  confidence: low
  note: "2S19M2 only. Shephard Defence Insight estimate, published before a 31 May batch ordered under the 2019-2021 state defence plan (article date not confirmed, c. 2021). Not a cumulative figure for 2026; no official total found."
combat_use:
  text: "Used by Russia in the war against Ukraine. In July 2024 Army Recognition, citing open sources, reported 47 Russian 2S19M2s destroyed or damaged and 15 captured by Ukraine."
  source: s8
specs:
  calibre:
    value: 152
    source: s3
    confidence: high
    note: "Nominal 152 mm; actual bore 152.4 mm (2A64M2 gun)."
  barrel_length:
    value: 47
    source: s3
    confidence: medium
    range: { min: 47, max: 48 }
    note: "GlobalSecurity's variant table gives 47 calibres for the 2S19M2; its base 2S19 spec sheet gives 48. 47 shown because it is the variant-specific figure."
  max_range_standard:
    value: 24.7
    source: s3
    confidence: medium
    range: { min: 24.7, max: 25 }
    note: "24.7 km with the standard HE-FRAG round (OF-45), given for the base 2S19 with the same 47-calibre barrel. Army Recognition (s1) gives about 25 km. No variant-specific official figure found."
  max_range_extended:
    value: 29
    source: s3
    confidence: medium
    range: { min: 28.9, max: 29 }
    note: "29 km with OF-61 (described as base bleed in s3; GlobalSecurity's variant table also lists 29 km for the 2S19M2). Army Recognition (s1) gives 28.9 km and calls it rocket-assisted, so the projectile type is reported inconsistently."
  rate_of_fire:
    value: 10
    source: s5
    confidence: high
    note: "Aimed rate of fire of 10 rds/min, stated by the Uraltransmash CEO as quoted by TASS. Also given in s1, s6 and s10. The base 2S19 fires 7-8 rds/min."
  into_action_time:
    value: 120
    source: s3
    confidence: low
    range: { min: 60, max: 120 }
    note: "Source gives emplacement time of 1-2 min (60-120 s) for the base 2S19; upper bound shown. No 2S19M2-specific figure found."
  combat_weight:
    value: 43.24
    source: s1
    confidence: medium
    note: "2S19M2 combat mass; GlobalSecurity's variant table (s3) gives the same figure. Base 2S19 is 42 t."
  crew:
    value: 5
    source: s1
    confidence: medium
