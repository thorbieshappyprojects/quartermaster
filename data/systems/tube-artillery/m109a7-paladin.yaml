id: m109a7-paladin
category: tube-artillery
name: "M109A7 Paladin"
variant_note: "M109A7 howitzer of the PIM set (M109A7 + M992A3), current US Army production standard"
family: "M109"
aliases: ["Paladin Integrated Management (PIM)", "M109A7 SPH"]
manufacturer: { name: "BAE Systems" }
production_sites:
  - { place: "York, Pennsylvania", country: US, source: s8 }
  - { place: "Elgin, Oklahoma", country: US, source: s8 }
  - { place: "Anniston Army Depot, Alabama", country: US, source: s8 }
origin: US
role: "Tracked 155 mm self-propelled howitzer providing indirect fire support to US Army Armored Brigade Combat Teams, fielded with the M992A3 ammunition carrier."
memorable_fact: { text: "The M109A7 chassis uses the same power pack, drive train, track and suspension components as the Bradley Fighting Vehicle.", source: s2 }
status: in_production
in_service_since:
  value: 2018
  source: s3
  confidence: high
  note: "First Unit Equipped with this variant (M109A7) in August 2018, per the Army's Selected Acquisition Report. The first low-rate production M109A7 was handed to the Army in April 2014 (s14). The year the base M109 family entered service is not given here."
units_built:
  value: 178
  range: { min: 178, max: 300 }
  source: s4
  confidence: medium
  note: "M109A7/M992A3 sets (this variant) delivered as of the December 2021 SAR: 2 development + 176 procurement, out of a planned 689 sets. Production has continued since. No newer public total was found. Army Technology (s15) says the 300th set was delivered in 2021, but its '133 LRIP + 216 FRP sets' appear to count single vehicles (the SAR tracks contract deliveries by vehicle). The government figure is shown."
specs:
  calibre: { value: 155, source: s3, confidence: high }
  barrel_length: { value: 39, source: s3, confidence: high, note: "M284/M284A2 cannon on M182A1 mount (s2)" }
  max_range_standard:
    value: 24
    source: s6
    confidence: medium
    note: "Unassisted projectile. The Army field manual gives the same 24 km for the same M284 cannon on the M109A6 (s5)."
  max_range_extended:
    value: 30
    source: s5
    confidence: medium
    note: "Rocket-assisted projectile (RAP), as given for the M284 cannon on the M109A6. BAE states the M109A7 range as 'in excess of 30km' (s2). No sourced range for an Excalibur/extended-range round was found."
  rate_of_fire:
    value: 4
    range: { min: 4, max: 8 }
    source: s5
    confidence: medium
    note: "Army field manual (M109A6, same cannon): maximum 4 rds/min for 3 minutes; sustained 1 rd/min. Army Technology gives up to 8 rds/min for the M109A6 (s7). The government figure is shown."
  into_action_time:
    value: 60
    source: s2
    confidence: high
    note: "From the move: receive the mission, compute firing data, emplace, point the gun and fire within 60 s. When already emplaced, BAE says under 30 s (s11)."
  combat_weight:
    value: 38.1
    range: { min: 35.4, max: 38.1 }
    source: s2
    confidence: high
    note: "BAE datasheet: 84,000 lb (38,101 kg). Army Recognition lists 35,380 kg (s6). The manufacturer figure is shown."
  crew: { value: 4, source: s2, confidence: high }
operators:
  - { country: US, force: "Army (incl. Army National Guard)", state: in_service, quantity: null, source: s1 }
  - { country: TW, force: "Army", state: ordered, quantity: 60, source: s13, note: "US FMS notification December 2025; deliveries reportedly not before 2030" }
cost:
  value: 11825000
  currency: USD
  price_year: 2026
  basis: contract_per_unit
  source: s10
  confidence: medium
  note: "January 2026 US Army contract: USD 473 million for 40 sets = USD 11.825 million per set. Each set is one M109A7 plus one M992A3 ammunition carrier, so this is not a price for the howitzer alone."
contracts:
  - { customer: "US Army", year: 2017, quantity: 48, value: 413700000, currency: USD, note: "Final low-rate production lot (48 howitzers + 48 M992A3) with full-rate options for 60 sets/year; up to about USD 1.7 bn if all options are exercised", source: s9 }
  - { customer: "US Army", year: 2024, quantity: null, value: 579000000, currency: USD, note: "3 July 2024 award for M109A7 and M992A3 production", source: s12 }
  - { customer: "US Army", year: 2026, quantity: 40, value: 473000000, currency: USD, note: "January 2026 award for 40 sets (M109A7 + M992A3); a further USD 535 million award followed in June 2026 (s11)", source: s10 }
  - { customer: "Taiwan (TECRO) / Army", year: 2025, quantity: 60, value: 4030000000, currency: USD, note: "Foreign Military Sale notified December 2025: 60 M109A7, 60 ammunition carriers, 13 recovery vehicles and over 4,000 precision-guidance kits", source: s13 }
peers: [pzh-2000, k9a2-thunder, krab, 2s19m2-msta-s]
