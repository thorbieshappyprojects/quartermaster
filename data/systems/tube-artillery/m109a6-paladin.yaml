id: m109a6-paladin
category: tube-artillery
name: M109A6 Paladin
variant_note: US Army M109A6 conversion of M109A2/A3 hulls, delivered 1990s; later MACS/Excalibur kit
family: M109
aliases: [Paladin, M109 Paladin]
manufacturer: { name: United Defense LP (now BAE Systems Land & Armaments) }
production_sites:
  - { place: Chambersburg, country: US, source: s1 }
origin: US
role: Tracked 155 mm self-propelled howitzer with onboard navigation and automatic fire control. It can receive a mission, fire and move off without external support.
memorable_fact: { text: "Paladin units were the first to field the GPS-guided Excalibur 155 mm shell, which went into use in Iraq in May 2007.", source: s1 }
status: in_service
in_service_since: { value: 1994, source: s4, confidence: high, note: "First fielding of the M109A6 variant to the US Army (the base M109 entered service in the 1960s)." }
units_built: { value: 950, source: s4, confidence: high, note: "M109A6 systems ordered by the US Army; the last was delivered in June 1999. Most were conversions of existing M109A2/A3 howitzers. Army Technology (s1) reports further orders of 7 (2000) and 18 (2002) for the Army National Guard, which are not included here." }
combat_use: { text: "Used by Ukrainian forces against Russia after the US pledged 18 in 2023, including the 2023 southern counteroffensive. The US Army used it in Iraq from 2003.", source: s6 }
specs:
  calibre: { value: 155, source: s11, confidence: high }
  barrel_length: { value: 39, source: s2, confidence: medium, note: "M284 cannon on M182A1 mount; s1 also gives 39 calibres." }
  max_range_standard: { value: 22, source: s2, confidence: medium, range: { min: 22, max: 24 }, note: "GlobalSecurity gives 22,000 m for unassisted rounds; Army Technology (s1) gives 24 km. 22 km shown because it is the more specific figure (s2's range table)." }
  max_range_extended: { value: 30, source: s2, confidence: medium, range: { min: 30, max: 40 }, note: "30 km with HE rocket-assisted projectile (RAP) and M203 propellant; s1 and s3 agree. s1 gives up to 40 km for the guided Excalibur round. 30 km shown because it is the conventional extended-range figure all sources agree on." }
  rate_of_fire: { value: 4, source: s2, confidence: medium, range: { min: 4, max: 8 }, note: "4 rds/min for three minutes, sustained 1 rd/min (s2; s3 also says up to four per minute). Army Technology (s1) gives up to 8 rds/min (3 rounds in 15 s). 4 shown because two sources agree." }
  into_action_time: { value: 45, source: s2, confidence: medium, range: { min: 45, max: 60 }, note: "45 s from a complete stop (s2). s1 and s3 give the first round from the move in under 60 s. 45 s shown because it matches the from-halt definition of the field." }
  combat_weight: { value: 28.9, source: s2, confidence: medium, range: { min: 28.1, max: 29.0 }, note: "Converted from 63,615 lb combat-loaded (s2). Other figures: about 64,000 lb ≈ 29.0 t (US Army document, s11), 29,000 kg (s1), and 62,000 lb ≈ 28.1 t (s3). The most precise figure is shown." }
  crew: { value: 4, source: s2, confidence: medium, note: "Commander, driver, gunner and loader (s1); s3 also says 4." }
operators:
  - { country: US, force: Army (incl. Army National Guard), state: in_service, quantity: null, source: s10 }
  - { country: UA, force: Ground Forces, state: in_service, quantity: 18, source: s7 }
cost: { value: 1500000, currency: USD, price_year: 1992, basis: contract_per_unit, source: s5, confidence: low, note: "GAO NSIAD-92-44 (published 23 Jan 1992): Army program acquisition unit cost for the Paladin modification, about $1.5M (up from the original $500,000 estimate). Includes development, so it is not a flyaway price. The year of the dollars is not stated; the publication year (then-year dollars) is used as price_year. For comparison, the cancelled 2021 Taiwan sale was estimated at $750M for 40 (about $18.75M each, including support; s8)." }
contracts:
  - { customer: US Army, year: 1991, quantity: 104, value: 300000000, currency: USD, note: "Low-rate initial production funding through FY1991 (GAO).", source: s5 }
  - { customer: US Army National Guard, year: 2000, quantity: 7, value: null, currency: null, note: "Order placed in July 2000.", source: s1 }
  - { customer: US Army National Guard, year: 2002, quantity: 18, value: null, currency: null, note: "Order placed in January 2002.", source: s1 }
  - { customer: Taiwan Army, year: 2021, quantity: 40, value: 750000000, currency: USD, note: "US approved the sale in August 2021 (estimated value, including equipment and support). Taiwan cancelled it in 2022 and bought more HIMARS instead (s9).", source: s8 }
peers: [m109a7-paladin, as90, 2s19m2-msta-s, k9a2-thunder]
