id: archer
category: tube-artillery
name: "Archer 8x8 (RMMV HX2)"
variant_note: "Archer gun system on Rheinmetall MAN HX2 8x8 truck; Swedish 2023 order"
family: "Archer (FH77 BW L52)"
aliases: ["FH77 BW L52", "Artillerisystem 08", "ARCHER Mobile Howitzer 8x8", "Archer 6x6 (earlier Volvo A30D-based version)"]
manufacturer: { name: "BAE Systems Bofors" }
origin: SE
role: "Wheeled 155 mm self-propelled howitzer with a remotely operated, automatically loaded gun on a truck chassis with an armoured cab, built for rapid shoot-and-scoot fire support."
memorable_fact: { text: "Archer can fire six rounds, displace and drive 500 m in under two minutes while the crew stays inside the armoured cabin.", source: s1 }
status: in_production
in_service_since:
  value: 2026
  source: s4
  confidence: medium
  note: "Year of first service of the 8x8 variant: FMV handed the first four Archer 8x8 to the Swedish Armed Forces (Bergslagen Artillery Regiment) on 26 August 2026, with remaining deliveries planned by 2030. The base Archer 6x6 on the Volvo articulated hauler was fielded with the Swedish Army in 2016 (s1)."
units_built:
  value: 48
  source: s10
  confidence: medium
  note: "Family figure: the 48 series-production Archer 6x6 delivered to FMV (production completed in 2022). Excludes demonstrators and the new 8x8 production; at least four Archer 8x8 had been handed to the Swedish Armed Forces by August 2026 (s4)."
combat_use: { text: "Used by Ukrainian forces against Russia, starting with the eight Archer 6x6 systems donated by Sweden.", source: s9 }
specs:
  calibre: { value: 155, source: s2, confidence: high }
  barrel_length: { value: 52, source: s2, confidence: high }
  max_range_standard: { value: 30, source: s2, confidence: high, note: "HE round, per the manufacturer's 8x8 technical data." }
  max_range_extended:
    value: 40
    source: s2
    confidence: high
    note: "HEER (high-explosive extended-range) round. The same data sheet gives 50 km with the M982 Excalibur guided round and 35 km with BONUS. The UK MoD gives 50 km 'using extended range ammunition' (s6)."
  rate_of_fire:
    value: 8
    source: s2
    confidence: medium
    range: { min: 8, max: 9 }
    note: "8x8 brochure: 'up to 8 rounds/minute'; burst 3 rounds/20 s; intensive 21 rounds/3 min; continuous 54 rounds/35 min. BAE's product web page states up to 9 rounds/minute (s1). Displayed value taken from the brochure's technical data."
  into_action_time:
    value: 20
    source: s2
    confidence: high
    note: "Manufacturer gives 'approx. 20 sec' into action and the same out of action. The BAE web page separately states less than 30 s from receiving a call for fire to firing the first round (s1)."
  combat_weight:
    value: 38
    source: s2
    confidence: high
    note: "Manufacturer gives 38,000 kg for the 8x8 version. The 6x6 Volvo-based version is listed at 34,000 kg in BAE's 6x6 brochure (s3)."
  crew:
    value: 3
    source: s2
    confidence: high
    note: "8x8 brochure: 3 crew. BAE's 6x6 brochure lists 1-4 crew members for the 6x6 (s3); the UK MoD says 3-4 (s6)."
