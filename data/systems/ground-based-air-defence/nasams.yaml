id: nasams
category: ground-based-air-defence
name: NASAMS 3
variant_note: Current configuration with AMRAAM, AMRAAM-ER and AIM-9X-2 effectors and AN/MPQ-64F1 Sentinel radar
family: NASAMS
aliases: [National Advanced Surface-to-Air Missile System, Norwegian Advanced Surface-to-Air Missile System, NASAMS III]
manufacturer: { name: Kongsberg Defence & Aerospace (with Raytheon) }
production_sites:
  - { place: Tewksbury, country: US, source: s8 }
origin: "NO"
role: Networked short- to medium-range ground-based air defence system against aircraft, helicopters, UAVs and cruise missiles, using air-to-air missiles fired from ground launchers.
memorable_fact: { text: "NASAMS has protected the airspace over Washington DC around the clock since 2005.", source: s1 }
status: in_production
in_service_since: { value: 1995, source: s12, confidence: low, note: "Year the original NASAMS base system was fielded in Norway. Only Wikipedia gives an exact year; trade press says only 'the 1990s'. No public year found for when NASAMS 3 entered service." }
units_built: { value: 70, source: s10, confidence: low, note: "Fire units delivered across the whole NASAMS family. The source says 'over 70', so this is a minimum. Single secondary source (blog)." }
combat_use: { text: "Used by Ukraine since late 2022. The Norwegian Armed Forces said in February 2025 that NASAMS in Ukraine had shot down about 900 missiles and drones, an estimated 94% interception rate.", source: s9 }
specs:
  max_range: { value: 60, range: { min: 40, max: 60 }, source: s7, confidence: low, note: "60 km is reported for NASAMS 3, presumably with AMRAAM-ER, the longest-range interceptor; s7 attributes the figure to The Defense Post. UNITED24 (s11) gives up to 40 km for NASAMS 3. No manufacturer figure is public. The higher value is shown because the field covers the longest-range interceptor." }
  max_altitude: { value: 21, source: s6, confidence: low, note: "Converted from 21,000 m (69,000 ft) as stated by The Defense Post. UNITED24 (s11) gives 14-15 km for NASAMS II. Higher figures for AMRAAM-ER appear only in unsourced reference entries. No manufacturer figure is public." }
  ready_rounds: { value: 6, source: s3, confidence: high, note: "Mark II canister launcher holds six ready-to-fire missiles in any mix. A full reload takes under 30 minutes." }
  reaction_time: { value: null, source: null, confidence: null }
  crew: { value: null, source: null, confidence: null }
