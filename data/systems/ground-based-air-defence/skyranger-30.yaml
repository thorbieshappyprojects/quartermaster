id: skyranger-30
category: ground-based-air-defence
name: Skyranger 30 (Boxer)
variant_note: German Army Boxer 8x8 configuration with Stinger missiles (1 verification model + 18 series vehicles)
family: Oerlikon Skyranger
aliases: ["Boxer Skyranger 30", "Oerlikon Skyranger 30", "Flakpanzer Skyranger 30"]
manufacturer: { name: Rheinmetall Air Defence AG (Rheinmetall Group) }
origin: CH
role: Mobile very short-range air defence vehicle that pairs a 30 mm revolver cannon firing airburst ammunition with short-range missiles, mainly against drones.
memorable_fact: { text: "The German Army disbanded its army air defence branch in 2012 and is now rebuilding it in Lüneburg, with the Boxer-based Skyranger 30 as its first system.", source: s4 }
status: in_production
in_service_since:
  value: null
  source: null
  confidence: null
  note: "Rheinmetall handed the first Boxer Skyranger 30, a verification model for approval trials, to the Bundeswehr at the end of January 2025 (s2). The Bundeswehr planned for one unit to receive the system in 2026 (s4), and series deliveries are mainly planned for 2027 and early 2028 (s2). No source found confirms that an operational unit has taken the system into service."
units_built:
  value: null
  source: null
  confidence: null
  note: "One Boxer verification model has been delivered (s2). No public cumulative production figure was found for the Boxer variant or the Skyranger 30 family. Rheinmetall gives current turret production capacity as about 70-100 per year (s5)."
combat_use: { text: "No confirmed combat use as of 2026. Rheinmetall says the system is intended for Ukraine's armed forces, but no fielded or combat use was found.", source: s5 }
specs:
  max_range:
    value: 6
    source: s3
    confidence: medium
    range: { min: 6, max: 8 }
    note: "Rheinmetall brochure: effective range up to 3,000 m with the gun and 6,000 m with a missile. This is the baseline brochure configuration, not specifically the Stinger-armed Boxer. Army Recognition (s6) gives about 8 km with Stinger. The manufacturer figure is displayed. Gun-only effective range is 3 km (s3, s5)."
  max_altitude: { value: null, source: null, confidence: null }
  ready_rounds:
    value: null
    source: null
    confidence: null
    note: "German vehicles are armed with Stinger at first, with a later switch planned to a newly developed counter-drone missile (s2). The baseline brochure lists 2 ready missiles as an option (s3), but no official missile count was found for the German Boxer configuration. Gun ammunition per brochure: 252 linked 30 mm rounds ready to fire (s3)."
  reaction_time: { value: null, source: null, confidence: null }
  crew:
    value: 2
    source: s3
    confidence: low
    note: "Brochure lists two operator consoles in the vehicle (commander, gunner). A Boxer driver is not included in this figure, and no official total vehicle crew was found for the German variant."
