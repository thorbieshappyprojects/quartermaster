id: iris-t-slm
category: ground-based-air-defence
name: IRIS-T SLM
variant_note: Ground-launched fire unit with IRIS-T SLM interceptor
family: IRIS-T SL
aliases: ["IRIS-T Surface Launched Medium Range", "Saqr (Egyptian display name)"]
manufacturer: { name: Diehl Defence }
origin: DE
role: Medium-range ground-based air defence system against aircraft, helicopters, cruise missiles and drones.
memorable_fact: { text: "Germany's 2023 order for six IRIS-T SLM fire units marked the start of the European Sky Shield Initiative (ESSI).", source: s2 }
status: in_production
in_service_since: { value: 2022, source: s4, confidence: medium, note: "First confirmed operational service of the system, with Ukraine (combat use since October 2022). Egypt reportedly received systems from late 2021, but Diehl has not confirmed the customer. Germany reached initial capability in 2024." }
units_built: { value: null, source: null, confidence: null, note: "No public total production figure found." }
combat_use: { text: "Used by Ukraine since 2022, mainly against Russian cruise missiles and drones; the German Aid to Ukraine tracking project estimates an average interception rate of around 95%.", source: s5 }
specs:
  max_range: { value: 40, source: s1, confidence: high, note: "Interceptor range 40 km; Diehl also states a 60 km 'effective system range'." }
  max_altitude: { value: 20, source: s1, confidence: high }
  ready_rounds: { value: 8, source: s1, confidence: high, note: "Eight missiles per launcher; a fire unit can have up to 8 launchers." }
  reaction_time: { value: null, source: null, confidence: null }
  crew: { value: null, source: null, confidence: null, note: "No public per-launcher crew figure found; Diehl states fewer than 30 operators for a complete fire unit." }
operators:
  - { country: UA, force: Air Force, state: in_service, quantity: 11, source: s5 }
  - { country: EG, force: Armed Forces, state: in_service, quantity: null, source: s6 }
  - { country: DE, force: Air Force, state: in_service, quantity: 6, source: s2 }
  - { country: EE, force: Defence Forces, state: in_service, quantity: 3, source: s7 }
  - { country: LV, force: National Armed Forces, state: ordered, quantity: null, source: s9 }
  - { country: SI, force: Slovenian Armed Forces, state: ordered, quantity: 3, source: s4 }
  - { country: BG, force: Armed Forces, state: ordered, quantity: 1, source: s10 }
  - { country: SE, force: Army, state: ordered, quantity: 7, source: s11 }
  - { country: CH, force: Armed Forces, state: ordered, quantity: 5, source: s3 }
  - { country: DK, force: Armed Forces, state: ordered, quantity: null, source: s13 }
cost: { value: 182000000, currency: EUR, price_year: 2024, basis: contract_per_unit, source: s10, confidence: medium, range: { min: 180600000, max: 182100000 }, note: "Bulgaria's 2024 contract for one fire unit, excluding VAT (Army Recognition: EUR 182m). A secondary aggregator (s4) gives EUR 182.1m, revised to EUR 180.6m in October 2026. The displayed value follows the trade-press figure tied to the parliamentary ratification." }
contracts:
  - { customer: Germany (BAAINBw), year: 2023, quantity: 6, value: null, currency: null, note: "Contract signed 22 June 2023; first fire unit due 2024; start of ESSI procurement. Value not stated by Diehl.", source: s2 }
  - { customer: Estonia (ECDI), year: 2023, quantity: 3, value: 400000000, currency: EUR, note: "Joint procurement with Latvia; nearly EUR 400m, the largest single defence contract in Estonian history. Three fire units per Estonian MoD (s7).", source: s8 }
  - { customer: Sweden (FMV), year: 2025, quantity: 7, value: 9000000000, currency: SEK, note: "Seven fire units under ESSI, worth around SEK 9bn.", source: s12 }
  - { customer: Switzerland (armasuisse), year: 2025, quantity: 5, value: 500000000, currency: CHF, note: "Signed 22 July 2025 under ESSI; about CHF 500m including logistics vehicles and spare parts; deliveries from end-2028 to 2031.", source: s3 }
