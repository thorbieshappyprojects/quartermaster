cost:
  value: 5300000
  currency: USD
  price_year: 2027
  basis: unit_price
  source: s13
  confidence: medium
  note: "About USD 5.3M per missile in the US Army FY2027 budget request, as reported by TWZ (s13). For comparison: the FY24-26 multiyear contract (s11) is USD 9.8B for 1,970 missiles plus associated hardware, about USD 4.97M each. The Dec 2022 SAR (s4) gives an average procurement unit cost of USD 3.640M in base-year dollars."
contracts:
  - { customer: "United States (Army, incl. FMS)", year: 2025, quantity: 1970, value: 9800000000, currency: USD, note: "FY2024-2026 multiyear contract for missiles and associated hardware for the US and international partners; it absorbed the June 2024 undefinitized contract action.", source: s11 }
