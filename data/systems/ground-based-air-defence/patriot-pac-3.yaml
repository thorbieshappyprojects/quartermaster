id: patriot-pac-3
category: ground-based-air-defence
name: "Patriot PAC-3 MSE"
variant_note: "PAC-3 MSE interceptor fired from the M903 launcher"
family: "Patriot"
aliases: ["PAC-3 Missile Segment Enhancement", "PAC-3 MSE"]
manufacturer: { name: "Lockheed Martin (Missiles and Fire Control)" }
production_sites:
  - { place: "Camden, Arkansas", country: US, source: s2 }
origin: US
role: "Hit-to-kill interceptor for the Patriot system, used against tactical ballistic missiles, cruise missiles, hypersonic threats and aircraft."
memorable_fact: { text: "An M903 Patriot launcher holds 12 PAC-3 MSE interceptors, each in its own canister, but only 4 of the older PAC-2 GEM missiles, and the MSE destroys its target by hitting it directly.", source: s1 }
status: in_production
in_service_since:
  value: 2016
  source: s3
  confidence: high
  note: "Year of first service of the MSE variant: IOC with 3-2 ADA on 5 July 2016 (s3). Lockheed Martin lists First Unit Equipped in 2015 (s1). The base Patriot system is much older."
units_built:
  value: 1000
  source: s4
  confidence: high
  note: "Lower bound for the MSE variant only. Lockheed Martin finished the 1,000th PAC-3 MSE on 18 October 2021 (s4). The cumulative total is now much higher, but no current figure was found. A 2026 CSIS estimate (s14) put US stocks alone at more than 2,300 before the 2026 Iran conflict."
combat_use: { text: "Used in combat. In 2026 CSIS estimated that US PAC-3 MSE stocks fell from more than 2,300 to about 800 during US operations against Iran.", source: s14 }
specs:
  max_range:
    value: 35
    source: s6
    confidence: low
    range: { min: 30, max: 120 }
    note: "No figure from the manufacturer. About 35 km per s6; 'over 35 km' per s7; 30 km against ballistic missiles per s9; 19 mi (about 30.6 km) per s8; 75 mi (120 km) per s10, which may mix up different Patriot missiles. 35 km shown because two trade sources report it."
  max_altitude:
    value: 36
    source: s10
    confidence: low
    range: { min: 15, max: 40 }
    note: "Original figure 118,000 ft (35,966 m) per s10; 'over 36,000 m' per s7; 40 km against ballistic missiles per s8; 15 km per s6. No figure from the manufacturer."
  ready_rounds:
    value: 12
    source: s1
    confidence: high
    note: "M903 launcher: 12 PAC-3 MSE, or 6 MSE plus 8 PAC-3 CRI, or 16 CRI, or 4 PAC-2 GEM (s1; CSIS s5 gives the same figures)."
  reaction_time: { value: null, source: null, confidence: null }
  crew: { value: null, source: null, confidence: null }
