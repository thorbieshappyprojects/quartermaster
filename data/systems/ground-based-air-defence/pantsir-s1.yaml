id: pantsir-s1
category: ground-based-air-defence
name: "Pantsir-S1"
variant_note: "Baseline 96K6 with 57E6/57E6-E missiles and 2A38M guns"
family: "Pantsir"
aliases: ["Pantsyr-S1", "96K6", "SA-22 Greyhound", "Pantsir-S1E"]
manufacturer: { name: "KBP Instrument Design Bureau (Tula)" }
production_sites:
  - { place: "Ulyanovsk", country: RU, source: s5 }
origin: RU
role: "Wheeled short-range air defence system combining missiles and 30 mm guns to defend installations and longer-range air defence units against aircraft, cruise missiles, munitions and UAVs."
memorable_fact: { text: "One vehicle carries both 12 missiles and two twin-barrel 30 mm guns, so it can engage targets from 200 m out to 20 km.", source: s1 }
status: in_service
in_service_since:
  value: 2012
  range: { min: 2003, max: 2012 }
  source: s6
  confidence: medium
  note: "Year the base system was formally adopted by the Russian Army, by government order of 16 Nov 2012 (s6). CSIS gives 2003 as the in-service date (s4). Army-technology reports the first complete export systems went to the UAE in 2007 (s5). Army Recognition reports the first 10 systems entering Russian Air Force service on 18 Mar 2010 (s3). Formal adoption year shown."
units_built:
  value: 200
  source: s9
  confidence: low
  note: "Covers the whole Pantsir family. The Wikipedia infobox says '200+' with no underlying source; treated as a lower bound. No manufacturer or government total found."
combat_use:
  text: "Used by Russian forces in the war against Ukraine. As of the cited 2026 report, Oryx counted 44 Pantsir-S1 visually confirmed lost since 2022 (37 destroyed, 5 damaged, 2 captured)."
  source: s7
specs:
  max_range:
    value: 20
    range: { min: 12, max: 20 }
    source: s1
    confidence: high
    note: "Rosoboronexport and KBP give a missile engagement range of 1,200–20,000 m against a 2 m² RCS aircraft (s1, s2). Army-technology gives 1–12 km for the 57E6 (s5). Gun range is 0.2–4 km. Manufacturer figure shown."
  max_altitude:
    value: 15
    range: { min: 8, max: 15 }
    source: s2
    confidence: high
    note: "KBP and Rosoboronexport give 15–15,000 m for missiles (s2, s1). CSIS gives 10 km against tactical aircraft (s4). Army Recognition gives both 8 km and 10 km in different places (s3). Manufacturer figure shown. Guns reach 3 km."
  ready_rounds:
    value: 12
    source: s2
    confidence: high
    note: "12 surface-to-air missiles on the launchers (also s1)."
  reaction_time:
    value: 4
    range: { min: 4, max: 6 }
    source: s2
    confidence: high
    note: "KBP states 4–6 s; lower bound shown."
  crew:
    value: 3
    source: s2
    confidence: high
    note: "KBP lists the combat crew as 3; Army Recognition and army-technology agree (s3, s5)."
