id: m270a2-mlrs
category: rocket-artillery
name: "M270A2"
variant_note: "Recapitalised 'zero-time' M270 with Common Fire Control System, 600 hp engine and Improved Armored Cab"
family: "M270 MLRS"
aliases: ["MLRS", "M270 MLRS", "Multiple Launch Rocket System"]
manufacturer: { name: "Lockheed Martin Missiles and Fire Control" }
production_sites:
  - { place: "Camden, Arkansas", country: US, source: s2 }
origin: US
role: "Tracked, armoured multiple launch rocket system that fires guided 227 mm rockets and long-range surface-to-surface missiles."
memorable_fact: { text: "M270A2 launchers are not built new: existing M270s are fully restored and upgraded, intended to keep them in service through 2050.", source: s2 }
status: in_production
in_service_since:
  value: 2022
  source: s2
  confidence: medium
  note: "Year of first M270A2 delivery to the US Army (12 July 2022, Camden, Arkansas). The first US Army unit fully equipped was the 41st Field Artillery Brigade in late 2024 (s5). The base M270 system has been in US Army service since 1983 (s2)."
units_built:
  value: null
  source: null
  confidence: null
  note: "No public cumulative M270A2 delivery figure found. The US Army plans to upgrade 225 M270A1 and 160 decommissioned M270A0 launchers to M270A2 (s1). The first contract (2019) covered 50 launchers (s4)."
combat_use: { text: "No confirmed combat use of the M270A2 as of 2026. The earlier M270A1 configuration was used in Operation Iraqi Freedom.", source: s15 }
specs:
  rockets_per_launcher:
    value: 12
    source: s1
    confidence: high
    note: "12 GMLRS or ER GMLRS rockets in two six-rocket pods. Lockheed Martin also lists 4 PrSM or ATACMS as an alternative load."
  max_range:
    value: 150
    source: s6
    confidence: medium
    note: "Approximately 150 km with the Extended-Range GMLRS rocket. Standard GMLRS exceeds 84 km. Missiles fly farther: ATACMS up to 300 km and PrSM beyond 500 km (s6), but those are missiles, not rockets."
  reload_time:
    value: 3
    source: s13
    confidence: low
    range: { min: 3, max: 10 }
    note: "No manufacturer reload figure for the M270A2. The 3 min figure is for the M270A1 Improved Launcher Mechanical System (4 min on the original M270) per s13. Lockheed Martin states a 38% reload-time reduction for the M270A1 (s15). Another secondary source gives 8-10 min for a full reload by the crew (s16). 3 min is displayed as the launcher-mechanism figure."
  combat_weight:
    value: 27.5
    source: s6
    confidence: low
    range: { min: 24.9, max: 27.5 }
    note: "Army Recognition gives approximately 27,500 kg for the M270A2. Army Technology gives 55,000 lb (about 24.9 t) for the generic M270 (s14). No manufacturer or government M270A2 figure found. The A2-specific value is displayed."
  crew:
    value: 3
    source: s1
    confidence: high
    note: "Commander, gunner and driver (s6)."
operators:
  - { country: US, force: "Army", state: in_service, quantity: null, source: s5 }
  - { country: FI, force: "Army", state: ordered, quantity: 41, source: s7 }
  - { country: GB, force: "Army", state: ordered, quantity: 61, source: s12 }
  - { country: IT, force: "Army", state: ordered, quantity: 21, source: s9 }
cost:
  value: 7240000
  currency: USD
  price_year: 2019
  basis: contract_per_unit
  source: s4
  confidence: medium
  note: "April 2019 US Army contract, USD 362 million for recapitalising 50 launchers to M270A2, divided by 50. This is the cost of converting an existing launcher, not a new-build unit price."
contracts:
  - { customer: "United States Army", year: 2019, quantity: 50, value: 362000000, currency: USD, note: "First M270A2 recapitalisation contract.", source: s4 }
  - { customer: "Finland (Army)", year: 2023, quantity: null, value: 395000000, currency: USD, note: "US State Department approval of a possible Foreign Military Sale to upgrade Finnish M270s to M270A2. The Finnish Army states its whole fleet of 41 launchers will be upgraded (s7).", source: s8 }
  - { customer: "United States Army and international partners", year: 2024, quantity: null, value: 451000000, currency: USD, note: "Recapitalisation of more US Army M270s plus upgrades for partner nations. Lockheed Martin also received a further USD 214 million in May 2025 for US, UK, Finnish and Italian upgrades (s11).", source: s10 }
  - { customer: "United States Army", year: 2026, quantity: null, value: 200000000, currency: USD, note: "September 2026 award to recapitalise more M270 launchers as M270A2.", source: s3 }
peers: [m142-himars, k239-chunmoo, puls, tornado-s]
