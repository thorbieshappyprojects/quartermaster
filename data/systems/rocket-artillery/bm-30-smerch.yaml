id: bm-30-smerch
category: rocket-artillery
name: "9A52-2 Smerch"
variant_note: "9A52-2 launcher on MAZ-543M chassis (Smerch-M standard, upgraded 1998-99)"
family: "9K58 Smerch"
aliases: ["BM-30 Smerch", "9K58 Smerch", "9A52-2 Smerch-M", "BM-30M", "MRL 280mm M1983"]
manufacturer: { name: "NPO Splav" }
production_sites:
  - { place: "Tula", country: RU, source: s3 }
  - { place: "Perm", country: RU, source: s8 }
origin: RU
role: "Heavy 300 mm self-propelled 12-tube multiple rocket launcher for long-range fire against troop concentrations, artillery, command posts and depots."
memorable_fact: { text: "One launcher fires all 12 rockets in 38 seconds, and a salvo with cluster-warhead rockets covers about 672,000 square metres.", source: s5 }
status: in_service
in_service_since:
  value: 1989
  source: s1
  confidence: medium
  range: { min: 1988, max: 1989 }
  note: "Year of first service of the base 9K58 system, not of the 9A52-2 upgrade. FAS gives 1989 as the date of introduction; Army Technology and FAS (9K58 page) say it entered Russian Army service in 1988. The 9A52-2 combat vehicle was upgraded in 1998-99 (s5)."
units_built: { value: null, source: null, confidence: null, note: "No public production total found for the 9A52/9A52-2 family." }
combat_use: { text: "Used in Chechnya, Syria, Ukraine (including the war since 2022) and the 2020 Nagorno-Karabakh war, where Armenia and Azerbaijan both fired Smerch rockets.", source: s6 }
specs:
  rockets_per_launcher: { value: 12, source: s5, confidence: medium, note: "Twelve 300 mm launch tubes; same figure in s1 and s4." }
  max_range:
    value: 120
    source: s6
    confidence: medium
    range: { min: 90, max: 120 }
    note: "120 km with the 9M542 rocket (GLONASS-guided, per s3 and s6), also given as the 9A52-2 firing range by Army Technology (s3). The export catalogue (s5) lists 70/90 km for the standard 9M55/9M528 flight-corrected rockets. Tornado-S family rockets with longer range are not counted here."
  reload_time:
    value: 20
    source: s5
    confidence: medium
    range: { min: 20, max: 36 }
    note: "Catalogue: launcher loading 'up to 20' min using the 9T234-2 transloader; Army Recognition (s6) also gives about 20 min. FAS (s1) and Army Technology (s3) give 36 min as the minimum reload time."
  combat_weight: { value: 43.7, source: s5, confidence: medium, note: "Catalogue gives 43,700 kg; FAS (s1) and Army Recognition (s4) also give 43.7 t." }
  crew:
    value: 3
    source: s5
    confidence: medium
    range: { min: 3, max: 4 }
    note: "Catalogue and Army Recognition (s4) give 3 for the upgraded 9A52-2. FAS (s1) and Army Technology (s3) give 4."
