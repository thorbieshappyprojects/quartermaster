id: m142-himars
category: rocket-artillery
name: "M142 HIMARS"
variant_note: "Full-rate production Lot 17 standard (2026), M142 with Increased Crew Protection (ICP) armoured cab"
family: "MLRS"
aliases: ["HIMARS", "High Mobility Artillery Rocket System"]
manufacturer: { name: "Lockheed Martin Missiles and Fire Control" }
production_sites:
  - { place: "Camden, Arkansas", country: US, source: s3 }
origin: US
role: "Wheeled 6x6 truck-mounted launcher that carries one pod of six 227 mm GMLRS rockets, two PrSM or one ATACMS missile for long-range precision strike."
memorable_fact: { text: "HIMARS can be flown in a C-130 while combat-loaded. Its single pod holds either six GMLRS rockets or two Precision Strike Missiles.", source: s2 }
status: in_production
in_service_since:
  value: 2005
  source: s3
  confidence: high
  note: "Year the US Army first fielded the base M142 system. The ICP armoured cab entered production in FY2009 (FRP III) and was retrofitted to the rest of the US fleet (s17)."
units_built:
  value: 750
  source: s3
  confidence: high
  note: "Total launchers delivered to all customers, all M142 production lots: the 750th was delivered on 5 Nov 2025. Lockheed Martin raised annual output from 48 to 96 launchers, so later deliveries are not included in this figure."
combat_use: { text: "Used by Ukraine against Russian forces from 2022. According to CENTCOM, US forces used it in Operation Epic Fury against Iran in 2026, the first combat use of PrSM.", source: s7 }
specs:
  rockets_per_launcher:
    value: 6
    source: s2
    confidence: high
    note: "Six GMLRS or ER GMLRS (227 mm) in one pod. The alternative loads are 2 PrSM or 1 ATACMS missile."
  max_range:
    value: 150
    range: { min: 70, max: 150 }
    source: s6
    confidence: medium
    note: "Shown value is for the guided ER GMLRS rocket (150 km). Standard GMLRS reaches about 70 km (s16). The missiles are not counted here: Lockheed Martin gives a munitions span of 15 to 499+ km including PrSM (s2), and ATACMS reaches 300 km."
  reload_time:
    value: 5
    range: { min: 4, max: 5 }
    source: s8
    confidence: low
    note: "Press figure: a trained crew reloads in about 4 to 5 minutes using the integrated crane. No manufacturer or government figure was found."
  combat_weight:
    value: 16.3
    range: { min: 16.25, max: 16.3 }
    source: s2
    confidence: high
    note: "Manufacturer figure is 16,283 kg (35,800 lb) combat loaded, rounded to 16.3 t. Army Recognition gives 16.25 t (s15). The manufacturer figure is shown."
  crew:
    value: 3
    source: s2
    confidence: high
