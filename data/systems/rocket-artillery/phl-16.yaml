  - { id: s4, url: "https://www.janes.com/osint-insights/defence-news/industry/idex-2023-uae-orders-norinco-ar3-launchers", title: "IDEX 2023: UAE orders Norinco AR3 launchers", publisher: "Janes", retrieved: 2026-11-22, kind: press }
