id: bm-21-grad
category: rocket-artillery
name: BM-21 Grad
variant_note: Original 40-tube launcher on Ural-375D 6x6 truck (9K51 complex)
family: BM-21 Grad
aliases: [9K51, Grad, M1964]
manufacturer: { name: Motovilikha Plants }
production_sites:
  - { place: Perm, country: RU, source: s5 }
origin: RU
role: Truck-mounted 122 mm multiple rocket launcher providing area-saturation fire support at division level.
memorable_fact: { text: "\"Grad\" means \"hail\", and the BM-21 is widely described as the world's most widely used multiple rocket launcher.", source: s1 }
status: in_service
in_service_since:
  value: 1963
  source: s2
  confidence: medium
  note: "Year of first service of the base BM-21 system with the Soviet Army. One section of s1 gives 1964; s1 and s2 otherwise give 1963."
units_built:
  value: 14362
  source: s4
  confidence: low
  note: "Forecast International estimate of BM-21 family systems built through 2023 by the prime contractor and licensees combined, so not this variant alone. s4 also says Motovilikha applied the BM-21-1 retrofit to 1,239 existing launchers."
combat_use: { text: "First used in combat by Soviet forces in the 1969 Sino-Soviet border clashes. Later used in the Chechen wars and in Syria, and by both sides in the Russia-Ukraine war since 2014/2022.", source: s6 }
specs:
  rockets_per_launcher: { value: 40, source: s1, confidence: medium, note: "40 x 122 mm tubes in four rows of ten; same figure in s2, s3 and s4." }
  max_range:
    value: 20.38
    source: s4
    confidence: medium
    range: { min: 20.38, max: 40 }
    note: "The BM-21 has no guided rocket (s4 says it is unguided). The value shown is the range of the standard unguided 9M22U rocket (20,380 m), which matches s2. s3 says newer-generation unguided rockets reach 35-40 km."
  reload_time:
    value: 10
    source: s2
    confidence: low
    range: { min: 5, max: 10 }
    note: "Manual reload. s2 and s3 give about 10 min; s1 gives 5 min and, elsewhere, 8 min for a five-man crew; s3 also gives about 5 min."
  combat_weight:
    value: 13.7
    source: s2
    confidence: medium
    range: { min: 13.3, max: 13.7 }
    note: "s2 gives 13.7 t, and s3 gives 13,700 kg fully loaded; s4 gives 13.3 t. 13.7 is shown because two sources agree on it."
  crew:
    value: 3
    source: s4
    confidence: low
    range: { min: 3, max: 6 }
    note: "Reporting is inconsistent: s4 gives 3; s2 gives 5 (8 for the full 9K51 complex); s1 says a five-man crew reloads; s3 gives 6, including 2 in the resupply vehicle."
