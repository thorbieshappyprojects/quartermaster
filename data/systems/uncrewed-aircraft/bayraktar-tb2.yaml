  - { country: UA, force: Navy, state: in_service, quantity: null, source: s10 }
  - { country: PL, force: Armed Forces, state: in_service, quantity: 24, source: s5 }
  - { country: QA, force: Armed Forces, state: in_service, quantity: 6, source: s6 }
  - { country: MA, force: Royal Armed Forces, state: in_service, quantity: 13, source: s8 }
