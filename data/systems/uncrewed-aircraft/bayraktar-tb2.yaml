id: bayraktar-tb2
category: uncrewed-aircraft
name: Bayraktar TB2
variant_note: Baseline TB2 as listed on Baykar's spec sheet (versions TB2-A to TB2-D)
family: Bayraktar
aliases: ["TB2", "Bayraktar TB2 SİHA"]
manufacturer: { name: Baykar }
origin: TR
role: Medium-altitude long-endurance uncrewed aircraft for intelligence, surveillance and reconnaissance, and for precision strike with small guided munitions.
memorable_fact: { text: "In April 2025 Baykar said the TB2 was the first armed UAV to recover from a spin on its own, after it had already flown an autonomous barrel roll in 2024.", source: s3 }
status: in_production
in_service_since: { value: 2014, source: s2, confidence: high, note: "Year the base system entered Turkish Armed Forces service, according to Baykar. Baykar says it was armed the following year." }
units_built: { value: 580, source: s4, confidence: medium, note: "Whole TB2 family (500 armed and 80 unarmed ISR aircraft) as of the 500th armed TB2 rollout in June 2023. This is a lower bound. Higher totals appear only on secondary sites with no primary source, so they are not used. Baykar has stated a production rate of 250 TB2 a year (s11)." }
combat_use: { text: "Baykar says the TB2 has been used in combat in Nagorno-Karabakh, Libya, Syria and Ukraine.", source: s1 }
specs:
  endurance: { value: 18, source: s1, confidence: high, range: { min: 18, max: 20 }, note: "Baykar's spec table says '18+ hours'. The headline on the same page says '20+ hours in air'. The displayed value is the spec-table figure. Baykar also gives a flight record of 27 h 3 min, which is a record and not a standard endurance figure." }
  max_takeoff_weight: { value: 700, source: s1, confidence: high }
  payload: { value: 150, source: s1, confidence: high }
  service_ceiling: { value: 6096, source: s1, confidence: high, range: { min: 6096, max: 6706 }, note: "Spec table gives a service ceiling of 20,000 ft (6096 m). The headline on the same page gives a maximum altitude of 22,000 ft (6706 m). Operational altitude is 16,000 ft (4877 m)." }
  max_speed: { value: 203.7, source: s1, confidence: high, note: "Converted from 110 KTAS, the top of the range Baykar quotes (90-110 KTAS)." }
  wingspan: { value: 12, source: s1, confidence: high }
operators:
