  - { country: HR, force: Armed Forces, state: in_service, quantity: null, source: s9 }
  - { country: AL, force: Armed Forces, state: in_service, quantity: null, source: s9 }
cost: { value: 11.25, currency: USD, price_year: 2021, basis: contract_per_unit, source: s5, confidence: medium, note: "Value in millions of USD. Calculated as Poland's USD 270 million contract for 24 TB2 divided by 24. The contract was signed in 2021 and the last aircraft were delivered in May 2024. The figure includes ground segment and support. Shephard, working from the same contract, gives a gross unit cost of USD 11.17 million and a flyaway cost of USD 8.94 million (s8). Ukraine's 2019 contract works out to USD 11.5 million per aircraft including munitions (s6)." }
contracts:
