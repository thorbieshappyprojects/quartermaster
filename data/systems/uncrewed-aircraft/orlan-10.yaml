id: orlan-10
category: uncrewed-aircraft
name: Orlan-10
variant_note: Baseline Russian military Orlan-10 reconnaissance/EW configuration (export version Orlan-10E)
family: Orlan
aliases: [Орлан-10, Orlan-10E]
manufacturer: { name: Special Technology Center (STC) }
production_sites:
  - { place: Saint Petersburg, country: RU, source: s3 }
origin: RU
role: Small catapult-launched tactical UAV for reconnaissance, artillery fire adjustment and electronic warfare such as GSM jamming.
memorable_fact: { text: "In 2024 its chief designer said STC was building more than a thousand Orlan-10s a year, three to four times its 2021 output.", source: s1 }
status: in_production
in_service_since:
  value: 2010
  source: s8
  confidence: low
  note: "Base system. ALSSA (US joint centre) says it entered Russian Army service in 2010. Airforce Technology says production began in 2010. Other secondary sources give 2011, so the year is uncertain."
units_built:
  value: null
  source: null
  confidence: null
  note: "No public total for the whole production run. In February 2024 STC's chief designer told TASS (s1) that it builds over 1,000 Orlan-10s a year. A pre-2022 cumulative figure appears only on Wikipedia and was not checked against the original source."
combat_use: { text: "Used by Russian forces in the Syrian civil war and widely in the war in Ukraine. In May 2022 the Russian MoD showed strike-capable versions in use there.", source: s3 }
specs:
  endurance: { value: 16, source: s1, confidence: medium, note: "16 h flight duration, as given in TASS and Army Recognition descriptions." }
  max_takeoff_weight:
    value: 16.5
    source: s3
    confidence: low
    range: { min: 14, max: 18 }
    note: "Reported figures differ: 14 kg take-off weight (TASS, s1), 16.5 kg maximum take-off weight (Airforce Technology, s3), up to 18 kg (RBC, s12). 16.5 kg is shown because it is the only figure labelled maximum take-off weight. No manufacturer figure was found."
  payload:
    value: 5
    source: s1
    confidence: medium
    range: { min: 5, max: 6 }
    note: "5 kg per TASS (s1). Military Factory (s13) gives 6 kg."
  service_ceiling: { value: 5000, source: s1, confidence: medium, note: "5,000 m practical ceiling, consistent across TASS, Army Recognition and Airforce Technology." }
  max_speed: { value: 150, source: s1, confidence: medium, note: "TASS gives a cruising speed of 90-150 km/h. Airforce Technology (s3) gives 150 km/h maximum." }
  wingspan: { value: 3.1, source: s3, confidence: medium }
operators:
  - { country: RU, force: Armed Forces (Ground Forces), state: in_service, quantity: null, source: s2 }
  - { country: KZ, force: Armed Forces, state: in_service, quantity: null, source: s4 }
