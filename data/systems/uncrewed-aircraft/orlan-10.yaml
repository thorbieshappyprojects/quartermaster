cost:
  value: 100000
  currency: USD
  price_year: 2023
  basis: unit_price
  source: s11
  confidence: low
  range: { min: 87000, max: 120000 }
  note: "Not a contract figure. US$100,000 per drone is a Ukrainian General Staff figure (May 2023, s11). The range is RUSI's estimated production cost per Orlan-10 (s7). No official Russian unit price or per-unit contract value is public."
contracts:
