  note: "No contract value or manufacturer unit price is public. The only figure found is an unattributed press estimate of about USD 1-2 million per unit, repeated by The Diplomat in 2018. It is not used because no single value is supported."
contracts:
  - { customer: Pakistan / Air Force, year: 2018, quantity: 48, value: null, currency: null, note: "Agreement for AVIC and Pakistan Aeronautical Complex to co-produce 48 Wing Loong II; value not disclosed.", source: s6 }
  - { customer: Nigeria / Air Force, year: 2020, quantity: 8, value: null, currency: null, note: "Eight ordered; the first two were delivered on 11 November 2020. The year shown is the first delivery, as the order date was not published.", source: s8 }
  - { customer: Algeria, year: 2021, quantity: 24, value: null, currency: null, note: "24 ordered in September 2021; deliveries were delayed and the first batch was seen in 2022.", source: s13 }
  - { customer: United Arab Emirates, year: 2017, quantity: 15, value: null, currency: null, note: "Arms registry seen by the BBC lists 15 Wing Loong drones and 350 Blue Arrow 7 missiles bought in 2017. The variant is not specified.", source: s9 }
peers: [mq-9a-reaper, bayraktar-tb2, heron-tp]
