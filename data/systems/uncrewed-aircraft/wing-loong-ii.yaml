id: wing-loong-ii
category: uncrewed-aircraft
name: Wing Loong II
variant_note: Export-standard Wing Loong II airframe; the PLAAF operates a domestic version
family: Wing Loong
aliases: [Wing Loong 2, Pterodactyl II, WL-2, GJ-2]
manufacturer: { name: Aviation Industry Corporation of China (AVIC) – Chengdu Aircraft Design and Research Institute / AVIC UAS }
production_sites:
  - { place: Chengdu, country: CN, source: s5 }
origin: CN
role: Medium-altitude long-endurance uncrewed aircraft for reconnaissance and precision strike, carrying weapons on six underwing hardpoints.
memorable_fact: { text: "When it first flew in February 2017, its chief designer called the Wing Loong II China's equivalent of the US MQ-9 Reaper.", source: s3 }
status: in_production
in_service_since: { value: 2018, source: s4, confidence: medium, note: "Year the Wing Loong II entered PLA Air Force service (reported November 2018). First flight was in February 2017 (s3)." }
units_built: { value: 50, source: s5, confidence: medium, note: "Lower bound: in January 2021 AVIC announced it had delivered the 50th Wing Loong II. No later total is public." }
combat_use: { text: "A BBC investigation found that a UAE-controlled Wing Loong II fired the Blue Arrow 7 missile in the January 2020 strike on a military academy in Tripoli, Libya, which killed 26 cadets.", source: s9 }
specs:
  endurance: { value: 31, source: s7, confidence: medium, range: { min: 20, max: 32 }, note: "Value shown is the Nigerian Air Force figure: 31 h in ISR mode, 26 h in strike role. AVIC was reported as listing 20 h (s2, s3). Army Recognition gives 32 h (s1)." }
  max_takeoff_weight: { value: 4200, source: s2, confidence: medium, note: "4,200 kg as stated by AVIC and reported by FlightGlobal. Army Recognition gives the same figure (s1)." }
  payload: { value: 480, source: s1, confidence: low, range: { min: 400, max: 480 }, note: "480 kg of external stores on six hardpoints (up to 12 guided bombs or missiles). The same source also gives 400 kg as maximum payload, and The Diplomat gives 400 kg (s6)." }
  service_ceiling: { value: 9000, source: s2, confidence: medium, range: { min: 9000, max: 9900 }, note: "9,000 m maximum altitude as listed by AVIC (s2). Xinhua, via UPI, gives more than 29,500 ft (s3). Army Recognition gives 9,900 m (s1)." }
  max_speed: { value: 370, source: s1, confidence: medium, range: { min: 340, max: 370 }, note: "370 km/h per Army Recognition. Xinhua, via UPI, gave 'about 211 mph' (~340 km/h) (s3)." }
  wingspan: { value: 20.5, source: s1, confidence: medium, range: { min: 20.0, max: 20.5 }, note: "20.5 m per Army Recognition and The Diplomat (s4). UPI gives 65.6 ft (20.0 m) (s3). A 14 m figure in FlightGlobal (s2) appears to be an error and is not used." }
operators:
