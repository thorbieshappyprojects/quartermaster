cost: { value: 1410000, currency: USD, price_year: 2019, basis: contract_per_unit, source: s5, confidence: medium, range: { min: 875000, max: 1410000 }, note: "USD 47.9 million FMS contract (announced 31 May 2019) for 34 ScanEagle air vehicles for Malaysia, Indonesia, the Philippines and Vietnam, divided by 34 (about USD 1.41 million). The source does not say what else the contract covers. The low end of the range comes from Insitu/Army Recognition: a full four-aircraft system cost an estimated USD 3.2 million in 2006 and USD 3.5 million in 2013 (s6), or about USD 0.8-0.9 million per aircraft on a different basis." }
contracts:
  - { customer: US Marine Corps, year: 2004, quantity: 16, value: null, currency: null, note: "Two mobile ScanEagle deployment units of eight ScanEagle A air vehicles each, contracted July 2004.", source: s3 }
  - { customer: "Malaysia, Indonesia, Philippines, Vietnam (US FMS)", year: 2019, quantity: 34, value: 47900000, currency: USD, note: "Split 12 / 8 / 8 / 6 air vehicles respectively.", source: s5 }
  - { customer: "Ukraine (US security assistance)", year: 2022, quantity: 15, value: null, currency: null, note: "Part of the USD 775 million aid package of August 2022; no separate ScanEagle value published.", source: s7 }
  - { customer: "Italy / Navy", year: 2025, quantity: 2, value: 19500000, currency: EUR, note: "Two complete ScanEagle systems (not individual aircraft) for FREMM-class frigates, authorised 1 April 2025 via an FMS purchase order; total estimated acquisition cost.", source: s6 }
peers: [orlan-10, bayraktar-tb2]
