id: scaneagle
category: uncrewed-aircraft
name: ScanEagle
variant_note: Current Insitu catalogue configuration (2026 product page)
family: ScanEagle
aliases: [MQ-27A, MQ-27B, MQ-27 ScanEagle]
manufacturer: { name: "Insitu (Boeing subsidiary)" }
origin: US
role: "Small, catapult- or VTOL-launched long-endurance fixed-wing UAS for land and shipborne intelligence, surveillance, reconnaissance and targeting."
memorable_fact: { text: "ScanEagle was developed from Insitu's SeaScan, a commercial drone first built to help fishermen spot tuna; it is recovered by catching a hanging rope with a wingtip hook.", source: s6 }
status: in_production
in_service_since: { value: 2004, source: s8, confidence: high, note: "Base system: US Marine Corps first deployed ScanEagle in July 2004; US Navy service followed in 2005 (s2). The current catalogue configuration has no separately published service-entry date." }
units_built: { value: 1400, source: s4, confidence: medium, note: "Whole family, all versions. Insitu said in May 2012 that it had produced 1,400 ScanEagle aircraft; no newer public total was found, so the current total is higher." }
combat_use: { text: "Used by US Marine Corps and US Navy units in Iraq (from 2004) and Afghanistan, and in maritime operations in the Arabian Sea; the US supplied ScanEagles to Ukraine from 2022 to help with artillery targeting.", source: s2 }
specs:
  endurance: { value: 18, source: s1, confidence: high, range: { min: 18, max: 20 }, note: "Insitu states 18 h ('18+ hours'). The US Navy fact file gives '20+ hrs' for the older, lighter Navy configuration (s2)." }
  max_takeoff_weight: { value: 28, source: s1, confidence: high, range: { min: 22, max: 28 }, note: "Insitu: 62 lb / 28 kg. The US Navy fact file gives 48.5 lb (22.0 kg) for the earlier configuration (s2)." }
  payload: { value: 8, source: s1, confidence: high, note: "Original figure 17 lb / 8 kg maximum payload weight." }
  service_ceiling: { value: 5950, source: s1, confidence: high, range: { min: 5950, max: 6035 }, note: "Insitu: 19,500 ft / 5,950 m. The US Navy fact file gives 19,800 ft (about 6,035 m) (s2)." }
  max_speed: { value: 148, source: s1, confidence: high, note: "Converted from 80 knots (41.2 m/s) = 148.2 km/h. The US Navy fact file also gives 80 kt as the top of its 47-80 kt range (s2)." }
  wingspan: { value: 3.1, source: s1, confidence: high, range: { min: 3.05, max: 3.1 }, note: "Insitu: 10.2 ft / 3.1 m. The US Navy fact file gives a rounded 10 ft (3.05 m) (s2)." }
operators:
