  source: s1
  confidence: medium
  note: "'Over 12,000 rounds produced' as of the 2017 GD-OTS datasheet; a lower bound."
combat_use:
  text: "Fired by Ukrainian PzH 2000 howitzers against armoured vehicles near Soledar, reported in January 2023."
  source: s3
specs:
  max_range:
    value: 27.5
    source: s3
    confidence: medium
    note: "27.5 km as reported for Ukrainian PzH 2000 (155 mm/52) use. GD-OTS gives 22 km for US guns (s1); a 2008 report gives 28 km from a standard 155 mm gun (s4)."
  projectile_weight: { value: 47, source: s1, confidence: high, note: "Weight with fuze, 103 lb (47 kg)." }
  explosive_fill:
    value: 4.2
