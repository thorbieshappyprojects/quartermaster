id: smart-155
category: artillery-ammunition
name: "SMArt 155 (DM702A1)"
variant_note: "Bundeswehr designation DM702A1; carrier shell with two sensor-fuzed submunitions"
family: "SMArt 155"
aliases: ["DM702", "DM702A1", "SMArt155"]
manufacturer: { name: "GIWS (joint venture of Diehl and Rheinmetall)" }
origin: DE
role: "155 mm carrier shell releasing two sensor-fuzed submunitions that find and attack armoured vehicles from above with explosively formed penetrators."
memorable_fact: { text: "If a SMArt submunition finds no target, two independent self-destruct mechanisms are meant to stop it leaving unexploded ordnance.", source: s2 }
status: in_production
in_service_since:
  value: 2000
  source: s3
  confidence: low
  note: "Germany's defence ministry reported receiving 9,000 rounds in 2000-2003 (as cited by s3)."
units_built:
