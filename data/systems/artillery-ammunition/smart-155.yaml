    confidence: medium
    range: { min: 4.2, max: 4.4 }
    note: "Datasheet states 'High Explosive 9.7 lb (4.2 kg)'; 9.7 lb converts to 4.4 kg. Total for both submunitions. The stated kg figure is shown."
  accuracy_cep: { value: null, source: null, confidence: null, note: "Sensor-fuzed area munition; no CEP published." }
