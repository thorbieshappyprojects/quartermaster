manufacturer: { name: "RTX (Raytheon), with BAE Systems Bofors" }
origin: US
role: "GPS-guided, fin-stabilised 155 mm projectile with a unitary high-explosive warhead for precise strikes on point targets."
memorable_fact: { text: "In a 2013 test from a PzH 2000, the average miss distance of Excalibur at 48 km was under one metre.", source: s4 }
