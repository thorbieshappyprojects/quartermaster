    confidence: high
    note: "Manufacturer: 40 km from 39-calibre, 50 km from 52-calibre and 70 km from 58-calibre guns (s1). The 52-calibre figure is shown."
  projectile_weight: { value: 48, source: s2, confidence: medium }
  explosive_fill: { value: 22, source: s2, confidence: medium, note: "PBXN-9 unitary warhead." }
