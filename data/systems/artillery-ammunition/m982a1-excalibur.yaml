units_built:
  value: null
  source: null
  confidence: null
  note: "No public production total found. CSIS estimated annual production at about 1,000 rounds in early 2023 (s3)."
combat_use:
  text: "Ukraine fired Excalibur from M777 howitzers; a Ukrainian assessment says Russian GPS jamming cut its hit rate from over 50% to below 10% during 2023. First combat use was in Iraq in 2007 (s2)."
  source: s6
specs:
  max_range:
    value: 50
