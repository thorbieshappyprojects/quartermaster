id: f-35a
category: fighter-aircraft
name: F-35A Lightning II
variant_note: Conventional take-off and landing (CTOL) variant; values are for the current production configuration
family: F-35 Lightning II
aliases: ["F-35 CTOL", "F-35I Adir (Israeli derivative of the F-35A)"]
manufacturer: { name: Lockheed Martin }
production_sites:
  - { place: Fort Worth, country: US, source: s6 }
  - { place: Cameri, country: IT, source: s6 }
  - { place: Nagoya, country: JP, source: s6 }
origin: US
role: Single-seat, single-engine stealth multirole fighter for air-to-air and surface-attack missions, flown from conventional runways.
memorable_fact: { text: "The F-35A is the most common F-35 variant; the US Air Force alone plans to buy 1,763 of them.", source: s5 }
status: in_production
in_service_since: { value: 2016, source: s2, confidence: high, note: "This variant: US Air Force declared Initial Operational Capability on 2 August 2016. The first USAF delivery was in April 2011." }
units_built: { value: 1300, source: s7, confidence: low, note: "Covers the whole F-35 family (A, B and C), not the F-35A alone. The source gives about 1,300 F-35s in service worldwide as of January 2026. No public F-35A-only total was found. The 191 jets delivered in 2025 included 48 F-35As for the USAF." }
combat_use: { text: "Israel's F-35I Adir, a modified F-35A, was the first F-35 used in combat; the Israel Defense Forces confirmed in May 2018 that it had flown airstrikes in the Middle East.", source: s8 }
specs:
  max_speed: { value: 1.6, source: s1, confidence: high, note: "Manufacturer figure: Mach 1.6. The USAF fact sheet gives the same value (about 1,200 mph)." }
  combat_radius: { value: 1093, source: s1, confidence: high, note: "Manufacturer gives more than 590 nmi (1,093 km) on internal fuel. Range on internal fuel is more than 1,200 nmi (2,200 km)." }
  service_ceiling: { value: 15240, source: s3, confidence: medium, note: "Government fact sheet says 'above 50,000 feet (15 kilometers)'. 50,000 ft = 15,240 m. This is a lower bound, not an exact figure." }
  max_takeoff_weight: { value: 31.75, source: s2, confidence: medium, note: "USAF fact sheet gives a '70,000 pound class', which converts to about 31.75 t. The 'class' wording makes this approximate." }
  thrust: { value: 177.9, source: s1, confidence: medium, range: { min: 177.9, max: 191.3 }, note: "Single F135-PW-100 engine. Lockheed Martin gives 40,000 lbf maximum (with afterburner) and 25,000 lbf military power; 40,000 lbf = 177.9 kN. USAF fact sheets give 43,000 lb (191.3 kN). The manufacturer's afterburner figure is displayed." }
  hardpoints: { value: 10, source: s4, confidence: high, note: "4 internal weapon stations in two weapon bays plus 3 external stations under each wing." }
