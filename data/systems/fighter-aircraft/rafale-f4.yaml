id: rafale-f4
category: fighter-aircraft
name: "Rafale F4"
variant_note: "F4 standard (F4.1 qualified 2023); airframe/performance data are Rafale family figures"
family: "Rafale"
aliases: ["Rafale F4.1", "Dassault Rafale F4"]
manufacturer: { name: "Dassault Aviation" }
production_sites:
  - { place: "Mérignac", country: FR, source: s12 }
origin: FR
role: "Twin-engine multirole combat aircraft for air superiority, ground attack, reconnaissance and nuclear deterrence, with F4 networked-combat upgrades."
memorable_fact: { text: "The F4 standard added the Thales Scorpion helmet-mounted display, the MICA NG missile and the 1,000 kg AASM Hammer bomb; the first F4 jet reached the French Air and Space Force in March 2023.", source: s4 }
status: in_production
in_service_since:
  value: 2023
  source: s4
  confidence: medium
  note: "Year the variant entered service: the first F4.1-standard Rafale went to the Air Warfare Centre (CEAM) at Mont-de-Marsan on 2 March 2023. The DGA qualified the F4.1 standard on 13 March 2023 (s5). The base Rafale entered service with the French Navy in 2004 and the Air Force in 2006 (s6)."
units_built:
  value: 300
  source: s6
  confidence: high
  note: "Rafale family, all standards: Dassault said its 300th Rafale was completed in early October 2025. StratPost (s7) works out about 313 deliveries by 31 Dec 2025. No public F4-only figure exists, because French jets are being upgraded to F4 as well as built new."
combat_use: { text: "The Rafale family has been used in combat over Libya (2011), Mali (2013), Iraq and Syria, and against Iranian drones in 2024. The sources reviewed do not say which combat use involved F4-standard aircraft.", source: s15 }
specs:
  max_speed: { value: 1.8, source: s1, confidence: high, note: "Manufacturer figure: M 1.8 / 750 kt (Rafale family)." }
  combat_radius: { value: 1850, source: s14, confidence: low, range: { min: 1000, max: 1852 }, note: "No manufacturer or government figure. Military Factory gives 1,000 nmi (about 1,852 km), shown rounded to 1,850 km. Other secondary sources give 1,000 to 1,850 km (s17). Mission profile not stated." }
  service_ceiling: { value: 15240, source: s1, confidence: high, note: "Converted from the manufacturer figure of 50,000 ft." }
  max_takeoff_weight: { value: 24.5, source: s1, confidence: high, note: "Manufacturer figure: 24.5 t (54,000 lb)." }
  thrust: { value: 147, source: s2, confidence: high, note: "Two Safran M88 engines, 7.5 tonnes-force each with afterburner (s1, s2), converted: 2 x 73.5 kN = about 147 kN." }
  hardpoints: { value: 14, source: s1, confidence: high, note: "Manufacturer figure: 14 store stations in total, 5 of them heavy/wet. The naval version has 13." }
operators:
  - { country: FR, force: "French Air and Space Force", state: in_service, quantity: null, source: s8 }
  - { country: ID, force: "Indonesian Air Force", state: in_service, quantity: 42, source: s12 }
  - { country: AE, force: "UAE Air Force and Air Defence", state: ordered, quantity: 80, source: s10 }
  - { country: IN, force: "Indian Air Force", state: evaluating, quantity: 114, source: s16 }
cost:
  value: 119000000
  currency: EUR
  price_year: 2023
  basis: contract_per_unit
  source: s9
  confidence: low
  range: { min: 119000000, max: 200000000 }
  note: "French tranche 5 contract (December 2023): 42 F4 aircraft for 'more than EUR 5 billion' (s9), so about EUR 119m per aircraft at minimum. The UAE contract for 80 F4s at about EUR 16bn works out to about EUR 200m each (s11). Export packages include support and weapons. Confidence is low because the French total is only a lower bound."
contracts:
  - { customer: "France / Air and Space Force (tranche 5)", year: 2023, quantity: 42, value: 5000000000, currency: EUR, note: "Single-seat F4 aircraft ordered by the DGA at the end of December 2023 (s8). Value reported as 'more than EUR 5 billion' (s9). Deliveries planned 2027-2032.", source: s9 }
  - { customer: "United Arab Emirates", year: 2021, quantity: 80, value: 16000000000, currency: EUR, note: "First export customer for the F4 (s10). Value for the aircraft package; other reports give USD 16-19bn, some including 12 H225M helicopters.", source: s11 }
  - { customer: "Indonesia / Air Force", year: 2022, quantity: 42, value: 8100000000, currency: EUR, note: "Framework agreed February 2022; firm orders of 6 (2022), 18 (2023) and 18 (2024) (s12). First three aircraft arrived 23 January 2026. Value 'roughly EUR 8.1 billion'.", source: s13 }
peers: [eurofighter-typhoon, f-35a, gripen-e]
