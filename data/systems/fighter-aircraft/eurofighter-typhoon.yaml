id: eurofighter-typhoon
category: fighter-aircraft
name: Eurofighter Typhoon Tranche 2
variant_note: Tranche 2 production standard (core nations and Saudi Arabia); airframe and engine specs are common to Tranches 1-3
family: Eurofighter Typhoon
aliases: [EF-2000, Typhoon FGR4, C.16]
manufacturer: { name: Eurofighter Jagdflugzeug GmbH }
production_sites:
  - { place: Warton, country: GB, source: s11 }
# Origin: jointly developed by Germany, United Kingdom, Italy and Spain; DE given as seat of Eurofighter GmbH.
origin: DE
role: Twin-engine, single-seat multirole combat aircraft for air defence and air-to-ground missions.
memorable_fact: { text: "The Typhoon can supercruise, meaning it can fly supersonic for long periods without using afterburners.", source: s1 }
status: in_production
in_service_since: { value: 2008, source: s4, confidence: medium, note: "First Tranche 2 deliveries (UK, October 2008). The base system was first delivered to the Bundeswehr in 2003 (s1)." }
units_built:
  value: 251
  range: { min: 251, max: 275 }
  source: s4
  confidence: low
  note: "Tranche 2 contract quantity for the four core nations (236 originally, raised to 251). A secondary source gives 275 Tranche 2 aircraft overall (s13). Whole family: 769 ordered and 619 delivered per an Eurofighter briefing slide reported in November 2026 (s3)."
combat_use: { text: "RAF Typhoons first saw combat in 2011 over Libya (Op ELLAMY) and have flown in Iraq and Syria under Op SHADER since 2015.", source: s2 }
specs:
  max_speed: { value: 2.0, source: s1, confidence: medium, note: "Austrian MoD lists top speed as 2,495 km/h / Mach 2." }
  combat_radius:
    value: 1389
    range: { min: 601, max: 1389 }
    source: s5
    confidence: low
    note: "Depends on the flight profile: 1,389 km for hi-lo-hi ground attack, 601 km for lo-lo-lo ground attack. Not a manufacturer figure."
  service_ceiling:
    value: 16765
    range: { min: 16765, max: 18290 }
    source: s1
    confidence: medium
    note: "Shows the government figure (Austrian MoD). GlobalSecurity lists 18,290 m (60,000 ft) (s5)."
  max_takeoff_weight:
    value: 23.5
    range: { min: 23.0, max: 23.5 }
    source: s6
    confidence: medium
    note: "EUROCONTROL and GlobalSecurity (s5) list 23,500 kg. The Austrian MoD air-show page lists 23,000 kg (s1)."
  thrust: { value: 180, source: s1, confidence: high, note: "2 x EJ200 at 90 kN each with afterburner (60 kN dry)." }
  hardpoints: { value: 13, source: s7, confidence: medium, note: "Four under each wing and five under the fuselage. Matches GlobalSecurity (s5)." }
