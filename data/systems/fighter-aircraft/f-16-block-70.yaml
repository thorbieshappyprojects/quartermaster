id: f-16-block-70
category: fighter-aircraft
name: F-16 Block 70
variant_note: "New-build F-16C/D Block 70 (GE F110 engine); the Block 72 is the same jet with a Pratt & Whitney F100 engine"
family: F-16 Fighting Falcon
aliases: ["F-16V", "F-16 Block 70/72", "Viper"]
manufacturer: { name: Lockheed Martin }
production_sites:
  - { place: Greenville, country: US, source: s12 }
origin: US
role: "Single-engine multirole fighter for air-to-air and air-to-surface missions. It is the newest production version of the F-16, with an APG-83 AESA radar and a new mission computer."
memorable_fact: { text: "Lockheed Martin rates the Block 70/72 airframe for 12,000 flight hours, more than 50 percent longer than earlier production F-16s.", source: s2 }
status: in_production
in_service_since:
  value: 2023
  source: s5
  confidence: medium
  note: "Year of first delivery of this variant: the first of 16 jets for Bahrain was handed over in Greenville in March 2023. The base F-16A reached initial operating capability in January 1979 (s3)."
units_built:
  value: null
  source: null
  confidence: null
  note: "No public total for Block 70/72 jets built or delivered was found. Known deliveries: Slovakia 14 (complete, s9), Bulgaria 8 of 16 (s11), Taiwan 2 of 66 by October 2026 (s13), plus Bahrain (first jet March 2023, s5)."
combat_use: { text: "A Royal Bahraini Air Force F-16 Block 70 shot down two Iranian drones during a Middle East conflict. Press reports describe these as the first air-to-air kills for the Block 70/72 version.", source: s6 }
specs:
  max_speed:
    value: 2.0
    source: s1
    confidence: high
    range: { min: 2.0, max: 2.05 }
    note: "Lockheed Martin gives 1,500 mph (Mach 2+), so 2.0 is a lower bound. Army Recognition gives Mach 2.05 (s4)."
  combat_radius:
    value: 550
    source: s4
    confidence: low
    note: "Single secondary source, described as about 550 km depending on load and mission profile. Lockheed Martin and USAF give no combat radius. USAF gives a ferry range of more than 2,002 mi for the F-16C/D (s3)."
  service_ceiling:
    value: 15240
    source: s3
    confidence: medium
    note: "USAF figure for the F-16 family: 'above 50,000 feet (15 kilometers)', converted to 15,240 m. Army Recognition gives the same 50,000 ft for Block 70 (s4)."
  max_takeoff_weight:
    value: 21.77
    source: s1
    confidence: high
    range: { min: 19.2, max: 21.77 }
    note: "Lockheed Martin gives a maximum take-off gross weight of 48,000 lb / 21,772 kg. Army Recognition gives about 19,200 kg (s4). The USAF F-16C/D figure is 37,500 lb (s3). The manufacturer figure is displayed."
  thrust:
    value: 129.0
    source: s1
    confidence: high
    range: { min: 129.0, max: 131.2 }
    note: "Lockheed Martin gives an engine thrust class of 29,000 lb (one engine), converted to 129.0 kN. Army Recognition gives 29,500 lb (131.2 kN) with afterburner (s4)."
  hardpoints:
    value: 11
    source: s4
    confidence: medium
    note: "6 underwing, 2 wingtip, 2 under-fuselage and 1 centerline station, according to Army Recognition."
