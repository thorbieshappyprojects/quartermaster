cost:
  value: 70000000
  currency: USD
  price_year: 2018
  basis: contract_per_unit
  source: s7
  confidence: medium
  range: { min: 63000000, max: 70000000 }
  note: "Bahrain's production deal: USD 1.12 billion for 16 aircraft (s7), about USD 70 million per jet. The contract year (2018) is not stated in s7. The same article quotes an analyst estimate of about USD 63 million per unit. Full packages with weapons and support cost much more per jet: about USD 128 million for Slovakia and about USD 285 million for Peru (s19)."
