role: Tracked main battle tank with a 120 mm smoothbore gun; the current production configuration of the Abrams series for the US Army and export customers.
memorable_fact: { text: "The SEPv3 adds a new auxiliary power unit so the crew can run sensors and communications without starting the tank's 1,500 hp gas-turbine engine.", source: s4 }
status: in_production
in_service_since:
  value: 2020
  source: s6
  confidence: high
  note: "Year the first US Army unit was equipped with this variant (FY2020; 3rd Battalion, 8th Cavalry Regiment, 1st Cavalry Division, Fort Hood, July 2020 per s15). The first SEPv3 initial-production vehicle was delivered in October 2017 (s5). The base Abrams debuted in 1980 (s2). The Army plans to keep producing the SEPv3 at a reduced rate until production moves to the M1E3 (s6, s8)."
