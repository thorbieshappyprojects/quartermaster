role: "Tracked main battle tank; the latest production version of the Leopard 2 family, armed with a 120 mm smoothbore gun and fitted with an active protection system."
memorable_fact: { text: "German defence officials describe the Leopard 2A8 as the first newly built Leopard tank since 1992; earlier versions were upgrades of existing tanks.", source: s4 }
