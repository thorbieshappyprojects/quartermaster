  - { customer: "Germany / German Army", year: 2023, quantity: 18, value: 525600000, currency: EUR, note: "Framework contract for up to 123 tanks signed with BAAINBw in May 2023. Value is the first firm order for 18 tanks, covering development, delivery and a five-year logistics package. ESUT reported a further EUR 2.4 billion as an option.", source: s8 }
  - { customer: "Norway / Norwegian Army", year: 2023, quantity: 54, value: null, currency: null, note: "Contract signed 17 February 2023 (s14). The Norwegian Defence Materiel Agency gives a price-adjusted project cost frame of NOK 23.4 billion (s5). That is a project budget, not the contract value. Most of the tanks are to be built by RITEK in Norway.", source: s14 }
  - { customer: "Lithuania / Lithuanian Land Forces", year: 2024, quantity: 44, value: 950000000, currency: EUR, note: "Contract with KNDS Deutschland signed December 2024, as reported by The Defense Post.", source: s10 }
  - { customer: "Croatia / Croatian Army", year: 2025, quantity: 44, value: 1483938969.77, currency: EUR, note: "Order confirmation signed in Berlin on 10 December 2025. The value includes supplementary contracts for simulators and a five-year extended warranty. Funded partly through the EU SAFE instrument.", source: s9 }
