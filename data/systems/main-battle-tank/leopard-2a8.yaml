in_service_since:
  value: 2026
  source: s6
  confidence: medium
  note: "Year this variant was first delivered: Norway's first two Leopard 2A8 NO arrived at Rena camp on 30 April 2026. The Norwegian Army plans to start integrating the tanks in 2027 (s5). Deliveries of Germany's 123 tanks are reported for 2027-2030 (s4). The first German and Norwegian vehicles were rolled out in Munich on 19 November 2025 (s3). The year applies to the A8 variant, not the Leopard 2 base system."
