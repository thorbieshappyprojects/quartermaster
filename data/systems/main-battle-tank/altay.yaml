role: Tracked main battle tank with a 120 mm smoothbore gun, procured for the Turkish Land Forces to replace ageing M48 and M60 tanks.
memorable_fact: { text: "The tank is named after General Fahrettin Altay, who commanded the Fifth Cavalry Corps in the Turkish War of Independence.", source: s3 }
status: in_production
in_service_since:
  value: 2025
  source: s2
  confidence: medium
  note: "Year of first service of the Altay T1 serial variant, which is also the first service of the base system. The first serial tanks were handed to the Turkish Land Forces on 28 October 2025 at BMC's new Ankara plant (s2). Two Altays with the South Korean powerpack had already been given to the Turkish Armed Forces in 2023, but only for testing (s4)."
units_built:
  value: 3
  source: s5
  confidence: low
  range: { min: 2, max: 3 }
  note: "Altay T1 serial tanks confirmed delivered, i.e. the confirmed fielded fleet. Euro-SD reports two delivered at the 28 Oct 2025 ceremony (s2). OverT Defense reports a first batch of three (s4). Defence Security Asia (Aug 2026) says three T1s entered the inventory in 2025 (s5). BMC told Shephard that 14 would be delivered by the end of 2026 (s6), but I found no confirmation that this happened. The official schedule announced by the SSB President is 3 in 2025, 11 in 2026, 41 in 2027 and 30 in 2028 (s11). Pre-series test vehicles are not counted."
specs:
