  gun_calibre:
    value: 120
    source: s1
    confidence: high
    note: "120 mm L55 smoothbore main gun with 40 rounds stowed, per the manufacturer. The gun is produced by MKE (s2)."
  engine_power:
    value: 1500
    source: s1
    confidence: high
    note: "BMC lists a 12-cylinder, 1,500 hp electronically controlled engine. On the T1 this is the HD Hyundai Infracore DV27K V12, paired with the SNT Dynamics EST15K transmission (s2). The indigenous BMC Power BATU powerpack (minimum 1,500 hp) is planned from the T2 onward (s2)."
  top_speed:
    value: 65
    source: s1
    confidence: high
    note: "Maximum road speed per the manufacturer. Off-road speed is 45 km/h."
  range:
