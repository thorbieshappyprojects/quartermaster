id: k2-black-panther
category: main-battle-tank
name: "K2 Black Panther (ROK Army 4th production batch / K2GF export standard)"
family: "K2 Black Panther"
aliases: ["K2", "Heukpyo", "K2GF", "K2PL"]
manufacturer: { name: "Hyundai Rotem" }
origin: KR
role: "Third-generation main battle tank with a 120 mm smoothbore gun and autoloader, operated by a crew of three."
memorable_fact: { text: "Poland's 2022 framework agreement allows it to buy up to 1,000 K2 tanks, which could make the K2 the main tank of the Polish land forces.", source: s2 }
status: in_production
in_service_since:
  value: 2014
  source: s7
  confidence: medium
  note: "Year the base K2 system was first deployed with the Republic of Korea Army. This is not the year the current production standard entered service. Several secondary sources agree on 2014; this card cites one of them. The 4th ROK batch uses a fully domestic powerpack and is due to be fitted from 2026 (s6). The K2GF variant for Poland was first delivered under the 2022 contract (s3)."
units_built:
  value: 440
  source: s4
  confidence: low
  note: "Whole-family figure added up from two public numbers; no single source states it. ROK Army: about 260 K2s were ordered in the first three batches, and most had been delivered by 2023 (Janes, s4). Poland: 180 K2GF were delivered in full under the 2022 contract by 13 November 2025 (s3). Not included: deliveries under Poland's 2025 contract, which started in 2026, and ROK batch-4 tanks. No current official total was found."
specs:
  combat_weight:
    value: 56
    source: s1
    confidence: high
    range: { min: 55, max: 56 }
    note: "The manufacturer gives 56 t. Some trade press reports 55 t (s11). The manufacturer figure is shown."
  gun_calibre:
    value: 120
    source: s1
    confidence: high
    note: "120 mm, 55-calibre smoothbore gun with automatic loading; 40 rounds carried."
  engine_power:
    value: 1500
    source: s1
    confidence: high
    note: "1,500 hp diesel. The 4th ROK production batch uses a fully domestic powerpack (domestic engine and transmission) (s6)."
  top_speed:
    value: 70
    source: s1
    confidence: high
    note: "On paved road; the manufacturer gives 50 km/h off-road."
  range:
    value: 450
    source: s1
    confidence: high
  crew:
    value: 3
    source: s1
    confidence: high
    note: "Commander, gunner and driver; the autoloader takes the place of a loader."
operators:
  - { country: KR, force: "Republic of Korea Army", state: in_service, quantity: 260, source: s4 }
  - { country: PL, force: "Polish Land Forces", state: in_service, quantity: 180, source: s3 }
  - { country: PL, force: "Polish Land Forces", state: ordered, quantity: 180, source: s2 }
  - { country: PE, force: "Peruvian Army", state: evaluating, quantity: null, source: s9 }
cost:
  value: 18720000
  currency: USD
  price_year: 2022
  basis: contract_per_unit
  source: s3
  confidence: medium
  range: { min: 18720000, max: 20560000 }
  note: "Poland's first executive contract of 26 August 2022: USD 3.37 billion net for 180 K2GF, about USD 18.72 million per tank. That value also covers support elements, not only the tanks. One trade outlet reports USD 3.7 billion for the same contract (s10), about USD 20.56 million per tank. The value reported by Polish trade press with the PLN breakdown (s3) is shown. The 2025 contract (s2) is not used here because it also includes 81 support vehicles."
contracts:
  - { customer: "Poland / Polish Armed Forces", year: 2022, quantity: 180, value: 3370000000, currency: USD, note: "First executive contract (K2GF), signed 26 August 2022, value net of VAT. Deliveries were completed in November 2025.", source: s3 }
  - { customer: "Poland / Polish Armed Forces", year: 2025, quantity: 180, value: 6500000000, currency: USD, note: "Second executive contract, signed 1 August 2025 in Gliwice: 116 K2GF built in Korea and 64 K2PL (3 built in Korea, 61 in Poland). Also includes 81 support vehicles. Deliveries 2026-2030.", source: s2 }
  - { customer: "Republic of Korea / Army", year: 2023, quantity: null, value: 1940000000000, currency: KRW, note: "DAPA approved the 4th production batch on 25 May 2023, with KRW 1.94 trillion budgeted for 2024-2028. DAPA did not give a quantity; about 150 tanks were reported later (s5).", source: s4 }
  - { customer: "Peru / FAME S.A.C. (Peruvian Army)", year: 2025, quantity: 54, value: 2000000000, currency: USD, note: "Framework agreement signed December 2025, not a firm purchase contract. The value also covers 141 K808 wheeled vehicles. No implementation contract was reported in available sources as of mid-2026 (s9).", source: s8 }
