id: mi-28nm
category: attack-helicopter
name: Mi-28NM
variant_note: Modernised Mi-28N with mast-mounted radar, VK-2500P engines and LMUR missile; most performance values are Mi-28NE figures
family: Mi-28
aliases: [Mi-28NM Night Hunter, Havoc]
manufacturer: { name: Russian Helicopters (Mil / Rostvertol) }
production_sites:
  - { place: Rostov-on-Don, country: RU, source: s4 }
origin: RU
role: Two-seat tandem attack helicopter for anti-armour, fire support and strikes on air targets, day and night.
memorable_fact: { text: "Unlike the Mi-28N, the NM carries an N025M radar on top of the rotor mast and can fire the long-range LMUR missile.", source: s5 }
status: in_production
in_service_since: { value: 2019, source: s4, confidence: medium, note: "Rostec: the first serial Mi-28NM were delivered to the Russian Ministry of Defence in 2019. The base Mi-28N was first accepted in 2008 (s5)." }
units_built: { value: null, source: null, confidence: null, note: "No official total. TWZ (early 2023) doubted that more than 10 were in service; 98 are on order for delivery by 2027." }
combat_use: { text: "First seen in the war against Ukraine on 15 October 2022; LMUR missile launches were shown from January 2023.", source: s5 }
specs:
  max_speed: { value: 300, source: s2, confidence: low, note: "Mi-28NE export variant: 300 km/h, cruise 270 km/h. Mi-28N figures range from 282 to 324 km/h (s3). No Mi-28NM-specific figure was found." }
  range: { value: 435, source: s2, confidence: low, note: "Mi-28NE: about 435 km. Mi-28N: 460 km at normal take-off weight (s3)." }
  service_ceiling: { value: 5600, source: s2, confidence: low, note: "Mi-28NE. Mi-28N: 5,700-5,750 m (s3)." }
  max_takeoff_weight: { value: 12.1, range: { min: 11.5, max: 12.1 }, source: s2, confidence: low, note: "Mi-28NE: 12,100 kg. Mi-28N: 11,500 kg (s3)." }
  engine_power: { value: 5000, source: s1, confidence: medium, note: "Two VK-2500P turboshafts, 2,500 hp each at take-off rating (2,800 hp emergency), up from 2,400 hp on the earlier engine." }
  gun_calibre: { value: 30, source: s3, confidence: medium, note: "2A42 30 mm cannon in a movable chin mount (Mi-28N/NE)." }
