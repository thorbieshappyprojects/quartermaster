id: m795
items:
  - summary: "A Ukrainian artillery brigade commander said long-range M795-type shells reach about 30 km with good propellant, but they are expensive, scarce, wear barrels faster and give away the position with a large muzzle flash. He suggested a mix with cheaper short-range M107 rounds of about 60 to 40 for most brigades."
    quote: "cause faster barrel wear"
