# User feedback researched 2026-11-22. Summaries in own words; quotes are short excerpts with their source.
id: phl-16
items: []
note: "I found no first-hand accounts from PHL-16/PCH191 users that I could verify. My search tool limit ran out before I could read past the search snippets, so this check was incomplete. Chinese defence ministry and China Military Online pages (e.g. https://eng.mod.gov.cn/2025xb/D/V/16493679.html, https://eng.chinamil.com.cn/2025xb/B/16482523.html) only describe live-fire drills in the reporter's voice, and coverage of the UAE's AR3 is about procurement only. The US Naval War College China Maritime Report #32 (Arostegui, 2023; https://www.andrewerickson.com/wp-content/uploads/2023/11/CMSI_China-Maritime-Report_32_PCH191-Modular-Long-Range-Rocket-Launcher_Arostegui_202311.pdf) says it draws on an October 2022 interview with a PCH191 battalion NCO and on PLA videos featuring a battalion commander, but the PDF would not open for me, so none of that is included here. Reading that report's footnotes and the Chinese-language PLA Daily (解放军报) sources it cites is the most promising next step."
