# User feedback researched 2026-11-22. Summaries in own words; quotes are short excerpts with their source.
id: altay
items: []
note: I found no credible first-hand accounts from Altay crews, commanders, maintainers or trial units, and my searches were cut short by a tool limit before I could check Shephard's report on the New Altay prototypes accepted for Army testing. The coverage I did find (Defense News, Overt Defense, Army Recognition, Shephard, Anadolu Agency) was mostly about deliveries, production schedules, engine factory tests and HAVELSAN training equipment. The only trial figures came from President Erdoğan (35,000 km of mobility testing and 3,700 live rounds), which is a political statement, not feedback from the people using the tank.
