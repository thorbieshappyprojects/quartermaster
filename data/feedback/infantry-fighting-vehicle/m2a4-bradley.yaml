id: m2a4-bradley
items: []
note: I found no credible first-hand accounts. My search tool hit its usage limit after one query, and that query only returned a War Thunder game forum thread, which isn't a user source. Coverage of the M2A4E1 is likely thin anyway because it is mostly a test and demonstrator configuration (Iron Fist active protection on the A4 baseline). If you re-run this, the best leads are Army.mil fielding stories and Ukrainian crew interviews about earlier Bradley variants.
