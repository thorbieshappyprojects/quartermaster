    speaker: "Estonian company commander (captain), Scouts Battalion"
    context: "First CV9035 live-fire exercises in Estonia, March 2017, on vehicles bought from the Netherlands"
    sentiment: "positive"
    topics: ["training", "firepower"]
    source: { url: "https://www.err.ee/585879/fotod-ja-video-soomuskool-viis-labi-esimesed-cv9035-lahinglaskmised", title: "Fotod ja video: soomuskool viis läbi esimesed CV9035 lahinglaskmised", publisher: "ERR", date: "2017-03-24", retrieved: "2026-11-22" }
