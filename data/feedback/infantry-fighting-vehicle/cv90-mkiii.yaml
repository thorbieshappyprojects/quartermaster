# User feedback researched 2026-11-22 in a Claude Code session (web search). Summaries in own words; quotes are short excerpts with their source.
id: "cv90-mkiii"
items:
  - summary: "After the first live firing of Estonia's ex-Dutch CV9035 vehicles, the company commander said the shooting went better than expected, which he took as proof that crew training had been fully sufficient."
