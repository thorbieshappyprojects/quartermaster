# Ranks researched 2026-11-22 in a Claude Code session (web search).
id: cn-navy
country: CN
branch: navy
force: "Zhongguo Renmin Jiefangjun Haijun"
force_en: "People's Liberation Army Navy"
nato_graded: false
note: "Native name 中国人民解放军海军. Navy ranks are the army ranks prefixed with 海军 (Haijun); there are no separate Chinese naval titles, and English-language PLA usage renders them with naval titles (ensign to admiral). Names are toneless pinyin without the prefix; the full Chinese form is in each note. The English titles for ensign to captain are the usual naval equivalents of the army titles, not taken from an official PLA list. China is not graded in the NATO scheme, so every code is an approximate equivalent. Basis: the rank's position in the statutory sequence and the Western rank whose English title the PLA translation uses (e.g. Sergeant = OR-5, Colonel = OF-5). Senior colonel/senior captain (大校) sits between colonel and the one-star rank and is placed at OF-6; the general/flag ranks then follow at OF-7 to OF-9, although by star count (one to three stars, no four-star rank) they would sit one grade lower. Chief petty officer classes 3 and 2 are both placed at OR-8 and class 1 at OR-9. Officer ranks follow the 1988 regulation as amended in 1994 (ten ranks; the 2021 officer reforms kept ranks and grades); enlisted ranks follow the NPC Standing Committee decision in force since 31 March 2022. Officer cadets (学员) hold no rank and are left out."
