note: NATO codes follow the US column of NATO APersP-01 (STANAG 2116, Ed. A V3). That edition predates the return of Air Force warrant officers (first class graduated December 2024); their grades W-1..W-5 are coded WO-1..WO-5 as for the other US services. First Sergeant and Command Chief Master Sergeant are duty positions held by master, senior master or chief master sergeants and are not listed. General of the Air Force (five-star, wartime only) is not listed; APersP-01 gives no US OF-10.
