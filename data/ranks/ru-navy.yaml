# Ranks researched 2026-11-22 in a Claude Code session (web search).
id: ru-navy
country: RU
branch: navy
force: "Voyenno-morskoy flot"
force_en: "Russian Navy"
nato_graded: false
note: "Native name Военно-морской флот (ВМФ). Ranks are the naval (корабельные) military ranks of Article 46 of Federal Law 53-FZ as restated in the Regulation on the Procedure for Military Service, which makes each naval rank equal to the army rank in the same position; codes therefore match the ru-army file. Navy personnel outside the ship-based forces may hold army-style ranks; which arms do was not confirmed from an official source. Names in standard transliteration, Cyrillic in each note. Russia is not graded in the NATO scheme, so every code is an approximate equivalent. Basis: the rank's position in the statutory sequence of Article 46 (most junior first) and the Western rank with the same or usual English title (e.g. serzhant = sergeant OR-5, polkovnik = colonel OF-5). Russia has no brigadier rank: the four flag ranks are placed at OF-6 to OF-9; the Marshal of the Russian Federation has no naval counterpart. The michman ranks are a separate personnel category between NCOs and officers, not commissioned; they are placed at OR-8 and OR-9. Junior lieutenant, lieutenant and senior lieutenant are placed at OF-1."
ranks:
