  - { id: ru-navy-glavnyy-korabelnyy-starshina, name: "Glavnyy korabel'nyy starshina", name_en: "Chief ship petty officer", code: OR-7, approximate: true, group: nco, note: "Главный корабельный старшина. Equal to starshina; highest rank of the seamen-and-petty-officers category.", source: s1 }
