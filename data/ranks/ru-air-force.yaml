# Ranks researched 2026-11-22 in a Claude Code session (web search).
id: ru-air-force
country: RU
branch: air_force
force: "Vozdushno-kosmicheskiye sily"
force_en: "Russian Aerospace Forces"
nato_graded: false
note: "Native name Воздушно-космические силы (ВКС). The Aerospace Forces use the army-style (войсковые) military ranks of Article 46 of Federal Law 53-FZ; the naval (корабельные) column applies to the Navy. Names in standard transliteration, Cyrillic in each note. Russia is not graded in the NATO scheme, so every code is an approximate equivalent. Basis: the rank's position in the statutory sequence of Article 46 (most junior first) and the Western rank with the same or usual English title (e.g. serzhant = sergeant OR-5, polkovnik = colonel OF-5). Russia has no brigadier rank: the four general ranks are placed at OF-6 to OF-9 and the Marshal of the Russian Federation at OF-10. The praporshchik (warrant officer) ranks are a separate personnel category between NCOs and officers, not commissioned; they are placed at OR-8 and OR-9. All three junior lieutenant ranks are placed at OF-1."
