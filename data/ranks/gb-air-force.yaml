note: "Rank names follow the RAF's ranks page and recruitment site; name_en repeats the English rank name. NATO codes come from Table 3-1 (corresponding ranks of the three services) of the King's Regulations for the Royal Navy, October 2025. That table still uses the RAF's older junior titles, so the codes of the current junior ranks are marked approximate. The RAF has no OR-8 rank. Marshal of the Royal Air Force (OF-10) is left out: APersP-01 lists it as applicable in wartime only. Sergeant Aircrew and Flight Sergeant Aircrew are aircrew forms of Sergeant and Flight Sergeant and are not listed separately."
