# Ranks researched 2026-11-22 in a Claude Code session (web search).
id: es-navy
country: ES
branch: navy
force: Armada
force_en: Spanish Navy
note: "Rank names follow Ley 39/2007 de la carrera militar, art. 21 (basic designations); NATO codes follow the Spanish column of NATO APersP-01 (STANAG 2116, Ed. A V3, June 2022). APersP-01 has no Spanish OR-1 and places the NCO ranks higher than many secondary tables do (e.g. sargento at OR-7 where they give OR-5 or OR-6); the NATO table is followed here. Students of the military academies may hold provisional ranks (alférez, sargento, soldado) under art. 68.2; only guardiamarina, the naval cadets' title listed by APersP-01, is shown. Marines (Infantería de Marina) use soldado instead of marinero."
ranks:
