# Ranks researched 2026-11-22 in a Claude Code session (web search).
id: pl-navy
country: PL
branch: navy
force: Marynarka Wojenna
force_en: Polish Navy
note: Rank names follow Art. 135(3) of the Homeland Defence Act (consolidated text Dz.U. 2025 poz. 825). NATO codes follow the Polish column of NATO APersP-01 (STANAG 2116, Ed. A V3), which has no Polish OR-7 and no OF-D. English names are the official translations set by Decision No. 133/MON (2017). "Podchorąży" (officer cadet at a military university) is a title used with the holder's rank, not a rank, and is not listed.
ranks:
