  - { id: pl-navy-starszy-marynarz, name: Starszy marynarz, name_en: Seaman, code: OR-1, group: enlisted, note: "APersP-01 places it at OR-1 together with marynarz.", source: s2 }
  - { id: pl-navy-starszy-marynarz-specjalista, name: Starszy marynarz specjalista, name_en: Senior seaman specialist, code: OR-1, approximate: true, group: enlisted, note: "Introduced by the 2022 Homeland Defence Act as the senior enlisted rank; not in APersP-01 Ed. A V3 and no official English name found (literal translation). Placed with the other enlisted ranks at OR-1, below mat (OR-2).", source: s1 }
  - { id: pl-navy-mat, name: Mat, name_en: Petty Officer 3rd Class, code: OR-2, group: nco, note: "Junior NCO (podoficer młodszy) under Polish law, although APersP-01 codes it OR-2.", source: s2 }
  - { id: pl-navy-starszy-mat, name: Starszy mat, name_en: Petty Officer 2nd Class, code: OR-3, group: nco, note: "APersP-01 Ed. A V3 gives OR-3; some references give OR-4.", source: s2 }
