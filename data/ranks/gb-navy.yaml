note: "Names and NATO codes from the King's Regulations for the Royal Navy (October 2025): the order of rates in article 0361 and Table 3-1, whose code column applies to the Royal Navy. name_en repeats the English rank name. The older APersP-01 (2022) still lists no Royal Navy OR-8 and a Junior Rating at OR-1; the newer national regulations are followed. Admiral of the Fleet (OF-10) is left out: APersP-01 lists it as applicable in wartime only. Royal Marines (part of the Naval Service) use army-style ranks and are not listed."
