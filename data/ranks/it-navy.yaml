# Ranks researched 2026-11-22 in a Claude Code session (web search).
id: it-navy
country: IT
branch: navy
force: Marina Militare
force_en: Italian Navy
note: Rank names and order follow the Codice dell'ordinamento militare (D.Lgs. 66/2010, arts. 628-631, text in force on Normattiva); NATO codes follow the Italian column of NATO APersP-01 (STANAG 2116, Ed. A V3, June 2022). The code has since renamed the OR-3 grade (sottocapo, now comune scelto) and the top graduati grades (APersP-01 lists sottocapo di 1a classe scelto and its qualifica speciale), so their codes are taken by position. Italy has no official English rank names; the English given are translations. Officer cadets (allievi ufficiali) hold no rank and are not listed. Some corps use other flag-officer titles (see notes).
ranks:
