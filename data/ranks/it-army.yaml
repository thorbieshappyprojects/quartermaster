# Ranks researched 2026-11-22 in a Claude Code session (web search).
id: it-army
country: IT
branch: army
force: Esercito Italiano
force_en: Italian Army
note: Rank names and order follow the Codice dell'ordinamento militare (D.Lgs. 66/2010, arts. 628-631, text in force on Normattiva); NATO codes follow the Italian column of NATO APersP-01 (STANAG 2116, Ed. A V3, June 2022). The code has since renamed the graduati (APersP-01 still lists primo caporal maggiore to caporal maggiore capo scelto qualifica speciale at OR-4), so their codes are taken by position. Italy has no official English rank names; the English given are translations. Officer cadets (allievi ufficiali) hold no rank and are not listed. Some corps use other general-officer titles (see notes).
ranks:
  - { id: it-army-soldato, name: Soldato, name_en: Private, code: OR-1, group: enlisted, note: "Strictly a soldier without rank (militare di truppa senza alcun grado).", source: s4 }
  - { id: it-army-caporale, name: Caporale, name_en: Corporal, code: OR-2, group: enlisted, source: s4 }
  - { id: it-army-caporal-maggiore, name: Caporal maggiore, name_en: Senior corporal, code: OR-3, group: enlisted, source: s4 }
  - { id: it-army-graduato, name: Graduato, name_en: Leading soldier, code: OR-4, group: enlisted, note: "Lowest grade of the graduati (career volunteers); formerly primo caporal maggiore. OR-4 by position: APersP-01 places all graduati at OR-4.", source: s3 }
  - { id: it-army-graduato-scelto, name: Graduato scelto, name_en: Senior leading soldier, code: OR-4, group: enlisted, note: "OR-4 by position (see graduato).", source: s3 }
  - { id: it-army-graduato-capo, name: Graduato capo, name_en: Chief leading soldier, code: OR-4, group: enlisted, note: "OR-4 by position (see graduato).", source: s3 }
  - { id: it-army-primo-graduato, name: Primo graduato, name_en: First leading soldier, code: OR-4, group: enlisted, note: "Top grade of the graduati. OR-4 by position (see graduato).", source: s3 }
  - { id: it-army-graduato-aiutante, name: Graduato aiutante, name_en: "Leading soldier, adjutant", code: OR-4, group: enlisted, note: "A qualification (qualifica) conferred on a primo graduato, ranking above peers; not a separate grade. OR-4 by position (see graduato).", source: s3 }
  - { id: it-army-sergente, name: Sergente, name_en: Sergeant, code: OR-5, group: nco, source: s5 }
  - { id: it-army-sergente-maggiore, name: Sergente maggiore, name_en: Senior sergeant, code: OR-6, group: nco, source: s5 }
  - { id: it-army-sergente-maggiore-capo, name: Sergente maggiore capo, name_en: Chief senior sergeant, code: OR-7, group: nco, source: s5 }
  - { id: it-army-sergente-maggiore-aiutante, name: Sergente maggiore aiutante, name_en: "Senior sergeant, adjutant", code: OR-7, group: nco, note: "A qualification conferred on a sergente maggiore capo, ranking above peers; APersP-01 (2022) lists the title sergente maggiore capo qualifica speciale at OR-7.", source: s2 }
  - { id: it-army-maresciallo, name: Maresciallo, name_en: Marshal, code: OR-8, group: nco, note: "Marescialli form the senior NCO career, roughly the warrant-officer level of other armies.", source: s5 }
  - { id: it-army-maresciallo-ordinario, name: Maresciallo ordinario, name_en: Ordinary marshal, code: OR-8, group: nco, source: s5 }
  - { id: it-army-maresciallo-capo, name: Maresciallo capo, name_en: Chief marshal, code: OR-8, group: nco, source: s5 }
  - { id: it-army-primo-maresciallo, name: Primo maresciallo, name_en: First marshal, code: OR-9, group: nco, source: s5 }
  - { id: it-army-luogotenente, name: Luogotenente, name_en: "Luogotenente (senior NCO)", code: OR-9, group: nco, note: "Highest NCO grade; not an officer despite the name.", source: s5 }
  - { id: it-army-primo-luogotenente, name: Primo luogotenente, name_en: "First luogotenente (senior NCO)", code: OR-9, group: nco, note: "A qualification conferred on a luogotenente, ranking above peers.", source: s5 }
  - { id: it-army-sottotenente, name: Sottotenente, name_en: Second lieutenant, code: OF-1, group: officer, source: s5 }
  - { id: it-army-tenente, name: Tenente, name_en: Lieutenant, code: OF-1, group: officer, source: s5 }
