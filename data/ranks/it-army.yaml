  - { id: it-army-generale-di-brigata, name: Generale di brigata, name_en: Brigadier general, code: OF-6, group: general_flag, note: "Titled brigadiere generale in the transport and materiel arm and the logistic corps.", source: s5 }
  - { id: it-army-generale-di-divisione, name: Generale di divisione, name_en: Major general, code: OF-7, group: general_flag, note: "Titled maggiore generale in the transport and materiel arm and the logistic corps.", source: s5 }
  - { id: it-army-generale-di-corpo-d-armata, name: Generale di corpo d'armata, name_en: Lieutenant general, code: OF-8, group: general_flag, note: "Titled tenente generale in the transport and materiel arm and the logistic corps.", source: s5 }
  - { id: it-army-generale, name: Generale, name_en: General, code: OF-9, group: general_flag, note: "Highest rank; Italy has no OF-10.", source: s1 }
