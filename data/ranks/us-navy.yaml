note: Titles and NATO codes follow the US column of NATO APersP-01 (STANAG 2116, Ed. A V3); warrant officers W-1..W-5 are coded WO-1..WO-5 as in its US note. Enlisted grades are formally "rates". Command, Fleet and Force Master Chief are positions held by master chief petty officers and are not listed. Fleet Admiral (five-star, wartime only) is not listed; APersP-01 gives no US OF-10. Midshipmen are not a rank grade and are not listed.
