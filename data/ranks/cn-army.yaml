# Ranks researched 2026-11-22 in a Claude Code session (web search).
id: cn-army
country: CN
branch: army
force: "Zhongguo Renmin Jiefangjun Lujun"
force_en: "People's Liberation Army Ground Force"
nato_graded: false
note: "Native name 中国人民解放军陆军. Names are toneless pinyin; the Chinese form is in each note (enlisted ranks carry the service prefix 陆军 under the 2022 decision). China is not graded in the NATO scheme, so every code is an approximate equivalent. Basis: the rank's position in the statutory sequence and the Western rank whose English title the PLA translation uses (e.g. Sergeant = OR-5, Colonel = OF-5). Senior colonel/senior captain (大校) sits between colonel and the one-star rank and is placed at OF-6; the general/flag ranks then follow at OF-7 to OF-9, although by star count (one to three stars, no four-star rank) they would sit one grade lower. Master sergeant classes 3 and 2 are both placed at OR-8 and class 1 at OR-9. Officer ranks follow the 1988 regulation as amended in 1994 (ten ranks; the 2021 officer reforms kept ranks and grades); enlisted ranks follow the NPC Standing Committee decision in force since 31 March 2022. Officer cadets (学员) hold no rank and are left out. The 2022 decision renamed the former 上士 as 二级上士 and the former 四级军士长 (master sergeant class 4) as 一级上士."
