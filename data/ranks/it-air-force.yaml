  - { id: it-air-force-aviere-capo, name: Aviere capo, name_en: Chief airman, code: OR-4, group: enlisted, note: "Lowest grade of the graduati (career volunteers).", source: s5 }
  - { id: it-air-force-primo-aviere-scelto, name: Primo aviere scelto, name_en: Senior first airman, code: OR-4, group: enlisted, source: s5 }
