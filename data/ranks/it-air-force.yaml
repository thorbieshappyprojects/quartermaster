  - { id: it-air-force-primo-graduato, name: Primo graduato, name_en: First leading airman, code: OR-4, group: enlisted, note: "Top grade of the graduati; formerly primo aviere capo scelto. OR-4 by position: APersP-01 places all graduati at OR-4.", source: s3 }
  - { id: it-air-force-graduato-aiutante, name: Graduato aiutante, name_en: "Leading airman, adjutant", code: OR-4, group: enlisted, note: "A qualification conferred on a primo graduato, ranking above peers; not a separate grade. OR-4 by position.", source: s3 }
  - { id: it-air-force-sergente, name: Sergente, name_en: Sergeant, code: OR-5, group: nco, source: s5 }
