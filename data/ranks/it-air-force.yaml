  - { id: it-air-force-generale-di-squadra-aerea, name: Generale di squadra aerea, name_en: Air lieutenant general, code: OF-8, group: general_flag, note: "Also titled generale di squadra or generale ispettore capo depending on the role or corps.", source: s5 }
