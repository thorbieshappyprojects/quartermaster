  - { id: it-air-force-maresciallo-di-3a-classe, name: Maresciallo di 3ª classe, name_en: "Marshal, 3rd class", code: OR-8, group: nco, note: "Marescialli form the senior NCO career, roughly the warrant-officer level of other air forces.", source: s5 }
  - { id: it-air-force-maresciallo-di-2a-classe, name: Maresciallo di 2ª classe, name_en: "Marshal, 2nd class", code: OR-8, group: nco, source: s5 }
