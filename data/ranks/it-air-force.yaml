# Ranks researched 2026-11-22 in a Claude Code session (web search).
id: it-air-force
country: IT
branch: air_force
force: Aeronautica Militare
force_en: Italian Air Force
note: Rank names and order follow the Codice dell'ordinamento militare (D.Lgs. 66/2010, arts. 628-631, text in force on Normattiva); NATO codes follow the Italian column of NATO APersP-01 (STANAG 2116, Ed. A V3, June 2022). The code has since renamed the top graduati grade (APersP-01 lists primo aviere capo scelto and its qualifica speciale), so its code is taken by position. Italy has no official English rank names; the English given are translations. Officer cadets (allievi ufficiali) hold no rank and are not listed. Some corps use other general-officer titles (see notes).
ranks:
  - { id: it-air-force-aviere, name: Aviere, name_en: Airman, code: OR-1, group: enlisted, note: "Strictly an airman without rank (militare di truppa senza alcun grado).", source: s4 }
  - { id: it-air-force-aviere-scelto, name: Aviere scelto, name_en: Senior airman, code: OR-2, group: enlisted, source: s4 }
