# Ranks researched 2026-11-22 in a Claude Code session (web search).
id: nl-navy
country: NL
branch: navy
force: Koninklijke Marine
force_en: Royal Netherlands Navy
note: "Fleet ranks. Names and order follow the Ministry of Defence rank brochure; NATO codes follow the NLD column of NATO APersP-01 (STANAG 2116, Ed. A V3, June 2022). English names are usual equivalents, not official titles. Where APersP-01 spreads one rank over two codes, the lower code is used and the rank note says so. The Korps Mariniers (marines) is part of the navy but uses army-style ranks with the suffix 'der mariniers' (e.g. marinier der 1e klasse, kapitein der mariniers); they are not listed separately. Officer cadets (adelborsten) are not shown in the brochure or APersP-01 and are left out."
ranks:
