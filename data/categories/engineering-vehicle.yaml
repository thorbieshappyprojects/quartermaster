category_card:
  summary: "Bridging, recovery and engineering vehicles are specialised, usually armoured, platforms that keep friendly forces moving: they include combat engineer and breaching vehicles fitted with mine ploughs, dozer blades or mine-clearing line charges; armoured vehicle-launched bridges and bridging systems; and armoured repair and recovery vehicles. They are often built on main battle tank or infantry fighting vehicle chassis and are operated by engineer and maintenance units to support combat units rather than to fight directly."
  purpose:
    - text: Armoured engineer vehicles such as the British Army's Trojan are used to breach minefields and open routes through complex obstacles so that tanks and other vehicles of a battlegroup can pass safely.
      source: s10
    - text: Bridge-laying vehicles such as Titan launch military bridges over wet and dry gaps so that forces can cross obstacles and stay mobile.
      source: s9
    - text: Armoured recovery vehicles tow and repair damaged armoured vehicles under battlefield conditions, which matters because modern armoured vehicles are often damaged rather than destroyed.
      source: s5
  strengths:
    - text: Heavy engineer vehicles can be protected to main battle tank standard; Titan and Trojan use the same type of armour as the Challenger 2 and share its chassis, giving a common heavy fleet.
      source: s9
    - text: Against prepared defences, the ability to breach obstacles and cross gaps can decide whether an offensive gets far enough for its logistics, fires and reserves to matter at all.
      source: s2
    - text: Modern bridge-layers can work from difficult banks and terrain, launch bridges in tandem, bridge over urban obstacles and carry a mine plough, so one platform can do several mobility tasks.
      source: s9
    - text: Recovering and repairing damaged vehicles helps armoured units stay ready for operations; Ukraine has even converted captured Russian T-62 tanks into recovery vehicles to meet demand.
      source: s5
  weaknesses:
    - text: Breaching vehicles are usually small fleets of 'prestige' assets; in Ukraine's 2023 offensive one corps had only 10 demining vehicles, which overheated during sustained ploughing, and usually only the lead vehicle in each breach had a mine plough.
      source: s12
    - text: Assault breacher vehicles are high-value targets, which puts their crews at greater risk.
      source: s8
    - text: Bridging operations are carried out in exposed positions without overhead cover, and US Army analysis warns of a possible large shortfall of tactical bridging assets for a large-scale war.
      source: s1
    - text: Recovery crews are especially exposed when they leave the vehicle to attach shackles and tow bars, and in Ukraine recovery work is often found and targeted within minutes.
      source: s4
  counters:
    - text: FPV drones, non-line-of-sight anti-tank guided missiles and drone-designated artillery can be fired from concealed positions, which undermines traditional tank overwatch and makes a mission kill against engineering vehicles highly likely.
      source: s12
    - text: In the failed Russian crossing of the Siverskyi Donets in May 2022, Ukrainian drones spotted the bridging effort and directed artillery fire onto it because the crossing lacked air and missile defence and area security.
      source: s3
    - text: Defenders adapt their obstacles to wear down breaching equipment; Russian engineers stacked anti-tank mines on top of each other to defeat Ukrainian mine rollers and laid belts with four or more rows of mines covered by artillery.
      source: s1
    - text: Analysis cited by ESD recommends training manoeuvre units to target enemy engineer and minelaying assets before they can lay minefields, reducing the need for deep, observed breaches.
      source: s6
  trends:
    - text: RUSI argues that engineering units need more vehicles that are simpler and less flexible, so that numbers can grow affordably, and that mission modules mounted on other armoured vehicles should be prioritised.
      source: s12
    - text: "Unmanned breaching is being tested: the US Army planned a live trial in October 2025 in which a 12-ton unmanned ground vehicle from DARPA's RACER programme towed and fired a mine-clearing line charge, and it has contracted remote-operation kits for the Assault Breacher Vehicle."
      source: s7
    - text: Recovery vehicles are being upgraded based on Ukraine combat experience; Russia's modernised BREM-80, delivered in 2026, adds anti-drone protection and a towing coupling that crews can attach without leaving the armour.
      source: s4
    - text: Western armies are giving renewed attention to contested wet-gap crossing, where small drones and satellites make deception and protection of the crossing force essential.
      source: s11
