# Category card researched 2026-11-22 in a Claude Code session (web search).
id: frigate-destroyer
name: Frigates and destroyers
domain: Naval
wave: 3
indicators:
  - { id: displacement, label: Displacement (full load), unit: t, trump: higher_wins }
  - { id: length, label: Length, unit: m, trump: higher_wins, decimals: 1 }
  - { id: max_speed, label: Max. speed, unit: kn, trump: higher_wins }
  - { id: range, label: Range, unit: nmi, trump: higher_wins }
  - { id: vls_cells, label: Vertical launch cells, unit: "", trump: higher_wins }
  - { id: crew, label: Crew (core), unit: "", trump: lower_wins, description: Fewer crew means more automation; a playful convention. }
category_card:
  summary: "Frigates and destroyers are the main ocean-going surface combatants of modern navies, typically displacing about 5,000 to 13,000 tonnes. They escort carriers, amphibious groups and merchant shipping and carry missiles, guns, sonars and helicopters for air, surface, submarine and land-attack missions."
  purpose:
    - text: "US Aegis destroyers of the DDG-51 class are multi-mission ships with an emphasis on air defence, and many of them can also conduct ballistic missile defence."
      source: s1
    - text: "China's Type 055, with 112 vertical launch cells, is designed to provide area air defence while escorting aircraft carriers in blue waters."
      source: s2
    - text: "Germany's F125 frigates are designed for maritime stabilisation operations, fire support from sea to land, countering asymmetric threats at sea and supporting special forces."
      source: s3
  strengths:
    - text: "In about six months in the Red Sea in 2023-24 the US destroyer USS Carney destroyed Houthi land-attack cruise missiles, anti-ship ballistic missiles and drones, 65 targets in total by the Navy's count."
      source: s4
    - text: "The F125 design is meant to stay deployed for up to two years at a time with about 5,000 operating hours per year, using a two-crew concept."
      source: s3
    - text: "In April 2024 the British destroyer HMS Diamond used its Sea Viper missile system to shoot down a missile fired by the Houthis at a merchant ship in the Gulf of Aden."
      source: s5
  weaknesses:
    - text: "The US Navy has no real capacity to rearm Mk 41 or Mk 57 vertical launch cells at sea, so a ship that has fired its missiles must return to port to reload."
      source: s6
    - text: "Interceptors such as the Aster 15, estimated at about EUR 1 million each, are expensive compared with drones that cost a few thousand dollars."
      source: s7
    - text: "Large, complex ships are costly to build: a US DDG-51 destroyer costs about USD 2.5 billion, and the Pentagon comptroller said in 2023 that US yards could not yet build two destroyers a year."
      source: s1
    - text: "During a Red Sea engagement in March 2024 the Danish frigate Iver Huitfeldt's radar locked up after three drones were downed, leaving its air-defence missiles unusable for about half an hour."
      source: s8
  counters:
    - text: "Large raids of drones and missiles can overwhelm shipboard defences and quickly empty missile magazines."
      source: s6
    - text: "Anti-ship ballistic missiles, cruise missiles and one-way attack drones were all used against warships and shipping in the Red Sea in 2023-24."
      source: s4
    - text: "Cheap observation drones can scout for more lethal attacks, which is one reason the French Navy argues for shooting them down even with costly missiles."
      source: s7
  trends:
    - text: "Frigates are getting more missile cells: the US Constellation-class requirement grew from 16 to 32 vertical launch cells during the competition."
      source: s6
    - text: "The US Navy plans to move from the DDG-51 to the DDG(X) destroyer around FY2030, incorporating future concepts such as directed-energy weapons and improved signatures."
      source: s1
    - text: "China has expanded its large surface combatant fleet quickly: CSIS counted eight Type 055 ships built and launched by Dalian and Jiangnan shipyards."
      source: s2
    - text: "The retirement of the US Ticonderoga-class cruisers removes 1,586 vertical launch cells, and the US Navy expects total VLS capacity to fall until about 2030."
      source: s6
