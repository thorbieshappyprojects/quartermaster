category_card:
  summary: A main battle tank is a heavily armoured, usually tracked combat vehicle that combines a large-calibre direct-fire main gun, armour protection and cross-country mobility in a single platform. It is the main heavy direct-fire system of armoured and mechanised ground forces and is normally used alongside infantry, artillery, engineers and air defence.
  purpose:
    - text: "US Army doctrine gives the tank platoon the same mission as the Armor Branch: to close with and destroy enemy forces using fire, manoeuvre and shock effect, or to repel an enemy assault by fire and counterattack."
      source: s1
    - text: Tanks are designed mainly to defeat the standing armies of peer or near-peer states, and a 2026 RUSI Journal analysis of the Russo-Ukrainian War argues that they remain essential to combined-arms operations despite drones and precision-guided munitions.
      source: s10
    - text: In the Russo-Ukrainian War, armour has often been used in a fire-support role, delivering accurate direct fire against enemy positions and carrying out gun raids, rather than mainly for breakthrough attempts.
      source: s4
  strengths:
    - text: US Army doctrine describes the tank platoon as providing a combination of firepower, mobility and armour protection that does not exist elsewhere in the US Army, and states that a tank's armour can be decisive in large-scale combat.
      source: s1
    - text: Analysis of early Ukraine-war losses found tanks far more survivable than other armoured vehicles; crews often survived hits that disabled the tank's weapons or mobility, and without tanks, armies would have to use lighter vehicles that suffer more catastrophic losses.
      source: s3
    - text: RUSI field research in 2023 found Russian explosive reactive armour highly effective, stopping most anti-tank systems from defeating the tank's armour.
      source: s4
    - text: A US Army general described the Abrams as exceptionally well protected against direct fire from other tanks and fighting vehicles, and said main battle tanks are most effective in the offence or when able to move.
      source: s6
  weaknesses:
    - text: Tanks are among the most logistics-intensive items of equipment, needing routine maintenance, spare parts and large amounts of fuel, and they need infantry to protect them from enemy anti-tank teams, especially in urban terrain.
      source: s3
    - text: US Army doctrine notes that a tank platoon may have operational and tactical mobility problems because of its vehicles' weight.
      source: s1
    - text: Current designs such as the Abrams were not built to resist top-attack threats (diving anti-tank missiles, loitering munitions and drones), and the US Army says tanks become vulnerable to many threats when stationary.
      source: s6
    - text: "High-intensity war causes heavy attrition: the IISS estimated that Russia lost about 1,400 main battle tanks in 2024 and more than 4,000 since February 2022, and that new production plus refurbishment of stored vehicles would not make up for these losses indefinitely."
      source: s7
  counters:
    - text: First-person-view (FPV) drones can manoeuvre to strike the side, top or rear where armour is weaker; in Ukraine this forced Ukrainian armoured vehicles to stay 3-10 km behind the front line, which left armoured counterattacks highly vulnerable.
      source: s5
    - text: Top-attack anti-tank guided missiles, loitering munitions and low-cost FPV drones (reported at under USD 500 each) are seen by US Army planners as the key new threat to all combat vehicles.
      source: s6
    - text: In early 2022, artillery and Soviet-era anti-tank mines destroyed many Russian tanks, and dismounted anti-tank teams were effective where tanks lacked infantry support; anti-tank guided missiles were not the main cause of losses.
      source: s3
    - text: "Established threats remain alongside drones: anti-tank guided missiles, rocket-propelled grenades and mines, while persistent aerial surveillance makes concealment and evasion harder."
      source: s8
  trends:
    - text: The US Army replaced its planned Abrams SEPv4 upgrade with the more ambitious M1E3. The aim is a lighter tank with a smaller logistics footprint, better top-attack protection, a built-in active protection system, signature reduction and a modular open systems architecture, with fielding targeted for the early 2030s.
      source: s6
    - text: Active protection systems are moving from optional add-ons to standard fit; for example, Germany has ordered Trophy for its Leopard 2s and plans to make it standard on future versions.
      source: s8
    - text: Both sides in Ukraine have fitted improvised overhead cages or screens against drones and top-attack weapons; on Russian tanks such as the T-90, these have been reported to have only limited success.
      source: s9
    - text: Russian forces have added thermal camouflage and other modifications, together with changed tactics, which have significantly reduced how easily their tanks can be detected at stand-off ranges.
      source: s4
