  - id: max_speed
    label: Max. speed
    unit: Mach
    trump: higher_wins
    decimals: 2
  - id: combat_radius
    label: Combat radius
    unit: km
    trump: higher_wins
  - id: service_ceiling
    label: Service ceiling
    unit: m
    trump: higher_wins
