category_card:
  summary: Fighter aircraft are fast, manoeuvrable fixed-wing combat aircraft built mainly to gain and keep control of the air by engaging enemy aircraft and missiles, and most current types are multirole aircraft that can also attack targets on the ground. In-service fleets include fourth-generation aircraft and fifth-generation low-observable aircraft. Sixth-generation crewed fighters and uncrewed collaborative combat aircraft are in development.
  purpose:
    - text: In US Air Force counterair doctrine, fighters fly sweep missions to find and destroy enemy aircraft and escort missions to protect other aircraft, including high-value airborne assets, to gain local or theatre air superiority.
      source: s1
    - text: Air forces such as Israel's treat air superiority as a precondition for other operations; in 2025 Israel gained it over Iran in under four days, which let its aircraft operate freely, while Russia has not achieved it over Ukraine.
      source: s2
    - text: In Ukraine, fighters are used mostly for air defence against massed cruise missile and one-way attack drone raids, and also make stand-off strikes on battlefield targets with glide bombs.
      source: s7
  strengths:
    - text: "Multirole flexibility: Ukraine's F-16s are assessed as its most flexible and effective fighters across all mission types, including air defence, suppression of air defences with AGM-88 HARM and glide-bomb attacks."
      source: s7
    - text: Fifth-generation aircraft combine stealth with large computing power; in 2025 Israeli F-35Is flew ahead of F-15I/F-16I strike packages in a reconnaissance role, which made the older aircraft more effective.
      source: s2
    - text: Stand-off weapons let fighters deliver heavy firepower without entering defended airspace; Russian Su-34s release guided glide bombs from at least 60 km, and up to 130 km in some conditions, while staying under their own air defence cover.
      source: s3
  weaknesses:
    - text: "Cost and production speed: unit cost has historically risen more than tenfold every 20 years, the next US fighter is expected to cost several hundred million dollars per aircraft, and F-35s arrive two to three years after they are ordered."
      source: s5
    - text: Older non-stealth fighters such as the F-16, Rafale and Typhoon may not be able to enter airspace defended by capable Russian air defences without significant risk, and air defences have pushed crewed aircraft to stand-off distances that reduce their effectiveness.
      source: s4
    - text: "Fighters depend on vulnerable bases and support aircraft: a significant share of Russian aircraft losses have been on the ground from drone and ATACMS strikes on airbases, and Chinese missiles can threaten tankers and forward air bases 1,000 km or more away."
      source: s3
    - text: Airframe hours and missiles are limited; using fighters against cheap drones has used up an unsustainable number of flying hours and air-to-air missiles, and airframes need deep factory maintenance after a set number of hours.
      source: s7
  counters:
    - text: "Ground-based integrated air defence systems: Russia's surface-to-air missile coverage, several hundred batteries that are still being produced and upgraded, remains the main threat to NATO air power in Europe."
      source: s3
    - text: "Dispersed, mobile air defences: Ukraine prevented Russia from gaining air superiority by moving and dispersing its SAM units, using shoot-and-scoot tactics, and switching radars on and off to defeat anti-radiation missiles."
      source: s2
    - text: Opposing fighters with long-range air-to-air missiles, working with early-warning aircraft and SAMs; examples are Russian Su-35S fleets armed mainly with R-37M missiles and China's fast-growing J-20 and J-16 fleets armed with PL-15 and PL-17 missiles.
      source: s3
    - text: "Attacks on the ground: counterair doctrine targets enemy airfields, runways, fuel, launch sites and command and control to stop enemy aircraft from operating."
      source: s1
  trends:
    - text: Sixth-generation fighters are being designed for greater range, speed, payload and stealth against both radar and infrared sensors, with all-round sensor fusion; low-speed dogfighting performance is a lower priority.
      source: s6
    - text: Crewed fighters are being teamed with uncrewed collaborative combat aircraft; the US Air Force plans to field thousands of cheaper autonomous aircraft to add combat capacity without the cost of more crewed fighters.
      source: s5
    - text: Air forces are adopting cheaper weapons for intercepting drones; Ukrainian F-16 pilots use the 20 mm cannon and APKWS II laser-guided rockets against drones to save air-to-air missiles for cruise missiles.
      source: s7
    - text: The war in Ukraine suggests that low-observable aircraft such as the F-35, paired with electronic warfare, may be essential to gain air superiority over capably defended territory, and it may push NATO allies to invest more in uncrewed and penetrating technologies.
      source: s4
