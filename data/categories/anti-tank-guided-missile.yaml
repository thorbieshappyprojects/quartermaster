category_card:
  summary: Anti-tank guided missiles (ATGMs) are precision-guided munitions designed primarily to defeat armoured vehicles, launched by dismounted infantry or from vehicles, helicopters, drones and boats. Guidance ranges from operator-steered wire or laser systems (SACLOS) to fire-and-forget infrared seekers, and most carry unitary or tandem shaped-charge (HEAT) warheads.
  purpose:
    - text: ATGMs give infantry, including predominantly light infantry forces, the ability to defeat mechanised forces with much greater firepower, as demonstrated by Ukrainian units against Russian armour in 2022.
      source: s5
    - text: Although designed primarily against main battle tanks and other armoured vehicles, ATGMs are also employed against bunkers, soft targets such as fuel and ammunition stores or parked aircraft, and low-flying helicopters.
      source: s2
    - text: Massed ATGMs held by defending infantry can blunt an armoured advance, a lesson drawn from the 1973 Yom Kippur War and observed again in Ukraine.
      source: s3
  strengths:
    - text: Modern HEAT warheads are very difficult to stop, with many able to penetrate more than 1,000 mm of solid steel.
      source: s3
    - text: Third-generation systems combine lock-on-before-launch ('fire-and-forget'), letting crews relocate immediately after firing, with top-attack trajectories that strike the weaker roof armour of tanks.
      source: s1
    - text: ATGMs are small, portable, can be fired from cover and fitted to many platforms from light vehicles to helicopters and unmanned systems, and are comparatively low-cost relative to the armoured vehicles they target.
      source: s2
    - text: Western ATGMs supplied to Ukraine, such as Javelin and NLAW, proved valuable despite minimal operator training.
      source: s3
  weaknesses:
    - text: SACLOS guidance exposes the shooter, who must stay in position until impact and remains vulnerable to counterattack.
      source: s2
    - text: In Ukraine, ATGM teams with 4-5 km range operating close to enemy lines are frequently detected by reconnaissance drones and engaged by artillery or loitering munitions before they can fire.
      source: s1
    - text: Advanced ATGMs are complex and slow to produce; Javelin has a 32-month delivery lead time, so replacing large stocks transferred to Ukraine would take several years.
      source: s5
    - text: "Hits do not always yield kills: in Lebanon in 2006 more than 50 Israeli Merkava tanks were hit by ATGMs, of which 21 were penetrated and 10 suffered casualties."
      source: s3
  counters:
    - text: Hard-kill active protection systems such as Trophy detect, track and neutralise incoming ATGMs in flight and report the shooter's location to the crew.
      source: s7
    - text: Russian forces reduced the kill probability of several ATGM types beyond about 1,400 m by using anti-thermal materials, altering engine-deck heat plumes and fighting during dawn and dusk thermal crossover.
      source: s4
    - text: Combined-arms manoeuvre, rather than tanks advancing alone or in small groups without infantry support, limits the effect of ATGMs.
      source: s3
    - text: Improved vehicle survivability measures, such as electric turret drives replacing flammable hydraulics and safer ammunition storage, help tanks survive ATGM hits.
      source: s3
  trends:
    - text: Requirements are moving toward longer stand-off ranges, such as the US CCMS-H goal of 8 km or more in cooperative engagement, partly to remain relevant alongside loitering munitions, which have so far complemented rather than replaced ATGMs.
      source: s1
    - text: Missiles are becoming more versatile, with soft-launch for confined spaces, multipurpose or modular warheads and operator-selectable fuzing such as air-burst and delayed impact.
      source: s1
    - text: Combat experience in Ukraine has driven remote-controlled launchers to improve crew survivability, while manufacturers develop AI-assisted target acquisition.
      source: s1
    - text: Ukraine has exposed a mismatch between the slow acquisition and rapid consumption of precision weapons such as Javelin, prompting calls for allied munitions production capacity above annual need.
      source: s6
