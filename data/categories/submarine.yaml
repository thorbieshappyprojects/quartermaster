category_card:
  summary: "Submarines are warships that operate submerged, relying on concealment rather than armour for survival. Nuclear-powered attack submarines (SSNs) can stay submerged for months, while conventional diesel-electric boats (SSKs), some with air-independent propulsion, are smaller, cheaper and mostly used closer to home waters."
  purpose:
    - text: "US congressional analysts describe attack submarines as general-purpose boats used for covert intelligence, surveillance and reconnaissance and for anti-submarine warfare, valued for their ability to evade an opponent's anti-access/area-denial forces."
      source: s1
    - text: "Attack submarines also protect high-value forces: the French Navy plans to use its new SSNs to escort its ballistic-missile submarines and to protect its aircraft carrier."
      source: s7
    - text: "Submarines are increasingly long-range strike platforms. Russian Black Sea Fleet diesel-electric boats armed with Kalibr cruise missiles took part in operations in Syria and in the war against Ukraine."
      source: s6
  strengths:
    - text: "Stealth: US analysts credit the acoustic superiority of US nuclear-powered submarines with a large asymmetric advantage, because a submarine that cannot be found is hard to counter."
      source: s1
    - text: "Nuclear-powered boats can circumnavigate the globe submerged and make their own oxygen and drinking water, so endurance is limited mainly by food."
      source: s4
    - text: "Fuel-cell air-independent propulsion lets conventional boats such as the German Type 212A stay submerged far longer than purely diesel-electric boats, with very low magnetic and acoustic signatures."
      source: s3
  weaknesses:
    - text: "Submarines are expensive and slow to build: a US Virginia-class boat with the payload module costs about USD 4.5 billion, and US production has been held to about 1.2 boats per year since 2022 instead of the planned two."
      source: s1
    - text: "Maintenance backlogs reduce availability: the number of US SSNs waiting for or in maintenance rose from 11 in FY2012 to 16, substantially cutting the number ready at any moment."
      source: s1
    - text: "Long-range strike from submarines depends on outside targeting data. RUSI judges that Russia lacks the satellite and patrol-aircraft 'system of systems' needed to complete the kill chain consistently."
      source: s2
  counters:
    - text: "Anti-submarine barriers at choke points (such as the gap between Greenland, Iceland and the UK) are a classic counter, but RUSI notes that long-range missiles fired from the High North reduce their value and push the problem to forward positions."
      source: s2
    - text: "Boats are vulnerable in port: Ukraine's SBU said in December 2025 that underwater drones had hit a Russian Project 636.3 submarine at Novorossiysk (claim not independently confirmed)."
      source: s5
    - text: "Heavyweight torpedoes from other submarines are the main threat underwater; Russia's Yasen-M carries six 324 mm launchers that fire decoys to divert incoming torpedoes."
      source: s2
  trends:
    - text: "Nuclear-powered submarines are spreading to new operators: under AUKUS the United States plans to sell Australia three to five Virginia-class boats."
      source: s1
    - text: "Attack submarines carry more missiles: the US Virginia Payload Module adds an 84-foot mid-body section with four large-diameter launch tubes for up to 28 more Tomahawk missiles."
      source: s1
    - text: "Russian attack submarines are shifting from hunter-killer roles towards long-range strike with cruise missiles, including the hypersonic Zircon."
      source: s2
    - text: "Conventional submarines are moving to lithium-ion batteries; Naval Group's Scorpène Evolved ordered by Indonesia in 2024 uses a full lithium-ion battery configuration."
      source: s8
