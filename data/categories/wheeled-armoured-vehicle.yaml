category_card:
  summary: Wheeled armoured vehicles are protected vehicles that run on tyres rather than tracks, usually in 4x4, 6x6 or 8x8 layouts. They are used as armoured personnel carriers, wheeled infantry fighting vehicles, reconnaissance, fire-support and air-defence platforms. Compared with tracked vehicles they generally offer more road speed and range and a lighter support burden. In exchange they have less off-road mobility in soft ground and less room for added weight and armour.
  purpose:
    - text: A 2019 RUSI study argued that a wheeled mechanised infantry vehicle suits a brigade that must deploy itself by road over long distances. Its reasons were the long range, large carrying capacity and reliability typical of these vehicles.
      source: s3
    - text: Current US Army doctrine for Stryker infantry platoons and squads is written for a peer threat. It has infantry use the vehicles' tactical mobility to close with the enemy and fight in close combat.
      source: s8
    - text: Wheeled vehicles also carry large-calibre guns for direct fire support. Examples include Japan's Type 16 with a 105 mm gun and the US Stryker Mobile Gun System used in Iraq and Afghanistan. These vehicles cannot absorb the level of fire that a tank can.
      source: s1
  strengths:
    - text: "A RAND assessment for the Australian Defence Science and Technology Group found three advantages for wheeled vehicles over tracked ones: better on-road mobility, lower maintenance costs and less crew and squad fatigue."
      source: s2
    - text: Large 8x8 designs can cover long road distances under their own power. RUSI cites Boxer as reaching 100 km/h with a range of over 1,000 km, and a Stryker operational range of about 550 km.
      source: s3
    - text: In urban areas and on roads, wheeled vehicles generally show better tactical agility and operational mobility than tracked equivalents at lower cost. On sandy soils their traction can approach that of tracked vehicles.
      source: s1
  weaknesses:
    - text: Off-road mobility is lower in weak or wet soils. Simulations cited by ESD show an 8x8 producing about 79.2% of a tracked vehicle's thrust on firmer soil, falling to as little as 50.4% on loam.
      source: s1
    - text: Tyres cannot be enlarged to carry more weight, so there is limited room to add armour and weapons. Heavier armour packages further reduce off-road mobility. RAND found that tracked vehicles have the advantage in weight growth and in the ability to fight and survive.
      source: s2
    - text: Reliability drops with extensive off-road use. When US Strykers in Iraq were fitted with extra armour, they suffered heavy tyre and wheel-station wear and drivetrain damage.
      source: s1
    - text: Claims of strategic air mobility have been overstated before. In 2004 GAO reported that expectations for moving Strykers by C-130 within a theatre needed to be clarified. It also found Stryker off-road mobility to be lower than that of tracked vehicles.
      source: s10
  counters:
    - text: Drones saturate the front in Ukraine. CSIS reports that armoured vehicles that are deployed can face dozens of attacks per vehicle per day.
      source: s7
    - text: In Ukraine, small drones and loitering munitions have been added to established anti-armour threats rather than replacing them. Those threats include anti-tank guided missiles, guided artillery munitions and mines. A vehicle is often immobilised first and then finished off by drones.
      source: s6
    - text: The US Congressional Research Service has pointed to reports of significant damage that anti-tank guided missiles and uncrewed aerial systems have done to infantry fighting vehicles in Ukraine.
      source: s11
    - text: Medium-calibre cannon and heavy machine guns threaten lighter designs. Wheeled vehicles of the BTR-3, BTR-4 and BTR-80 type are protected only against 12.7 mm rounds across the frontal arc. Heavier Western designs such as Boxer and Piranha 5 can be armoured against 30 mm rounds across the frontal arc.
      source: s1
  trends:
    - text: Fleets in service are being refitted against drones. The Netherlands' Boxer midlife update adds a remote weapon station with counter-drone capability so that crews can detect and defeat hostile drones themselves.
      source: s4
    - text: Active protection systems are being integrated on 8x8 vehicles. KNDS Deutschland and EuroTrophy announced in September 2025 that Trophy had been integrated on a pre-series Boxer armoured personnel carrier prototype, with live-fire testing as the next step.
      source: s5
    - text: Wheeled chassis are being used for mobile short-range air defence and counter-drone vehicles that move with manoeuvre forces. Germany ordered one verification vehicle and 18 production Boxer Skyranger 30 systems under a contract worth EUR 595 million.
      source: s9
    - text: Western wheeled vehicles have become heavier as armour and complexity have been added. Ukraine's use of lighter BTR-family vehicles has renewed debate over whether lighter 6x6 and 8x8 designs with more accepted risk are a better fit.
      source: s1
